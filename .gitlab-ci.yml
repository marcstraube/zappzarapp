# GitLab CI/CD Pipeline Configuration
# For more information, see: https://docs.gitlab.com/ee/ci/

variables:
  COMPOSE_PROJECT_NAME: zappzarapp-ci
  ENV: development
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

# Define pipeline stages
stages:
  - build
  - test
  - quality
  - security
  - deploy

# Common setup for Docker-based jobs
.docker-setup: &docker-setup
  image: docker:24-cli
  services:
    - docker:24-dind
  before_script:
    - apk add --no-cache docker-compose curl bash make openssl
    - docker compose version
    # Build goss utility image (dependency for other Dockerfiles)
    - docker build -t zappzarapp-goss:latest -f docker/goss/Dockerfile .
    # Initialize environment and generate secrets
    - make init
    - make secrets
    - make ssl-selfsigned
    # Create empty lockfiles if missing (boilerplate doesn't commit them)
    # Required for bind mounts in compose.override.yaml - Docker creates
    # directories instead of files when mounting non-existent paths
    - "[ -f pnpm-lock.yaml ] || touch pnpm-lock.yaml"
    - "[ -f composer.lock ] || echo '{}' > composer.lock"
    # Make lockfiles writable by container user (www-data/node)
    - chmod 666 pnpm-lock.yaml composer.lock
  after_script:
    - docker compose down -v || true
    - docker system prune -f || true

# ============================================================================
# BUILD STAGE
# ============================================================================
build:php:
  <<: *docker-setup
  stage: build
  script:
    - docker compose build php
  artifacts:
    reports:
      dotenv: build.env
  cache:
    key: php-vendor-$CI_COMMIT_REF_SLUG
    paths:
      - vendor/

build:node:
  <<: *docker-setup
  stage: build
  script:
    - docker compose build node
  cache:
    key: node-modules-$CI_COMMIT_REF_SLUG
    paths:
      - node_modules/
      - .pnpm-store/

build:nginx:
  <<: *docker-setup
  stage: build
  script:
    - docker compose build nginx

# ============================================================================
# PHP QUALITY CHECKS
# ============================================================================
php:coding-standards:
  <<: *docker-setup
  stage: quality
  dependencies:
    - build:php
  script:
    # Use PHP_SKIP_DEPENDENCY_CHECK=1 to skip dependency check in entrypoint (deps installed via exec)
    - PHP_SKIP_DEPENDENCY_CHECK=1 docker compose up -d php
    - docker compose exec -T php composer install --no-progress --no-interaction
    - docker compose exec -T php composer cs-check
  artifacts:
    reports:
      codequality: php-cs-report.json
    when: always

php:static-analysis:
  <<: *docker-setup
  stage: quality
  dependencies:
    - build:php
  script:
    # Use PHP_SKIP_DEPENDENCY_CHECK=1 to skip dependency check in entrypoint (deps installed via exec)
    - PHP_SKIP_DEPENDENCY_CHECK=1 docker compose up -d php
    - docker compose exec -T php composer install --no-progress --no-interaction
    - docker compose exec -T php composer analyse
  artifacts:
    reports:
      codequality: phpstan-report.json
    when: always

php:mess-detector:
  <<: *docker-setup
  stage: quality
  dependencies:
    - build:php
  script:
    # Use PHP_SKIP_DEPENDENCY_CHECK=1 to skip dependency check in entrypoint (deps installed via exec)
    - PHP_SKIP_DEPENDENCY_CHECK=1 docker compose up -d php
    - docker compose exec -T php composer install --no-progress --no-interaction
    - docker compose exec -T php composer phpmd || true
  allow_failure: true

php:rector-check:
  <<: *docker-setup
  stage: quality
  dependencies:
    - build:php
  script:
    # Use PHP_SKIP_DEPENDENCY_CHECK=1 to skip dependency check in entrypoint (deps installed via exec)
    - PHP_SKIP_DEPENDENCY_CHECK=1 docker compose up -d php
    - docker compose exec -T php composer install --no-progress --no-interaction
    - docker compose exec -T php composer rector-check
  allow_failure: true

# ============================================================================
# PHP TESTS
# ============================================================================
php:unit-tests:
  <<: *docker-setup
  stage: test
  dependencies:
    - build:php
  script:
    # Use PHP_SKIP_DEPENDENCY_CHECK=1 to skip dependency check in entrypoint (deps installed via exec)
    - PHP_SKIP_DEPENDENCY_CHECK=1 docker compose --profile postgres up -d php postgres
    - docker compose exec -T php composer install --no-progress --no-interaction
    - timeout 30 sh -c 'until docker compose exec -T postgres pg_isready -U app; do sleep 1; done'
    - docker compose exec -T php composer test
  coverage: '/^\s*Lines:\s*\d+.\d+\%/'
  artifacts:
    reports:
      junit: build/phpunit-report.xml
      coverage_report:
        coverage_format: cobertura
        path: build/coverage/cobertura.xml
    when: always

php:coverage:
  <<: *docker-setup
  stage: test
  dependencies:
    - build:php
  only:
    - master
    - develop
  script:
    # Use PHP_SKIP_DEPENDENCY_CHECK=1 to skip dependency check in entrypoint (deps installed via exec)
    - PHP_SKIP_DEPENDENCY_CHECK=1 docker compose --profile postgres up -d php postgres
    - docker compose exec -T php composer install --no-progress --no-interaction
    - docker compose exec -T php sh -c 'XDEBUG_MODE=coverage vendor/bin/phpunit --coverage-html build/coverage --coverage-clover build/coverage/clover.xml'
  artifacts:
    paths:
      - build/coverage/
    expire_in: 30 days

# ============================================================================
# NODE.JS QUALITY CHECKS
# ============================================================================
node:lint:
  <<: *docker-setup
  stage: quality
  dependencies:
    - build:node
  script:
    # Use idle mode to skip dependency check (deps installed via exec)
    - NODE_MODE=idle docker compose up -d node
    # Use --frozen-lockfile if lockfile exists AND is non-empty (user project)
    # Otherwise generate lockfile (boilerplate without committed lockfiles)
    - docker compose exec -T node sh -c 'if [ -f pnpm-lock.yaml ] && [ -s pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install --no-lockfile; fi'
    - docker compose exec -T node pnpm run lint

node:format-check:
  <<: *docker-setup
  stage: quality
  dependencies:
    - build:node
  script:
    # Use idle mode to skip dependency check (deps installed via exec)
    - NODE_MODE=idle docker compose up -d node
    # Use --frozen-lockfile if lockfile exists AND is non-empty (user project)
    # Otherwise generate lockfile (boilerplate without committed lockfiles)
    - docker compose exec -T node sh -c 'if [ -f pnpm-lock.yaml ] && [ -s pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install --no-lockfile; fi'
    - docker compose exec -T node pnpm run format:check

node:type-check:
  <<: *docker-setup
  stage: quality
  dependencies:
    - build:node
  script:
    # Use idle mode to skip dependency check (deps installed via exec)
    - NODE_MODE=idle docker compose up -d node
    # Use --frozen-lockfile if lockfile exists AND is non-empty (user project)
    # Otherwise generate lockfile (boilerplate without committed lockfiles)
    - docker compose exec -T node sh -c 'if [ -f pnpm-lock.yaml ] && [ -s pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install --no-lockfile; fi'
    - docker compose exec -T node pnpm run type-check

node:markdownlint:
  <<: *docker-setup
  stage: quality
  dependencies:
    - build:node
  script:
    # Use idle mode to skip dependency check (deps installed via exec)
    - NODE_MODE=idle docker compose up -d node
    # Use --frozen-lockfile if lockfile exists AND is non-empty (user project)
    # Otherwise generate lockfile (boilerplate without committed lockfiles)
    - docker compose exec -T node sh -c 'if [ -f pnpm-lock.yaml ] && [ -s pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install --no-lockfile; fi'
    - docker compose exec -T node pnpm run lint:md

# ============================================================================
# NODE.JS TESTS
# ============================================================================
node:tests:
  <<: *docker-setup
  stage: test
  dependencies:
    - build:node
  script:
    # Use idle mode to skip dependency check (deps installed via exec)
    - NODE_MODE=idle docker compose --profile redis up -d node redis
    # Use --frozen-lockfile if lockfile exists AND is non-empty (user project)
    # Otherwise generate lockfile (boilerplate without committed lockfiles)
    - docker compose exec -T node sh -c 'if [ -f pnpm-lock.yaml ] && [ -s pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install --no-lockfile; fi'
    - timeout 30 sh -c 'until docker compose exec -T redis redis-cli --tls --insecure ping; do sleep 1; done'
    - docker compose exec -T node pnpm test
  coverage: '/All files\s*\|\s*(\d+\.?\d*)\s*\|/'
  artifacts:
    reports:
      junit: build/vitest-report.xml
      coverage_report:
        coverage_format: cobertura
        path: build/coverage/cobertura-coverage.xml
    when: always

node:coverage:
  <<: *docker-setup
  stage: test
  dependencies:
    - build:node
  only:
    - master
    - develop
  script:
    # Use idle mode to skip dependency check (deps installed via exec)
    - NODE_MODE=idle docker compose --profile redis up -d node redis
    # Use --frozen-lockfile if lockfile exists AND is non-empty (user project)
    # Otherwise generate lockfile (boilerplate without committed lockfiles)
    - docker compose exec -T node sh -c 'if [ -f pnpm-lock.yaml ] && [ -s pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install --no-lockfile; fi'
    - docker compose exec -T node pnpm test:coverage
  artifacts:
    paths:
      - build/coverage/
    expire_in: 30 days

# ============================================================================
# BATS TESTS (Makefile Validation)
# ============================================================================
bats:quick:
  <<: *docker-setup
  stage: test
  script:
    - make bats-build
    - make bats-test-junit
  artifacts:
    reports:
      junit: build/bats-report.xml
    when: always

bats:integration:
  <<: *docker-setup
  stage: test
  needs:
    - bats:quick
  only:
    - master
    - develop
    - merge_requests
  script:
    - make bats-build
    - make build
    - make up
    - make composer-install
    - make pnpm-install
    - timeout 120 sh -c 'until make check-health 2>/dev/null; do sleep 5; done'
    - make bats-test-integration
  after_script:
    - make down || true
    - docker system prune -f || true
  timeout: 30m

# ============================================================================
# DEPENDENCY AUDIT
# ============================================================================
# Note: Comprehensive security scans (Trivy, secrets, filesystem) are defined
# in .gitlab/security-scan.gitlab-ci.yml and run on a weekly schedule.
# ============================================================================
dependency-audit:
  <<: *docker-setup
  stage: security
  dependencies:
    - build:php
    - build:node
  script:
    # Use idle mode for node and skip PHP dependency check (deps installed via exec)
    - PHP_SKIP_DEPENDENCY_CHECK=1 NODE_MODE=idle docker compose up -d php node
    - docker compose exec -T php composer install --no-progress --no-interaction
    # Use --frozen-lockfile if lockfile exists AND is non-empty (user project)
    # Otherwise generate lockfile (boilerplate without committed lockfiles)
    - docker compose exec -T node sh -c 'if [ -f pnpm-lock.yaml ] && [ -s pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install --no-lockfile; fi'
    - docker compose exec -T php composer audit
    - docker compose exec -T node pnpm audit
  allow_failure: true

# ============================================================================
# PRODUCTION BUILD TEST
# ============================================================================
build:production:
  <<: *docker-setup
  stage: deploy
  only:
    - master
    - develop
  script:
    # Generate SSL certificates for nginx
    - make ssl-selfsigned
    # Create empty lockfiles if missing (boilerplate doesn't commit them)
    # Required for DOCKER_BUILDKIT=0 which doesn't support empty COPY wildcards
    - "[ -f composer.lock ] || echo '{}' > composer.lock"
    - "[ -f pnpm-lock.yaml ] || touch pnpm-lock.yaml"
    # Build node-backend first, then tag for cross-image COPY compatibility
    - docker compose -f compose.yaml -f compose.production.yaml --profile node-backend build node-backend
    - docker tag ${COMPOSE_PROJECT_NAME}-node-backend:api zappzarapp-node-backend:latest
    # Disable BuildKit for php/nginx build so they can see the local tagged image
    - DOCKER_BUILDKIT=0 ENV=production docker compose -f compose.yaml -f compose.production.yaml build php nginx
    # Start and test
    - ENV=production docker compose -f compose.yaml -f compose.production.yaml up -d
    - sleep 10
    - docker compose ps
    - docker compose logs
    - curl -f http://localhost:8080/health || exit 1
  artifacts:
    when: on_success
    expire_in: 7 days

