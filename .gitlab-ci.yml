# GitLab CI/CD Pipeline Configuration
# For more information, see: https://docs.gitlab.com/ee/ci/

variables:
  # Note: COMPOSE_PROJECT_NAME intentionally not set here - uses value from .env
  # to ensure consistency between docker compose build and make up (which sources .env)
  ZAPPZARAPP_ENV: development
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  # Use CI-specific compose file (no lockfile bind mounts)
  COMPOSE_FILE: compose.yaml:compose.ci.yaml

# ============================================================================
# PIPELINE CONTROL
# ============================================================================
# - auto_cancel: cancel superseded runs whose jobs are interruptible (saves
#   runner minutes). build:production is marked interruptible:false so the
#   deployable-artifact validation always completes (mirrors the GitHub
#   Actions concurrency master-exemption).
# - workflow rules: run MR pipelines; skip the redundant branch pipeline when
#   an MR is open for that branch (avoids duplicate pipelines).
# ============================================================================
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

default:
  interruptible: true

# ============================================================================
# PATH FILTERS (rules:changes) - only run the jobs a change needs.
# Mirrors .github/workflows/ci.yml. Every set includes the CI config itself,
# so a pipeline-config change re-runs the full suite (the `ci` override).
# ============================================================================
.ci-paths: &ci-paths
  - .gitlab-ci.yml
  - .gitlab/**/*

.php-paths: &php-paths
  - "**/*.php"
  - composer.json
  - composer.lock
  - phpstan*.neon
  - phpunit.xml*
  - phpdoc.xml
  - phpmd.xml*
  - rector.php
  - .php-cs-fixer*.php
  - .gitlab-ci.yml
  - .gitlab/**/*

.node-paths: &node-paths
  - "**/*.ts"
  - "**/*.tsx"
  - "**/*.js"
  - "**/*.cjs"
  - resources/**/*
  - package.json
  - pnpm-lock.yaml
  - pnpm-workspace.yaml
  - tsconfig*.json
  - eslint.config.*
  - .prettier*
  - vitest.config.*
  - .gitlab-ci.yml
  - .gitlab/**/*

# Markdown and Prettier-config changes gate the standalone docs:lint job.
# .prettier* sits in both node and docs: a Prettier config change gates source
# formatting (node:quality) and Markdown formatting (docs:lint).
.docs-paths: &docs-paths
  - "**/*.md"
  - .markdownlint*
  - .prettier*
  - .gitlab-ci.yml
  - .gitlab/**/*

.infra-paths: &infra-paths
  - "**/Dockerfile*"
  - docker/**/*
  - compose*.yaml
  - compose*.yml
  - Makefile
  - "**/*.sh"
  - tests/**/*
  - goss*.yaml
  - .gitlab-ci.yml
  - .gitlab/**/*

# php + node + infra combined (production build and cross-language scans)
.app-paths: &app-paths
  - "**/*.php"
  - composer.json
  - composer.lock
  - "**/*.ts"
  - "**/*.tsx"
  - "**/*.js"
  - "**/*.cjs"
  - resources/**/*
  - package.json
  - pnpm-lock.yaml
  # Carries the overrides + supply-chain policy the dependency audit resolves against
  - pnpm-workspace.yaml
  - "**/Dockerfile*"
  - docker/**/*
  - compose*.yaml
  - compose*.yml
  - Makefile
  - "**/*.sh"
  - .gitlab-ci.yml
  - .gitlab/**/*

# Define pipeline stages
# Stages are cosmetic groupings only: every job declares `needs:` (a DAG), so
# execution order follows dependencies, not stage order. This mirrors the
# GitHub Actions workflow, where jobs run in parallel gated only by `changes`.
# Image reuse works WITHOUT a serial build job: each job builds its dev image
# with a BuildKit registry layer cache (cache-from/to type=registry). The cache
# lives in the registry, not on the (ephemeral) runner, so it persists across
# pipelines — a warm cache skips the PHP-extension / Node-toolchain compile even
# on gitlab.com shared runners. This is the direct analogue of GitHub's
# `type=gha` layer cache (see .github/workflows/ci.yml).
stages:
  - test
  - quality
  - security
  - deploy

# Common setup for Docker-based jobs
.docker-setup: &docker-setup
  image: docker:29-cli
  services:
    - docker:29-dind
  before_script:
    - apk add --no-cache docker-compose curl bash make openssl
    - docker compose version
    # Build goss utility image (dependency for other Dockerfiles)
    - docker build -t zappzarapp-goss:latest -f docker/goss/Dockerfile .
    # Initialize environment and generate secrets
    - make init
    - make secrets
    - make ssl-internal
    # Create lockfile for bind mount (compose.ci.yaml)
    - "[ -f pnpm-lock.yaml ] || touch pnpm-lock.yaml"
  after_script:
    - docker compose down -v || true
    - docker system prune -f || true

# ============================================================================
# BUILDKIT REGISTRY LAYER CACHE (hidden helper scripts, inlined via !reference)
# ============================================================================
# Each job builds its dev image on a docker-container buildx builder with a
# persistent registry layer cache. cache-from pulls warm layers from a previous
# pipeline (stable ref $CI_REGISTRY_IMAGE/cache:<svc>, NOT per-commit), so the
# expensive PHP-extension / Node-toolchain compile is skipped on warm runs; the
# fresh image is --load'ed into the dind daemon so `docker compose up` reuses it.
# `ignore-error=true` on cache-to means a disabled/absent registry (some
# self-hosted instances) degrades to an uncached build instead of failing.
# The builder is NOT set as default, so `docker compose`'s implicit builds of
# dependency services (postgres, redis) still use the default docker builder.
.buildx-php:
  script:
    - docker login -u gitlab-ci-token -p "$CI_JOB_TOKEN" "$CI_REGISTRY"
    - docker buildx inspect ci >/dev/null 2>&1 || docker buildx create --name ci --driver docker-container
    - docker buildx bake --builder ci -f compose.yaml -f compose.ci.yaml php --set "php.cache-from=type=registry,ref=$CI_REGISTRY_IMAGE/cache:php" --set "php.cache-to=type=registry,ref=$CI_REGISTRY_IMAGE/cache:php,mode=max,ignore-error=true" --load

.buildx-node:
  script:
    - docker login -u gitlab-ci-token -p "$CI_JOB_TOKEN" "$CI_REGISTRY"
    - docker buildx inspect ci >/dev/null 2>&1 || docker buildx create --name ci --driver docker-container
    - docker buildx bake --builder ci -f compose.yaml -f compose.ci.yaml node --set "node.cache-from=type=registry,ref=$CI_REGISTRY_IMAGE/cache:node" --set "node.cache-to=type=registry,ref=$CI_REGISTRY_IMAGE/cache:node,mode=max,ignore-error=true" --load

# ============================================================================
# PHP QUALITY CHECKS
# ============================================================================
# Single job builds the PHP image once and runs every static check in sequence,
# mirroring the GitHub Actions `php-quality` job. phpmd and rector-check are
# blocking here (as on GitHub) rather than allow_failure — the codebase already
# passes them on the authoritative GitHub pipeline.
php:quality:
  <<: *docker-setup
  stage: quality
  needs: []
  rules:
    - changes: *php-paths
  script:
    - !reference [.buildx-php, script]
    - docker compose up -d php
    - sleep 5
    - docker compose exec -T php composer install --no-progress --no-interaction
    - docker compose exec -T php composer cs-check
    - docker compose exec -T php composer analyse
    - docker compose exec -T php composer phpmd
    - docker compose exec -T php composer rector-check
    - docker compose exec -T php composer validate
  artifacts:
    reports:
      codequality:
        - php-cs-report.json
        - phpstan-report.json
    when: always

# ============================================================================
# PHP TESTS
# ============================================================================
# Coverage runs inside the test job and is gated by make coverage-check-php,
# mirroring the GitHub php-tests job (no separate coverage job - that would
# re-run the whole suite). clover feeds the gate, cobertura the GitLab MR
# diff-coverage view, --coverage-text the `coverage:` keyword.
php:unit-tests:
  <<: *docker-setup
  stage: test
  needs: []
  rules:
    - changes: *php-paths
  script:
    - !reference [.buildx-php, script]
    - docker compose --profile postgres up -d php postgres
    - sleep 5
    - docker compose exec -T php composer install --no-progress --no-interaction
    - timeout 30 sh -c 'until docker compose exec -T postgres pg_isready -U app; do sleep 1; done'
    - docker compose exec -T php sh -c 'XDEBUG_MODE=coverage vendor/bin/phpunit --coverage-clover build/coverage/php/clover.xml --coverage-cobertura build/coverage/php/cobertura.xml --coverage-text'
    - make coverage-check-php
  coverage: '/^\s*Lines:\s*\d+.\d+\%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: build/coverage/php/cobertura.xml
    when: always

# ============================================================================
# NODE.JS QUALITY CHECKS
# ============================================================================
# Single job builds the Node image once and runs every check in sequence,
# mirroring the GitHub Actions `node-quality` job.
node:quality:
  <<: *docker-setup
  stage: quality
  needs: []
  rules:
    - changes: *node-paths
  script:
    - !reference [.buildx-node, script]
    - docker compose up -d node
    - sleep 5
    - docker compose exec -T node pnpm install
    - docker compose exec -T node pnpm run type-check
    - docker compose exec -T node pnpm run lint
    - docker compose exec -T node pnpm run format:check
    - docker compose exec -T node pnpm run quality

# ============================================================================
# DOCS LINT (Markdown)
# ============================================================================
# Lints Markdown: markdownlint plus Prettier's Markdown format check. The pinned
# tools install into the parent directory so Prettier resolves prettier-plugin-toml
# (declared in .prettierrc.json) via ESM lookup from the repo root.
# .markdownlint-cli2.jsonc / .prettierrc.json / .prettierignore are
# auto-discovered from the repo root.
# ============================================================================
docs:lint:
  stage: quality
  image: node:24-alpine
  needs: []
  rules:
    - changes: *docs-paths
  script:
    - (cd .. && npm init -y >/dev/null 2>&1 && npm install --no-audit --no-fund markdownlint-cli2@0.23.1 prettier@3.9.6 prettier-plugin-toml@2.0.6)
    - ../node_modules/.bin/markdownlint-cli2 '**/*.md' '#node_modules'
    - ../node_modules/.bin/prettier --check '**/*.md' '!node_modules/**'

# ============================================================================
# NODE.JS TESTS
# ============================================================================
# Mirrors the GitHub node-tests job: plain test run on every pipeline, the
# coverage run (gated by the vitest thresholds) only on master.
node:tests:
  <<: *docker-setup
  stage: test
  needs: []
  rules:
    - changes: *node-paths
  script:
    - !reference [.buildx-node, script]
    - docker compose --profile redis up -d node redis
    - sleep 5
    - docker compose exec -T node pnpm install
    - timeout 30 sh -c 'until docker compose exec -T redis redis-cli --tls --insecure ping; do sleep 1; done'
    - docker compose exec -T node pnpm test

node:coverage:
  <<: *docker-setup
  stage: test
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      changes: *node-paths
  script:
    - !reference [.buildx-node, script]
    - docker compose --profile redis up -d node redis
    - sleep 5
    - docker compose exec -T node pnpm install
    - docker compose exec -T node pnpm test:coverage
  coverage: '/All files\s*\|\s*(\d+\.?\d*)\s*\|/'
  artifacts:
    paths:
      - build/coverage/
    expire_in: 30 days

# ============================================================================
# BATS TESTS (Makefile Validation)
# ============================================================================
bats:quick:
  <<: *docker-setup
  stage: test
  needs: []
  rules:
    - changes: *infra-paths
  script:
    - make bats-build
    - make bats-test-junit
  artifacts:
    reports:
      junit: build/bats-report.xml
    when: always

bats:integration:
  <<: *docker-setup
  stage: test
  # Expensive (~30 min): only on MRs and master/develop, and only when
  # Docker/Compose/Shell/Makefile/tests actually changed.
  rules:
    # Opt-out for resource-limited runners: set the CI/CD variable
    # SKIP_INTEGRATION_TESTS=true to skip this job. The full stack + make-target
    # suite is sensitive to weak shared runners; where it is skipped, integration
    # coverage is expected to come from a stronger environment (e.g. GitHub CI).
    - if: '$SKIP_INTEGRATION_TESTS == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *infra-paths
    - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "develop"'
      changes: *infra-paths
  needs:
    - bats:quick
  script:
    - make bats-build
    # Create empty lockfiles (Dockerfile COPY needs them)
    - "[ -f composer.lock ] || echo '{}' > composer.lock"
    - "[ -f pnpm-lock.yaml ] || touch pnpm-lock.yaml"
    # Create dependency directories (compose.ci.yaml uses bind mounts for BATS tests)
    - mkdir -p vendor node_modules src/node/backend/node_modules src/node/frontend/node_modules backups/db docs/api/php docs/api/node-backend docs/api/node-frontend tools
    # Build the dev stack via docker buildx bake (docker-bake.hcl). dev-target
    # stages have no cross-image COPY; --load exports the images to the daemon so
    # `make up` finds them. node-backend is built too (:latest tag expected by some
    # BATS checks). Mirrors the GitHub integration job.
    - docker buildx inspect ci >/dev/null 2>&1 || docker buildx create --name ci --driver docker-container
    - docker buildx bake --builder ci -f docker-bake.hcl --load dev node-backend
    - make up
    - make composer-install
    - make pnpm-install
    - timeout 120 sh -c 'until make check-health 2>/dev/null; do sleep 5; done'
    # Opt-in ACME end-to-end suite (Pebble), mirrors the GitHub job
    - BATS_ENABLE_ACME_E2E=true make bats-test-integration
  after_script:
    - make down || true
    - docker system prune -f || true
  timeout: 30m

# ============================================================================
# FRONTEND FRAMEWORK SCAFFOLDS (scheduled drift test)
# ============================================================================
# Mirror of the GitHub "Frontend Framework Scaffolds" workflow: scaffold each
# framework headless at @latest, build its production image, validate the build
# output via GOSS. Catches upstream template drift in the post-install patches.
# Schedule-only + opt-in variable so it does not run on unrelated schedules.
# UNVERIFIED until September (GitLab minutes paused) — runs in the prerelease phase.
frontend-frameworks:
  <<: *docker-setup
  stage: test
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $FRONTEND_FRAMEWORKS_TEST == "true"'
  variables:
    # CI compose overlay: no lockfile bind mounts (deps resolve fresh in-image)
    COMPOSE_FILE: "compose.yaml:compose.ci.yaml"
  parallel:
    matrix:
      - FRAMEWORK: [nuxt, next, remix, sveltekit]
  script:
    # Warm/load the node dev image so the scaffold container is ready
    - !reference [.buildx-node, script]
    # Scaffold the framework headless (FORCE=1: no TTY prompts in CI)
    - make node-frontend-$FRAMEWORK FORCE=1
    # A green build IS the passing suite: the test-framework stage runs
    # `goss validate` on the base spec + the scaffold-generated framework spec.
    - docker buildx inspect ci >/dev/null 2>&1 || docker buildx create --name ci --driver docker-container
    - docker buildx bake --builder ci -f docker-bake.hcl node-test-framework
  timeout: 30m

# ============================================================================
# SAST ANALYSIS (Semgrep)
# ============================================================================
sast:semgrep:
  image: python:3.14-alpine
  stage: security
  needs: []
  rules:
    - changes: *app-paths
  before_script:
    - apk add --no-cache git
    - pip install semgrep==1.172.0
  script:
    - |
      semgrep scan \
        --config p/security-audit \
        --config p/secrets \
        --config p/php \
        --config p/typescript \
        --json \
        --output semgrep-report.json \
        --error \
        . || true
  artifacts:
    reports:
      sast: semgrep-report.json
    paths:
      - semgrep-report.json
    when: always
    expire_in: 30 days
  allow_failure: true

# ============================================================================
# DEPENDENCY AUDIT
# ============================================================================
# Note: Comprehensive security scans (Trivy, secrets, filesystem) are defined
# in .gitlab/security-scan.gitlab-ci.yml and run on a weekly schedule.
# ============================================================================
dependency-audit:
  <<: *docker-setup
  stage: security
  needs: []
  rules:
    - changes: *app-paths
  script:
    - !reference [.buildx-php, script]
    - !reference [.buildx-node, script]
    - docker compose up -d php node
    - sleep 5
    - docker compose exec -T php composer install --no-progress --no-interaction
    - docker compose exec -T node pnpm install
    - docker compose exec -T php composer audit
    - docker compose exec -T node pnpm audit
  allow_failure: true

# ============================================================================
# PRODUCTION BUILD TEST
# ============================================================================
build:production:
  <<: *docker-setup
  stage: deploy
  needs: []
  # Validates the deployable artifact - must complete, so never interrupted.
  interruptible: false
  rules:
    # Opt-out for resource-limited runners: set the CI/CD variable
    # SKIP_PRODUCTION_BUILD=true to skip this job. It boots the full production
    # stack (nginx+php+node+db); on shared runners nginx cannot read the
    # cross-UID-owned SSL key. Where skipped, the production build is validated
    # in a stronger environment (e.g. GitHub CI).
    - if: '$SKIP_PRODUCTION_BUILD == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "develop"'
      changes: *app-paths
  script:
    # Generate SSL certificates for nginx
    - make ssl-internal
    # Create empty lockfiles for production build (Dockerfile COPY needs them)
    - "[ -f composer.lock ] || echo '{}' > composer.lock"
    - "[ -f pnpm-lock.yaml ] || touch pnpm-lock.yaml"
    # Production build via docker buildx bake (docker-bake.hcl). php/nginx production
    # COPY the Vite assets from node-backend through the tagless `node-backend-assets`
    # context (bake links target:node-backend). --load exports the images for
    # `make test-production`. Mirrors the GitHub build-production job.
    - docker buildx inspect ci >/dev/null 2>&1 || docker buildx create --name ci --driver docker-container
    - docker buildx bake --builder ci -f docker-bake.hcl --load production
    # Stop any existing containers before production test (prevent port/name conflicts)
    - docker compose down -v || true
    # Test production build using ZAPPZARAPP_ENV-aware target
    # Tests nginx + app (php/node) + database + activated services
    - ZAPPZARAPP_ENV=production make test-production
  after_script:
    - docker compose ps || true
    - docker compose logs --tail=100 || true
    - docker compose down -v || true
    - docker system prune -f || true
  artifacts:
    when: on_success
    expire_in: 7 days

