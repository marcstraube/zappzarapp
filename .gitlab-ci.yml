# GitLab CI/CD Pipeline Configuration
# For more information, see: https://docs.gitlab.com/ee/ci/

variables:
  COMPOSE_PROJECT_NAME: docker-webdev-ci
  ENV: development
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

# Define pipeline stages
stages:
  - build
  - test
  - quality
  - security
  - deploy

# Common setup for Docker-based jobs
.docker-setup: &docker-setup
  image: docker:24-cli
  services:
    - docker:24-dind
  before_script:
    - apk add --no-cache docker-compose curl bash
    - docker compose version

# ============================================================================
# BUILD STAGE
# ============================================================================
build:php:
  <<: *docker-setup
  stage: build
  script:
    - docker compose build php
  artifacts:
    reports:
      dotenv: build.env
  cache:
    key: php-vendor-$CI_COMMIT_REF_SLUG
    paths:
      - vendor/

build:node:
  <<: *docker-setup
  stage: build
  script:
    - docker compose build node
  cache:
    key: node-modules-$CI_COMMIT_REF_SLUG
    paths:
      - node_modules/
      - .pnpm-store/

build:nginx:
  <<: *docker-setup
  stage: build
  script:
    - docker compose build nginx

# ============================================================================
# PHP QUALITY CHECKS
# ============================================================================
php:coding-standards:
  <<: *docker-setup
  stage: quality
  dependencies:
    - build:php
  script:
    - docker compose up -d php
    - docker compose exec -T php composer install --no-progress --no-interaction
    - docker compose exec -T php composer cs-check
  artifacts:
    reports:
      codequality: php-cs-report.json
    when: always

php:static-analysis:
  <<: *docker-setup
  stage: quality
  dependencies:
    - build:php
  script:
    - docker compose up -d php
    - docker compose exec -T php composer install --no-progress --no-interaction
    - docker compose exec -T php composer analyse
  artifacts:
    reports:
      codequality: phpstan-report.json
    when: always

php:mess-detector:
  <<: *docker-setup
  stage: quality
  dependencies:
    - build:php
  script:
    - docker compose up -d php
    - docker compose exec -T php composer install --no-progress --no-interaction
    - docker compose exec -T php composer phpmd || true
  allow_failure: true

php:rector-check:
  <<: *docker-setup
  stage: quality
  dependencies:
    - build:php
  script:
    - docker compose up -d php
    - docker compose exec -T php composer install --no-progress --no-interaction
    - docker compose exec -T php composer rector-check
  allow_failure: true

# ============================================================================
# PHP TESTS
# ============================================================================
php:unit-tests:
  <<: *docker-setup
  stage: test
  dependencies:
    - build:php
  script:
    - docker compose --profile postgres up -d php postgres
    - docker compose exec -T php composer install --no-progress --no-interaction
    - timeout 30 sh -c 'until docker compose exec -T postgres pg_isready -U app; do sleep 1; done'
    - docker compose exec -T php composer test
  coverage: '/^\s*Lines:\s*\d+.\d+\%/'
  artifacts:
    reports:
      junit: build/phpunit-report.xml
      coverage_report:
        coverage_format: cobertura
        path: build/coverage/cobertura.xml
    when: always

php:coverage:
  <<: *docker-setup
  stage: test
  dependencies:
    - build:php
  only:
    - master
    - develop
  script:
    - docker compose --profile postgres up -d php postgres
    - docker compose exec -T php composer install --no-progress --no-interaction
    - docker compose exec -T php sh -c 'XDEBUG_MODE=coverage vendor/bin/phpunit --coverage-html build/coverage --coverage-clover build/coverage/clover.xml'
  artifacts:
    paths:
      - build/coverage/
    expire_in: 30 days

# ============================================================================
# NODE.JS QUALITY CHECKS
# ============================================================================
node:lint:
  <<: *docker-setup
  stage: quality
  dependencies:
    - build:node
  script:
    - docker compose up -d node
    - docker compose exec -T node pnpm install --frozen-lockfile
    - docker compose exec -T node pnpm run lint

node:format-check:
  <<: *docker-setup
  stage: quality
  dependencies:
    - build:node
  script:
    - docker compose up -d node
    - docker compose exec -T node pnpm install --frozen-lockfile
    - docker compose exec -T node pnpm run format:check

node:type-check:
  <<: *docker-setup
  stage: quality
  dependencies:
    - build:node
  script:
    - docker compose up -d node
    - docker compose exec -T node pnpm install --frozen-lockfile
    - docker compose exec -T node pnpm run type-check

# ============================================================================
# NODE.JS TESTS
# ============================================================================
node:tests:
  <<: *docker-setup
  stage: test
  dependencies:
    - build:node
  script:
    - docker compose --profile redis up -d node redis
    - docker compose exec -T node pnpm install --frozen-lockfile
    - timeout 30 sh -c 'until docker compose exec -T redis redis-cli ping; do sleep 1; done'
    - docker compose exec -T node pnpm test
  coverage: '/All files\s*\|\s*(\d+\.?\d*)\s*\|/'
  artifacts:
    reports:
      junit: build/vitest-report.xml
      coverage_report:
        coverage_format: cobertura
        path: build/coverage/cobertura-coverage.xml
    when: always

node:coverage:
  <<: *docker-setup
  stage: test
  dependencies:
    - build:node
  only:
    - master
    - develop
  script:
    - docker compose --profile redis up -d node redis
    - docker compose exec -T node pnpm install --frozen-lockfile
    - docker compose exec -T node pnpm test:coverage
  artifacts:
    paths:
      - build/coverage/
    expire_in: 30 days

# ============================================================================
# SECURITY SCANS
# ============================================================================
security:composer-audit:
  <<: *docker-setup
  stage: security
  dependencies:
    - build:php
  script:
    - docker compose up -d php
    - docker compose exec -T php composer install --no-progress --no-interaction
    - docker compose exec -T php composer audit || true
  allow_failure: true

security:pnpm-audit:
  <<: *docker-setup
  stage: security
  dependencies:
    - build:node
  script:
    - docker compose up -d node
    - docker compose exec -T node pnpm install --frozen-lockfile
    - docker compose exec -T node pnpm audit || true
  allow_failure: true

security:trivy-scan:
  image: aquasec/trivy:latest
  stage: security
  dependencies:
    - build:php
    - build:nginx
  script:
    - trivy image --severity HIGH,CRITICAL --format json --output trivy-php-report.json docker-webdev-ci-php:latest || true
    - trivy image --severity HIGH,CRITICAL --format json --output trivy-nginx-report.json docker-webdev-ci-nginx:latest || true
  artifacts:
    reports:
      container_scanning: trivy-php-report.json
    paths:
      - trivy-*.json
    when: always
  allow_failure: true

# ============================================================================
# PRODUCTION BUILD TEST
# ============================================================================
build:production:
  <<: *docker-setup
  stage: deploy
  only:
    - master
    - develop
  script:
    - ENV=production docker compose -f compose.yaml -f compose.prod.yaml build
    - ENV=production docker compose -f compose.yaml -f compose.prod.yaml up -d
    - sleep 10
    - docker compose ps
    - curl -f http://localhost:8080/health || exit 1
  after_script:
    - docker compose down -v
  artifacts:
    when: on_success
    expire_in: 7 days

# ============================================================================
# CLEANUP
# ============================================================================
.cleanup: &cleanup
  after_script:
    - docker compose down -v || true
    - docker system prune -f || true
