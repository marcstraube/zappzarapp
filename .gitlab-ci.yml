# GitLab CI/CD Pipeline Configuration
# For more information, see: https://docs.gitlab.com/ee/ci/

variables:
  # Note: COMPOSE_PROJECT_NAME intentionally not set here - uses value from .env
  # to ensure consistency between docker compose build and make up (which sources .env)
  ENV: development
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  # Use CI-specific compose file (no lockfile bind mounts)
  COMPOSE_FILE: compose.yaml:compose.ci.yaml

# Define pipeline stages
stages:
  - build
  - test
  - quality
  - security
  - deploy

# Common setup for Docker-based jobs
.docker-setup: &docker-setup
  image: docker:24-cli
  services:
    - docker:24-dind
  before_script:
    - apk add --no-cache docker-compose curl bash make openssl
    - docker compose version
    # Build goss utility image (dependency for other Dockerfiles)
    - docker build -t zappzarapp-goss:latest -f docker/goss/Dockerfile .
    # Initialize environment and generate secrets
    - make init
    - make secrets
    - make ssl-selfsigned
    # Create lockfile for bind mount (compose.ci.yaml)
    - "[ -f pnpm-lock.yaml ] || touch pnpm-lock.yaml"
  after_script:
    - docker compose down -v || true
    - docker system prune -f || true

# ============================================================================
# BUILD STAGE
# ============================================================================
build:php:
  <<: *docker-setup
  stage: build
  script:
    - docker compose build php
  artifacts:
    reports:
      dotenv: build.env
  cache:
    key: php-vendor-$CI_COMMIT_REF_SLUG
    paths:
      - vendor/

build:node:
  <<: *docker-setup
  stage: build
  script:
    - docker compose build node
  cache:
    key: node-modules-$CI_COMMIT_REF_SLUG
    paths:
      - node_modules/
      - .pnpm-store/

build:nginx:
  <<: *docker-setup
  stage: build
  script:
    - docker compose build nginx

# ============================================================================
# PHP QUALITY CHECKS
# ============================================================================
php:coding-standards:
  <<: *docker-setup
  stage: quality
  dependencies:
    - build:php
  script:
    - docker compose up -d php
    - sleep 5
    - docker compose exec -T php composer install --no-progress --no-interaction
    - docker compose exec -T php composer cs-check
  artifacts:
    reports:
      codequality: php-cs-report.json
    when: always

php:static-analysis:
  <<: *docker-setup
  stage: quality
  dependencies:
    - build:php
  script:
    - docker compose up -d php
    - sleep 5
    - docker compose exec -T php composer install --no-progress --no-interaction
    - docker compose exec -T php composer analyse
  artifacts:
    reports:
      codequality: phpstan-report.json
    when: always

php:mess-detector:
  <<: *docker-setup
  stage: quality
  dependencies:
    - build:php
  script:
    - docker compose up -d php
    - sleep 5
    - docker compose exec -T php composer install --no-progress --no-interaction
    - docker compose exec -T php composer phpmd || true
  allow_failure: true

php:rector-check:
  <<: *docker-setup
  stage: quality
  dependencies:
    - build:php
  script:
    - docker compose up -d php
    - sleep 5
    - docker compose exec -T php composer install --no-progress --no-interaction
    - docker compose exec -T php composer rector-check
  allow_failure: true

php:composer-validate:
  <<: *docker-setup
  stage: quality
  dependencies:
    - build:php
  script:
    - docker compose up -d php
    - sleep 5
    - docker compose exec -T php composer install --no-progress --no-interaction
    - docker compose exec -T php composer validate

# ============================================================================
# PHP TESTS
# ============================================================================
php:unit-tests:
  <<: *docker-setup
  stage: test
  dependencies:
    - build:php
  script:
    - docker compose --profile postgres up -d php postgres
    - sleep 5
    - docker compose exec -T php composer install --no-progress --no-interaction
    - timeout 30 sh -c 'until docker compose exec -T postgres pg_isready -U app; do sleep 1; done'
    - docker compose exec -T php composer test
  coverage: '/^\s*Lines:\s*\d+.\d+\%/'
  artifacts:
    reports:
      junit: build/phpunit-report.xml
      coverage_report:
        coverage_format: cobertura
        path: build/coverage/cobertura.xml
    when: always

php:coverage:
  <<: *docker-setup
  stage: test
  dependencies:
    - build:php
  only:
    - master
    - develop
  script:
    - docker compose --profile postgres up -d php postgres
    - sleep 5
    - docker compose exec -T php composer install --no-progress --no-interaction
    - docker compose exec -T php sh -c 'XDEBUG_MODE=coverage vendor/bin/phpunit --coverage-html build/coverage --coverage-clover build/coverage/clover.xml'
  artifacts:
    paths:
      - build/coverage/
    expire_in: 30 days

# ============================================================================
# NODE.JS QUALITY CHECKS
# ============================================================================
node:lint:
  <<: *docker-setup
  stage: quality
  dependencies:
    - build:node
  script:
    - docker compose up -d node
    - sleep 5
    - docker compose exec -T node pnpm install
    - docker compose exec -T node pnpm run lint

node:format-check:
  <<: *docker-setup
  stage: quality
  dependencies:
    - build:node
  script:
    - docker compose up -d node
    - sleep 5
    - docker compose exec -T node pnpm install
    - docker compose exec -T node pnpm run format:check

node:type-check:
  <<: *docker-setup
  stage: quality
  dependencies:
    - build:node
  script:
    - docker compose up -d node
    - sleep 5
    - docker compose exec -T node pnpm install
    - docker compose exec -T node pnpm run type-check

node:markdownlint:
  <<: *docker-setup
  stage: quality
  dependencies:
    - build:node
  script:
    - docker compose up -d node
    - sleep 5
    - docker compose exec -T node pnpm install
    - docker compose exec -T node pnpm run lint:md

node:package-validate:
  <<: *docker-setup
  stage: quality
  dependencies:
    - build:node
  script:
    - docker compose up -d node
    - sleep 5
    - docker compose exec -T node pnpm install
    - docker compose exec -T node pnpm run quality

# ============================================================================
# NODE.JS TESTS
# ============================================================================
node:tests:
  <<: *docker-setup
  stage: test
  dependencies:
    - build:node
  script:
    - docker compose --profile redis up -d node redis
    - sleep 5
    - docker compose exec -T node pnpm install
    - timeout 30 sh -c 'until docker compose exec -T redis redis-cli --tls --insecure ping; do sleep 1; done'
    - docker compose exec -T node pnpm test
  coverage: '/All files\s*\|\s*(\d+\.?\d*)\s*\|/'
  artifacts:
    reports:
      junit: build/vitest-report.xml
      coverage_report:
        coverage_format: cobertura
        path: build/coverage/cobertura-coverage.xml
    when: always

node:coverage:
  <<: *docker-setup
  stage: test
  dependencies:
    - build:node
  only:
    - master
    - develop
  script:
    - docker compose --profile redis up -d node redis
    - sleep 5
    - docker compose exec -T node pnpm install
    - docker compose exec -T node pnpm test:coverage
  artifacts:
    paths:
      - build/coverage/
    expire_in: 30 days

# ============================================================================
# BATS TESTS (Makefile Validation)
# ============================================================================
bats:quick:
  <<: *docker-setup
  stage: test
  script:
    - make bats-build
    - make bats-test-junit
  artifacts:
    reports:
      junit: build/bats-report.xml
    when: always

bats:integration:
  <<: *docker-setup
  stage: test
  needs:
    - bats:quick
  only:
    - master
    - develop
    - merge_requests
  script:
    - make bats-build
    # Create empty lockfiles (Dockerfile COPY needs them)
    - "[ -f composer.lock ] || echo '{}' > composer.lock"
    - "[ -f pnpm-lock.yaml ] || touch pnpm-lock.yaml"
    # Create dependency directories (compose.ci.yaml uses bind mounts for BATS tests)
    - mkdir -p vendor node_modules src/node/backend/node_modules src/node/frontend/node_modules backups/db docs/api/php docs/api/node-backend docs/api/node-frontend tools
    # IMPORTANT: Use DOCKER_BUILDKIT=0 for all builds to ensure images are
    # available to local Docker daemon (GitLab CI runners use BuildKit by default)
    # Build node-backend first for nginx COPY --from dependency
    # Note: Uses COMPOSE_PROJECT_NAME=zappzarapp from .env
    - DOCKER_BUILDKIT=0 docker compose --profile node-backend build node-backend || true
    - docker tag zappzarapp-node-backend:api zappzarapp-node-backend:latest 2>/dev/null || true
    # Build all remaining images (nginx needs NGINX_TARGET=development for :development tag)
    # Include postgres for make up image check
    - DOCKER_BUILDKIT=0 NGINX_TARGET=development docker compose --profile postgres build php node nginx postgres
    - make up
    - make composer-install
    - make pnpm-install
    - timeout 120 sh -c 'until make check-health 2>/dev/null; do sleep 5; done'
    - make bats-test-integration
  after_script:
    - make down || true
    - docker system prune -f || true
  timeout: 30m

# ============================================================================
# SAST ANALYSIS (Semgrep)
# ============================================================================
sast:semgrep:
  image: python:3.12-alpine
  stage: security
  before_script:
    - apk add --no-cache git
    - pip install semgrep
  script:
    - |
      semgrep scan \
        --config p/security-audit \
        --config p/secrets \
        --config p/php \
        --config p/typescript \
        --json \
        --output semgrep-report.json \
        --error \
        . || true
  artifacts:
    reports:
      sast: semgrep-report.json
    paths:
      - semgrep-report.json
    when: always
    expire_in: 30 days
  allow_failure: true

# ============================================================================
# DEPENDENCY AUDIT
# ============================================================================
# Note: Comprehensive security scans (Trivy, secrets, filesystem) are defined
# in .gitlab/security-scan.gitlab-ci.yml and run on a weekly schedule.
# ============================================================================
dependency-audit:
  <<: *docker-setup
  stage: security
  dependencies:
    - build:php
    - build:node
  script:
    - docker compose up -d php node
    - sleep 5
    - docker compose exec -T php composer install --no-progress --no-interaction
    - docker compose exec -T node pnpm install
    - docker compose exec -T php composer audit
    - docker compose exec -T node pnpm audit
  allow_failure: true

# ============================================================================
# PRODUCTION BUILD TEST
# ============================================================================
build:production:
  <<: *docker-setup
  stage: deploy
  only:
    - master
    - develop
  script:
    # Generate SSL certificates for nginx
    - make ssl-selfsigned
    # Create empty lockfiles for production build (Dockerfile COPY needs them)
    - "[ -f composer.lock ] || echo '{}' > composer.lock"
    - "[ -f pnpm-lock.yaml ] || touch pnpm-lock.yaml"
    # Build node-backend first, then tag for cross-image COPY compatibility
    # Note: Uses COMPOSE_PROJECT_NAME=zappzarapp from .env
    - docker compose -f compose.yaml -f compose.production.yaml --profile node-backend build node-backend
    - docker tag zappzarapp-node-backend:api zappzarapp-node-backend:latest
    # Disable BuildKit for php/nginx build so they can see the local tagged image
    - DOCKER_BUILDKIT=0 ENV=production docker compose -f compose.yaml -f compose.production.yaml --profile php --profile postgres build php nginx postgres
    # Stop any existing containers before production test (prevent port/name conflicts)
    - docker compose down -v || true
    # Test production build using ENV-aware target
    # Tests nginx + app (php/node) + database + activated services
    - ENV=production make test-production
  after_script:
    - docker compose ps || true
    - docker compose logs --tail=100 || true
    - docker compose down -v || true
    - docker system prune -f || true
  artifacts:
    when: on_success
    expire_in: 7 days

