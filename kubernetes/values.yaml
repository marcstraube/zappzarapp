---
# Default values for zappzarapp.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global settings
global:
  # Environment: development or production
  env: development
  # Domain for ingress
  domain: localhost
  # Image pull policy (use "Never" for local minikube images)
  imagePullPolicy: Never
  # Image registry (leave empty for local images)
  imageRegistry: ""
  # Image tag (defaults to Chart appVersion, use "latest" for local development)
  imageTag: "latest"

# Namespace configuration
namespace:
  # Set to false - Helm --create-namespace handles this
  # (avoids "already exists" errors)
  create: false
  name: zappzarapp

# ============================================================================
# CORE SERVICES
# ----------------------------------------------------------------------------
# Image strategy: ALL services (core and optional) use locally built, hardened
# images (repository "zappzarapp-<service>"), combined with
# global.imagePullPolicy: Never for minikube. Every image is built from
# docker/<service>/Dockerfile, which is the single source of truth for the
# upstream version (pinned via its ARG) — the Kubernetes manifests never
# duplicate that version. An empty image.tag falls back to global.imageTag /
# Chart.appVersion. Set global.imageRegistry/imageTag to source the images
# from a registry instead (with global.imagePullPolicy: Always).
# ============================================================================

nginx:
  enabled: true
  replicaCount: 1
  image:
    repository: zappzarapp-nginx
    tag: ""
  resources:
    limits:
      cpu: "2"
      memory: 2Gi
    requests:
      cpu: "1"
      memory: 1Gi
  service:
    type: ClusterIP
    port: 80
  # Pod-level context: RuntimeDefault seccomp = the runtime's standard syscall
  # filter (Pod Security Standard "restricted" expects it on every pod).
  # Numeric runAsUser/runAsGroup: the image's `USER nginx` is symbolic, and
  # the kubelet can only verify runAsNonRoot against a numeric UID. The
  # Alpine nginx package creates nginx as uid 100, gid 101.
  podSecurityContext:
    runAsUser: 100
    runAsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    readOnlyRootFilesystem: true
    runAsNonRoot: true  # production image runs as the nginx user (uid 100)
    capabilities:
      drop:
        - ALL
      add: []

php:
  enabled: true
  replicaCount: 1
  image:
    repository: zappzarapp-php
    tag: ""
  resources:
    limits:
      cpu: "2"
      memory: 2Gi
    requests:
      cpu: "1"
      memory: 1Gi
  service:
    type: ClusterIP
    port: 9000
  # Numeric runAsUser/runAsGroup: the image's `USER www-data` is symbolic,
  # and the kubelet can only verify runAsNonRoot against a numeric UID.
  podSecurityContext:
    runAsUser: 82
    runAsGroup: 82
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    readOnlyRootFilesystem: true
    runAsNonRoot: true  # production image runs as the www-data user (uid 82)
    capabilities:
      drop:
        - ALL
      add: []

# Node Frontend (Nuxt/Next.js/Remix) - Only for framework/framework-api modes
node:
  # Enable for: framework, framework-api modes
  enabled: false
  # NODE_MODE for the frontend container: framework or framework-api
  mode: framework
  replicaCount: 1
  image:
    repository: zappzarapp-node
    tag: ""
  resources:
    limits:
      cpu: "0.5"
      memory: 512Mi
    requests:
      cpu: "0.25"
      memory: 256Mi
  service:
    type: ClusterIP
    port: 3001  # Frontend frameworks run on 3001
  # Numeric runAsUser/runAsGroup: the image's `USER node` is symbolic, and
  # the kubelet can only verify runAsNonRoot against a numeric UID.
  podSecurityContext:
    runAsUser: 50000
    runAsGroup: 50000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    readOnlyRootFilesystem: true
    runAsNonRoot: true  # production image runs as the node user (uid 50000)
    capabilities:
      drop:
        - ALL
      add: []

# Node Backend (Express API) - For api, assets-api, framework-api modes
nodeBackend:
  # Enable for: api, assets-api, framework-api modes
  enabled: true
  replicaCount: 1
  image:
    repository: zappzarapp-node-backend
    tag: ""
  resources:
    limits:
      cpu: "0.5"
      memory: 512Mi
    requests:
      cpu: "0.25"
      memory: 256Mi
  service:
    type: ClusterIP
    port: 3000  # Express API runs on 3000
  # Numeric runAsUser/runAsGroup: the image's `USER node` is symbolic, and
  # the kubelet can only verify runAsNonRoot against a numeric UID.
  podSecurityContext:
    runAsUser: 50000
    runAsGroup: 50000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    readOnlyRootFilesystem: true
    runAsNonRoot: true  # production image runs as the node user (uid 50000)
    capabilities:
      drop:
        - ALL
      add: []

# ============================================================================
# DATABASE SERVICES
# ============================================================================

postgres:
  enabled: true
  replicaCount: 1
  image:
    repository: zappzarapp-postgres
    tag: ""
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: "0.5"
      memory: 512Mi
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  service:
    type: ClusterIP
    port: 5432
  # Run directly as the postgres user (uid 70): the official entrypoint then
  # skips its root-only chown/gosu phase, so no capabilities are needed.
  # fsGroup keeps the data volume writable by the postgres group; the
  # entrypoint creates the PGDATA subdirectory inside it as uid 70.
  podSecurityContext:
    runAsUser: 70
    runAsGroup: 70
    fsGroup: 70
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    # The StatefulSet mounts emptyDirs for /tmp and /run/postgresql and the
    # data volume for PGDATA — everything postgres writes — so the root
    # filesystem itself can be immutable.
    readOnlyRootFilesystem: true
    runAsNonRoot: true  # pod runs as the postgres user (uid 70)
    capabilities:
      drop:
        - ALL
      add: []

mariadb:
  enabled: false
  replicaCount: 1
  image:
    repository: zappzarapp-mariadb
    tag: ""
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: "0.5"
      memory: 512Mi
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  service:
    type: ClusterIP
    port: 3306
  # Run directly as the mysql user (uid 999): the official entrypoint then
  # skips its root-only chown/gosu phase, so no capabilities are needed, and
  # the data-dir init creates its mode-0700 system directories owned by the
  # user that later traverses them. fsGroup keeps the data volume writable.
  podSecurityContext:
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    # The StatefulSet mounts emptyDirs for /tmp and /var/run/mysqld and the
    # data volume for /var/lib/mysql — everything mariadb writes — so the
    # root filesystem itself can be immutable.
    readOnlyRootFilesystem: true
    runAsNonRoot: true  # pod runs as the mysql user (uid 999)
    capabilities:
      drop:
        - ALL
      add: []

redis:
  enabled: true
  replicaCount: 1
  image:
    repository: zappzarapp-redis
    tag: ""
  resources:
    limits:
      cpu: "0.5"
      memory: 512Mi
    requests:
      cpu: "0.25"
      memory: 256Mi
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
  service:
    type: ClusterIP
    port: 6379
  # The image entrypoint execs redis-server directly, so the pod can run as
  # the redis user (uid 999, gid 1000 in the Alpine image) with no
  # capabilities. fsGroup keeps the data volume writable.
  podSecurityContext:
    runAsUser: 999
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    readOnlyRootFilesystem: true
    runAsNonRoot: true  # pod runs as the redis user (uid 999)
    capabilities:
      drop:
        - ALL
      add: []

# ============================================================================
# OPTIONAL SERVICES
# ============================================================================

mercure:
  enabled: false
  replicaCount: 1
  image:
    repository: zappzarapp-mercure
    tag: ""
  resources:
    limits:
      cpu: "0.5"
      memory: 256Mi
    requests:
      cpu: "0.1"
      memory: 64Mi
  service:
    type: ClusterIP
    port: 80
  # Caddy binds the unprivileged port 8080 (SERVER_NAME in the Deployment)
  # and writes only to its emptyDir-mounted /data and /config, so the pod
  # can run as an arbitrary non-root uid.
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    readOnlyRootFilesystem: true
    runAsNonRoot: true  # pod runs as uid 1000
    capabilities:
      drop:
        - ALL
      add: []

meilisearch:
  enabled: false
  replicaCount: 1
  image:
    repository: zappzarapp-meilisearch
    tag: ""
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: "0.25"
      memory: 256Mi
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
  service:
    type: ClusterIP
    port: 7700
  # meilisearch writes only to /meili_data; fsGroup keeps the data volume
  # writable, so the pod can run as an arbitrary non-root uid.
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    readOnlyRootFilesystem: true
    runAsNonRoot: true  # pod runs as uid 1000
    capabilities:
      drop:
        - ALL
      add: []

elasticsearch:
  enabled: false
  replicaCount: 1
  image:
    repository: zappzarapp-elasticsearch
    tag: ""
  resources:
    limits:
      cpu: "2"
      memory: 2Gi
    requests:
      cpu: "0.5"
      memory: 1Gi
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  service:
    type: ClusterIP
    port: 9200
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    readOnlyRootFilesystem: true
    runAsNonRoot: true  # Dockerfile sets USER 1000:0
    capabilities:
      drop:
        - ALL
      add: []

seaweedfs:
  enabled: false
  replicaCount: 1
  image:
    repository: zappzarapp-seaweedfs
    tag: ""
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: "0.25"
      memory: 256Mi
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  service:
    type: ClusterIP
    s3Port: 8333
    masterPort: 9333
    volumePort: 8080
    filerPort: 8888
  # The StatefulSet execs weed directly with the secret-mounted S3 config
  # (not the image entrypoint), so the pod can run as the seaweedfs user
  # (uid 1000) with no capabilities. fsGroup keeps the data volume writable.
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    readOnlyRootFilesystem: true
    runAsNonRoot: true  # pod runs as the seaweedfs user (uid 1000)
    capabilities:
      drop:
        - ALL
      add: []

rabbitmq:
  enabled: false
  replicaCount: 1
  image:
    repository: zappzarapp-rabbitmq
    tag: ""
  resources:
    limits:
      cpu: "1"
      memory: 512Mi
    requests:
      cpu: "0.25"
      memory: 128Mi
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
  service:
    type: ClusterIP
    port: 5672
    managementPort: 15672
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
    # Run directly as the rabbitmq user (uid 100, gid 101 in the Alpine
    # image): the official entrypoint then skips its root-only chown/su-exec
    # phase, so no capabilities are needed, and the wrapper's cookie
    # chown resolves to the process's own user. fsGroup keeps the data
    # volume writable for the Erlang VM.
    runAsUser: 100
    runAsGroup: 101
    fsGroup: 101
  securityContext:
    readOnlyRootFilesystem: true
    runAsNonRoot: true  # pod runs as the rabbitmq user (uid 100)
    capabilities:
      drop:
        - ALL
      add: []

mailpit:
  # Only for development - disabled in production
  enabled: false
  replicaCount: 1
  image:
    repository: zappzarapp-mailpit
    tag: ""
  resources:
    limits:
      cpu: "0.25"
      memory: 128Mi
    requests:
      cpu: "0.1"
      memory: 64Mi
  service:
    type: ClusterIP
    smtpPort: 1025
    webPort: 8025
  # mailpit listens on unprivileged ports (1025/8025) and keeps its message
  # store in memory, so the pod can run as an arbitrary non-root uid.
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    readOnlyRootFilesystem: true
    runAsNonRoot: true  # pod runs as uid 1000
    capabilities:
      drop:
        - ALL
      add: []

# ============================================================================
# INGRESS
# ============================================================================

ingress:
  enabled: false
  className: nginx
  annotations: {}
  # kubernetes.io/tls-acme: "true"
  hosts:
    - host: localhost
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: zappzarapp-tls
  #    hosts:
  #      - example.com

# ============================================================================
# SECRETS
# ============================================================================

secrets:
  # Use existing secrets instead of creating new ones
  existingSecrets:
    dbPassword: ""
    dbRootPassword: ""
    encryptionKey: ""
    backupEncryptionKey: ""
    sslCert: ""
    sslKey: ""
    mercureJwtSecret: ""
    meilisearchMasterKey: ""
    seaweedfsAccessKey: ""
    seaweedfsSecretKey: ""
    rabbitmqUser: ""
    rabbitmqPassword: ""

# ============================================================================
# CONFIG
# ============================================================================

config:
  # Database configuration
  database:
    name: app
    user: app
    host: postgres  # or mariadb if using MariaDB

  # Allowed CORS origins (comma-separated). Empty derives
  # https://<global.domain>; the application treats the wildcard * as a
  # security incident in production, so it is never a default here.
  corsOrigins: ""

  # Logging
  logLevel: debug
  logFormat: text

  # PHP specific
  php:
    memoryLimit: 256M
    maxExecutionTime: 30
    uploadMaxFilesize: 64M

  # Node specific
  node:
    frontendPort: 3001  # Frontend frameworks (Nuxt/Next.js)
    backendPort: 3000   # Express API
