{{- if .Values.mercure.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zappzarapp.fullname" . }}-mercure
  namespace: {{ include "zappzarapp.namespace" . }}
  labels:
    {{- include "zappzarapp.labels" . | nindent 4 }}
    app.kubernetes.io/component: mercure
spec:
  replicas: {{ .Values.mercure.replicaCount }}
  selector:
    matchLabels:
      {{- include "zappzarapp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mercure
  template:
    metadata:
      labels:
        {{- include "zappzarapp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mercure
    spec:
      securityContext:
        {{- toYaml .Values.mercure.podSecurityContext | nindent 8 }}
      containers:
        - name: mercure
          image: "{{ include "zappzarapp.imageRepository" (dict "global" .Values.global "image" .Values.mercure.image) }}:{{ include "zappzarapp.imageTag" (dict "global" .Values.global "image" .Values.mercure.image "appVersion" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              # Unprivileged port: the pod runs as a non-root user, which
              # cannot bind ports below 1024
              containerPort: 8080
              protocol: TCP
          env:
            - name: MERCURE_PUBLISHER_JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecrets.mercureJwtSecret | default (printf "%s-mercure-jwt" (include "zappzarapp.fullname" .)) }}
                  key: mercure_jwt_secret
            - name: MERCURE_SUBSCRIBER_JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecrets.mercureJwtSecret | default (printf "%s-mercure-jwt" (include "zappzarapp.fullname" .)) }}
                  key: mercure_jwt_secret
            - name: SERVER_NAME
              value: ":8080"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.mercure.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ .Values.mercure.securityContext.readOnlyRootFilesystem }}
            runAsNonRoot: {{ .Values.mercure.securityContext.runAsNonRoot }}
            capabilities:
              drop:
                {{- toYaml .Values.mercure.securityContext.capabilities.drop | nindent 16 }}
              add:
                {{- toYaml .Values.mercure.securityContext.capabilities.add | nindent 16 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # Caddy state directories (XDG_DATA_HOME / XDG_CONFIG_HOME in the
            # image): Caddy persists its autosave config and runtime state
            # there, which the read-only root filesystem would reject
            - name: caddy-data
              mountPath: /data
            - name: caddy-config
              mountPath: /config
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: caddy-data
          emptyDir:
            sizeLimit: 64Mi
        - name: caddy-config
          emptyDir:
            sizeLimit: 16Mi
{{- end }}
