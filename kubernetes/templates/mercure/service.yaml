{{- if .Values.mercure.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zappzarapp.fullname" . }}-mercure
  namespace: {{ include "zappzarapp.namespace" . }}
  labels:
    {{- include "zappzarapp.labels" . | nindent 4 }}
    app.kubernetes.io/component: mercure
spec:
  type: {{ .Values.mercure.service.type }}
  ports:
    - name: http
      port: {{ .Values.mercure.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "zappzarapp.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mercure
{{- end }}
