{{- if .Values.meilisearch.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "zappzarapp.fullname" . }}-meilisearch
  namespace: {{ include "zappzarapp.namespace" . }}
  labels:
    {{- include "zappzarapp.labels" . | nindent 4 }}
    app.kubernetes.io/component: meilisearch
spec:
  serviceName: {{ include "zappzarapp.fullname" . }}-meilisearch
  replicas: {{ .Values.meilisearch.replicaCount }}
  selector:
    matchLabels:
      {{- include "zappzarapp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: meilisearch
  template:
    metadata:
      labels:
        {{- include "zappzarapp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: meilisearch
    spec:
      containers:
        - name: meilisearch
          image: "{{ include "zappzarapp.imageRepository" (dict "global" .Values.global "image" .Values.meilisearch.image) }}:{{ include "zappzarapp.imageTag" (dict "global" .Values.global "image" .Values.meilisearch.image "appVersion" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 7700
              protocol: TCP
          env:
            - name: MEILI_MASTER_KEY_FILE
              value: /run/secrets/meilisearch_master_key
            - name: MEILI_ENV
              value: {{ .Values.global.env | quote }}
            - name: MEILI_NO_ANALYTICS
              value: "true"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            {{- toYaml .Values.meilisearch.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /meili_data
            - name: meilisearch-key
              mountPath: /run/secrets/meilisearch_master_key
              subPath: meilisearch_master_key
              readOnly: true
      volumes:
        - name: meilisearch-key
          secret:
            secretName: {{ .Values.secrets.existingSecrets.meilisearchMasterKey | default (printf "%s-meilisearch-key" (include "zappzarapp.fullname" .)) }}
  {{- if .Values.meilisearch.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.meilisearch.persistence.storageClass }}
        storageClassName: {{ .Values.meilisearch.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.meilisearch.persistence.size }}
  {{- else }}
      volumes:
        - name: data
          emptyDir: {}
  {{- end }}
{{- end }}
