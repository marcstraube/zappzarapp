{{- if and .Values.mailpit.enabled (ne .Values.global.env "production") }}
{{/*
Mailpit is only deployed in non-production environments.
In production, configure your app to use a real mail provider.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zappzarapp.fullname" . }}-mailpit
  namespace: {{ include "zappzarapp.namespace" . }}
  labels:
    {{- include "zappzarapp.labels" . | nindent 4 }}
    app.kubernetes.io/component: mailpit
spec:
  replicas: {{ .Values.mailpit.replicaCount }}
  selector:
    matchLabels:
      {{- include "zappzarapp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mailpit
  template:
    metadata:
      labels:
        {{- include "zappzarapp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mailpit
    spec:
      containers:
        - name: mailpit
          image: "{{ include "zappzarapp.imageRepository" (dict "global" .Values.global "image" .Values.mailpit.image) }}:{{ include "zappzarapp.imageTag" (dict "global" .Values.global "image" .Values.mailpit.image "appVersion" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: smtp
              containerPort: 1025
              protocol: TCP
            - name: web
              containerPort: 8025
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: web
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: web
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.mailpit.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
{{- end }}
