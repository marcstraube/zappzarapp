{{- if .Values.elasticsearch.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "zappzarapp.fullname" . }}-elasticsearch
  namespace: {{ include "zappzarapp.namespace" . }}
  labels:
    {{- include "zappzarapp.labels" . | nindent 4 }}
    app.kubernetes.io/component: elasticsearch
spec:
  serviceName: {{ include "zappzarapp.fullname" . }}-elasticsearch
  replicas: {{ .Values.elasticsearch.replicaCount }}
  selector:
    matchLabels:
      {{- include "zappzarapp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: elasticsearch
  template:
    metadata:
      labels:
        {{- include "zappzarapp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: elasticsearch
    spec:
      securityContext:
        {{- toYaml .Values.elasticsearch.podSecurityContext | nindent 8 }}
      {{- if .Values.elasticsearch.securityContext.readOnlyRootFilesystem }}
      # With a read-only root filesystem Elasticsearch cannot write the keystore
      # into its baked-in config directory. Seed a writable emptyDir from the
      # image config so the main container can mount it over config/.
      initContainers:
        - name: copy-config
          image: "{{ include "zappzarapp.imageRepository" (dict "global" .Values.global "image" .Values.elasticsearch.image) }}:{{ include "zappzarapp.imageTag" (dict "global" .Values.global "image" .Values.elasticsearch.image "appVersion" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["sh", "-c", "cp -r /usr/share/elasticsearch/config/. /mnt/config/"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: {{ .Values.elasticsearch.securityContext.runAsNonRoot }}
            capabilities:
              drop:
                {{- toYaml .Values.elasticsearch.securityContext.capabilities.drop | nindent 16 }}
          volumeMounts:
            - name: config
              mountPath: /mnt/config
      {{- end }}
      containers:
        - name: elasticsearch
          image: "{{ include "zappzarapp.imageRepository" (dict "global" .Values.global "image" .Values.elasticsearch.image) }}:{{ include "zappzarapp.imageTag" (dict "global" .Values.global "image" .Values.elasticsearch.image "appVersion" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 9200
              protocol: TCP
            - name: transport
              containerPort: 9300
              protocol: TCP
          env:
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: {{ if eq .Values.global.env "production" }}"true"{{ else }}"false"{{ end }}
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          livenessProbe:
            httpGet:
              path: /_cluster/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 5
          resources:
            {{- toYaml .Values.elasticsearch.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ .Values.elasticsearch.securityContext.readOnlyRootFilesystem }}
            runAsNonRoot: {{ .Values.elasticsearch.securityContext.runAsNonRoot }}
            capabilities:
              drop:
                {{- toYaml .Values.elasticsearch.securityContext.capabilities.drop | nindent 16 }}
              add:
                {{- toYaml .Values.elasticsearch.securityContext.capabilities.add | nindent 16 }}
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
            {{- if .Values.elasticsearch.securityContext.readOnlyRootFilesystem }}
            - name: config
              mountPath: /usr/share/elasticsearch/config
            - name: logs
              mountPath: /usr/share/elasticsearch/logs
            - name: tmp
              mountPath: /tmp
            {{- end }}
      {{- if or .Values.elasticsearch.securityContext.readOnlyRootFilesystem (not .Values.elasticsearch.persistence.enabled) }}
      volumes:
        {{- if .Values.elasticsearch.securityContext.readOnlyRootFilesystem }}
        - name: config
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- end }}
        {{- if not .Values.elasticsearch.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
      {{- end }}
  {{- if .Values.elasticsearch.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.elasticsearch.persistence.storageClass }}
        storageClassName: {{ .Values.elasticsearch.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.elasticsearch.persistence.size }}
  {{- end }}
{{- end }}
