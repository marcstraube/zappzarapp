{{- if .Values.php.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zappzarapp.fullname" . }}-php
  namespace: {{ include "zappzarapp.namespace" . }}
  labels:
    {{- include "zappzarapp.labels" . | nindent 4 }}
    app.kubernetes.io/component: php
spec:
  replicas: {{ .Values.php.replicaCount }}
  selector:
    matchLabels:
      {{- include "zappzarapp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: php
  template:
    metadata:
      labels:
        {{- include "zappzarapp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: php
    spec:
      containers:
        - name: php
          image: "{{ include "zappzarapp.imageRepository" (dict "global" .Values.global "image" .Values.php.image) }}:{{ include "zappzarapp.imageTag" (dict "global" .Values.global "image" .Values.php.image "appVersion" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: fpm
              containerPort: 9000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "zappzarapp.fullname" . }}-config
          env:
            - name: DB_PASSWORD_FILE
              value: /run/secrets/db_password
            - name: ENCRYPTION_KEY_FILE
              value: /run/secrets/encryption_key
            - name: BACKUP_ENCRYPTION_KEY_FILE
              value: /run/secrets/backup_encryption_key
          livenessProbe:
            tcpSocket:
              port: fpm
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: fpm
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.php.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: {{ .Values.php.securityContext.readOnlyRootFilesystem }}
            runAsNonRoot: {{ .Values.php.securityContext.runAsNonRoot }}
            capabilities:
              drop:
                {{- toYaml .Values.php.securityContext.capabilities.drop | nindent 16 }}
              add:
                {{- toYaml .Values.php.securityContext.capabilities.add | nindent 16 }}
          volumeMounts:
            - name: php-config
              mountPath: /usr/local/etc/php-fpm.d/www.conf
              subPath: www.conf
            - name: php-config
              mountPath: /usr/local/etc/php-fpm.d/zz-docker.conf
              subPath: zz-docker.conf
            - name: tmp
              mountPath: /tmp
            - name: db-password
              mountPath: /run/secrets/db_password
              subPath: db_password
              readOnly: true
            - name: encryption-key
              mountPath: /run/secrets/encryption_key
              subPath: encryption_key
              readOnly: true
            - name: backup-encryption-key
              mountPath: /run/secrets/backup_encryption_key
              subPath: backup_encryption_key
              readOnly: true
      volumes:
        - name: php-config
          configMap:
            name: {{ include "zappzarapp.fullname" . }}-php-config
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: db-password
          secret:
            secretName: {{ .Values.secrets.existingSecrets.dbPassword | default (printf "%s-db-password" (include "zappzarapp.fullname" .)) }}
        - name: encryption-key
          secret:
            secretName: {{ .Values.secrets.existingSecrets.encryptionKey | default (printf "%s-encryption-key" (include "zappzarapp.fullname" .)) }}
        - name: backup-encryption-key
          secret:
            secretName: {{ .Values.secrets.existingSecrets.backupEncryptionKey | default (printf "%s-backup-encryption-key" (include "zappzarapp.fullname" .)) }}
{{- end }}
