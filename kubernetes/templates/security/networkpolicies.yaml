        - podSelector:
            matchLabels:
              {{- include "zappzarapp.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: node-backend
      ports:
        - protocol: TCP
          port: 6379
    {{- end }}
{{- end }}
