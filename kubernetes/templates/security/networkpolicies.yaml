{{- if and (or .Values.postgres.enabled .Values.mariadb.enabled) (eq .Values.global.env "production") }}
---
# Database: Only allow from PHP, Node Frontend, and Node Backend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "zappzarapp.fullname" . }}-database
  namespace: {{ include "zappzarapp.namespace" . }}
  labels:
    {{- include "zappzarapp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "zappzarapp.selectorLabels" . | nindent 6 }}
      {{- if .Values.postgres.enabled }}
      app.kubernetes.io/component: postgres
      {{- else }}
      app.kubernetes.io/component: mariadb
      {{- end }}
  policyTypes:
    - Ingress
  ingress:
    {{- if .Values.php.enabled }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "zappzarapp.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: php
      ports:
        - protocol: TCP
          port: {{ if .Values.postgres.enabled }}5432{{ else }}3306{{ end }}
    {{- end }}
    {{- if .Values.node.enabled }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "zappzarapp.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: node
      ports:
        - protocol: TCP
          port: {{ if .Values.postgres.enabled }}5432{{ else }}3306{{ end }}
    {{- end }}
    {{- if .Values.nodeBackend.enabled }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "zappzarapp.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: node-backend
      ports:
        - protocol: TCP
          port: {{ if .Values.postgres.enabled }}5432{{ else }}3306{{ end }}
    {{- end }}
{{- end }}

{{- if and .Values.redis.enabled (eq .Values.global.env "production") }}
---
# Redis: Only allow from PHP, Node Frontend, and Node Backend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "zappzarapp.fullname" . }}-redis
  namespace: {{ include "zappzarapp.namespace" . }}
  labels:
    {{- include "zappzarapp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "zappzarapp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  policyTypes:
    - Ingress
  ingress:
    {{- if .Values.php.enabled }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "zappzarapp.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: php
      ports:
        - protocol: TCP
          port: 6379
    {{- end }}
    {{- if .Values.node.enabled }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "zappzarapp.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: node
      ports:
        - protocol: TCP
          port: 6379
    {{- end }}
    {{- if .Values.nodeBackend.enabled }}
