{{/*
Network Policies for zappzarapp
These restrict traffic between services for better security isolation.
*/}}

{{- if and .Values.nginx.enabled (eq .Values.global.env "production") }}
---
# Nginx: Allow ingress from anywhere, egress to PHP and Node only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "zappzarapp.fullname" . }}-nginx
  namespace: {{ include "zappzarapp.namespace" . }}
  labels:
    {{- include "zappzarapp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "zappzarapp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: nginx
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from: []  # Allow from anywhere (Ingress controller)
      ports:
        - protocol: TCP
          port: 8080
  egress:
    {{- if .Values.php.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "zappzarapp.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: php
      ports:
        - protocol: TCP
          port: 9000
    {{- end }}
    {{- if .Values.node.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "zappzarapp.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: node
      ports:
        - protocol: TCP
          port: {{ .Values.config.node.frontendPort }}
    {{- end }}
    {{- if .Values.nodeBackend.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "zappzarapp.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: node-backend
      ports:
        - protocol: TCP
          port: {{ .Values.config.node.backendPort }}
    {{- end }}
    # Allow DNS
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}

{{- if and .Values.php.enabled (eq .Values.global.env "production") }}
---
# PHP: Allow from Nginx, egress to Database and Redis
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "zappzarapp.fullname" . }}-php
  namespace: {{ include "zappzarapp.namespace" . }}
  labels:
    {{- include "zappzarapp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "zappzarapp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: php
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "zappzarapp.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: nginx
      ports:
        - protocol: TCP
          port: 9000
  egress:
    {{- if .Values.postgres.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "zappzarapp.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: postgres
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}
    {{- if .Values.mariadb.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "zappzarapp.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: mariadb
      ports:
        - protocol: TCP
          port: 3306
    {{- end }}
    {{- if .Values.redis.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "zappzarapp.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: redis
      ports:
        - protocol: TCP
          port: 6379
    {{- end }}
    # Allow DNS
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}

