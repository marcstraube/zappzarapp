{{/*
ServiceAccounts for zappzarapp
Each service gets its own ServiceAccount for better security isolation.
*/}}

{{- if .Values.nginx.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "zappzarapp.fullname" . }}-nginx
  namespace: {{ include "zappzarapp.namespace" . }}
  labels:
    {{- include "zappzarapp.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
automountServiceAccountToken: false
{{- end }}

