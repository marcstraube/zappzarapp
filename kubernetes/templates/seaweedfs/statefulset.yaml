{{- if .Values.seaweedfs.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "zappzarapp.fullname" . }}-seaweedfs
  namespace: {{ include "zappzarapp.namespace" . }}
  labels:
    {{- include "zappzarapp.labels" . | nindent 4 }}
    app.kubernetes.io/component: seaweedfs
spec:
  serviceName: {{ include "zappzarapp.fullname" . }}-seaweedfs
  replicas: {{ .Values.seaweedfs.replicaCount }}
  selector:
    matchLabels:
      {{- include "zappzarapp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: seaweedfs
  template:
    metadata:
      labels:
        {{- include "zappzarapp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: seaweedfs
    spec:
      securityContext:
        {{- toYaml .Values.seaweedfs.podSecurityContext | nindent 8 }}
      containers:
        - name: seaweedfs
          image: "{{ include "zappzarapp.imageRepository" (dict "global" .Values.global "image" .Values.seaweedfs.image) }}:{{ include "zappzarapp.imageTag" (dict "global" .Values.global "image" .Values.seaweedfs.image "appVersion" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              weed server \
                -s3 \
                -s3.port=8333 \
                -master.port=9333 \
                -volume.port=8080 \
                -filer \
                -filer.port=8888 \
                -dir=/data \
                -s3.config=/run/secrets/s3_config.json
          ports:
            - name: s3
              containerPort: 8333
              protocol: TCP
            - name: master
              containerPort: 9333
              protocol: TCP
            - name: volume
              containerPort: 8080
              protocol: TCP
            - name: filer
              containerPort: 8888
              protocol: TCP
          env:
            - name: WEED_MASTER_VOLUME_GROWTH_COPY_1
              value: "1"
            - name: WEED_MASTER_VOLUME_GROWTH_COPY_2
              value: "1"
            - name: WEED_MASTER_VOLUME_GROWTH_COPY_OTHER
              value: "1"
          # weed server has no plain /status endpoint (that path is routed to
          # the volume server and returns 404), so probe the ports over TCP:
          # the master accepts connections once up, the S3 API once serving.
          livenessProbe:
            tcpSocket:
              port: master
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            {{- toYaml .Values.seaweedfs.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: {{ .Values.seaweedfs.securityContext.readOnlyRootFilesystem }}
            runAsNonRoot: {{ .Values.seaweedfs.securityContext.runAsNonRoot }}
            capabilities:
              drop:
                {{- toYaml .Values.seaweedfs.securityContext.capabilities.drop | nindent 16 }}
              add:
                {{- toYaml .Values.seaweedfs.securityContext.capabilities.add | nindent 16 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: seaweedfs-config
              mountPath: /run/secrets/s3_config.json
              subPath: s3_config.json
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: seaweedfs-config
          secret:
            secretName: {{ .Values.secrets.existingSecrets.seaweedfsAccessKey | default (printf "%s-seaweedfs-credentials" (include "zappzarapp.fullname" .)) }}
            items:
              - key: s3_config
                path: s3_config.json
        {{- if not .Values.seaweedfs.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if .Values.seaweedfs.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.seaweedfs.persistence.storageClass }}
        storageClassName: {{ .Values.seaweedfs.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.seaweedfs.persistence.size }}
  {{- end }}
{{- end }}
