{{- if .Values.rabbitmq.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "zappzarapp.fullname" . }}-rabbitmq
  namespace: {{ include "zappzarapp.namespace" . }}
  labels:
    {{- include "zappzarapp.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
spec:
  serviceName: {{ include "zappzarapp.fullname" . }}-rabbitmq
  replicas: {{ .Values.rabbitmq.replicaCount }}
  selector:
    matchLabels:
      {{- include "zappzarapp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: rabbitmq
  template:
    metadata:
      labels:
        {{- include "zappzarapp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: rabbitmq
    spec:
      securityContext:
        {{- toYaml .Values.rabbitmq.podSecurityContext | nindent 8 }}
      containers:
        - name: rabbitmq
          image: "{{ include "zappzarapp.imageRepository" (dict "global" .Values.global "image" .Values.rabbitmq.image) }}:{{ include "zappzarapp.imageTag" (dict "global" .Values.global "image" .Values.rabbitmq.image "appVersion" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: amqp
              containerPort: 5672
              protocol: TCP
            - name: management
              containerPort: 15672
              protocol: TCP
          livenessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - ping
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - check_running
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.rabbitmq.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: {{ .Values.rabbitmq.securityContext.readOnlyRootFilesystem }}
            runAsNonRoot: {{ .Values.rabbitmq.securityContext.runAsNonRoot }}
            capabilities:
              drop:
                {{- toYaml .Values.rabbitmq.securityContext.capabilities.drop | nindent 16 }}
              add:
                {{- toYaml .Values.rabbitmq.securityContext.capabilities.add | nindent 16 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
            - name: tmp
              mountPath: /tmp
            # The image entrypoint reads these files and exports
            # RABBITMQ_DEFAULT_USER / RABBITMQ_DEFAULT_PASS for the server
            # (the *_FILE env variants are rejected by RabbitMQ 4.x images).
            - name: rabbitmq-credentials
              mountPath: /run/secrets/rabbitmq_user
              subPath: rabbitmq_user
              readOnly: true
            - name: rabbitmq-credentials
              mountPath: /run/secrets/rabbitmq_password
              subPath: rabbitmq_password
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: rabbitmq-credentials
          secret:
            secretName: {{ .Values.secrets.existingSecrets.rabbitmqUser | default (printf "%s-rabbitmq-credentials" (include "zappzarapp.fullname" .)) }}
        {{- if not .Values.rabbitmq.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if .Values.rabbitmq.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.rabbitmq.persistence.storageClass }}
        storageClassName: {{ .Values.rabbitmq.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.rabbitmq.persistence.size }}
  {{- end }}
{{- end }}
