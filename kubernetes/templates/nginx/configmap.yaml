{{- if .Values.nginx.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "zappzarapp.fullname" . }}-nginx-config
  namespace: {{ include "zappzarapp.namespace" . }}
  labels:
    {{- include "zappzarapp.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
data:
  nginx.conf: |
    # Nginx Configuration for Kubernetes
    worker_processes auto;
    error_log stderr warn;
    pid /tmp/nginx.pid;

    events {
        worker_connections 1024;
        use epoll;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        # Temp paths for read-only root filesystem
        client_body_temp_path /tmp/client_temp;
        proxy_temp_path /tmp/proxy_temp;
        fastcgi_temp_path /tmp/fastcgi_temp;
        uwsgi_temp_path /tmp/uwsgi_temp;
        scgi_temp_path /tmp/scgi_temp;

        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';

        access_log /dev/stdout main;

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;
        client_max_body_size 32M;
        server_tokens off;

        # Rate Limiting
        limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;
        limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
        limit_req_status 429;

        # Gzip Compression
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types text/plain text/css text/xml text/javascript
                   application/json application/javascript application/xml+rss
                   application/rss+xml image/svg+xml;

        # WebSocket upgrade mapping
        map $http_upgrade $connection_upgrade {
            default upgrade;
            '' close;
        }

        include /etc/nginx/conf.d/*.conf;
    }

  default.conf: |
    # Upstream definitions for Kubernetes services
    upstream php-fpm {
        server {{ include "zappzarapp.fullname" . }}-php:9000;
        keepalive 8;
    }

    {{- if .Values.nodeBackend.enabled }}
    # Express API backend (port 3000)
    upstream node-backend {
        server {{ include "zappzarapp.fullname" . }}-node-backend:{{ .Values.config.node.backendPort }};
        keepalive 8;
    }
    {{- end }}

    {{- if .Values.node.enabled }}
    # Frontend framework (Nuxt/Next.js, port 3001)
    upstream node-frontend {
        server {{ include "zappzarapp.fullname" . }}-node:{{ .Values.config.node.frontendPort }};
        keepalive 8;
    }
    {{- end }}

    server {
        # Unprivileged port: the container runs as the nginx user (uid 101),
        # which cannot bind ports below 1024. TLS terminates at the Ingress.
        listen 8080;
        listen [::]:8080;
        server_name _;

        root /var/www/html/public;
        index index.php index.html;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Health Check Endpoint (Kubernetes probes)
        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"nginx"}';
        }

        # Kubernetes readiness probe
        location = /ready {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ready"}';
        }

        {{- if .Values.nodeBackend.enabled }}
        # Node.js Backend API Proxy (/api/node/* -> node-backend:3000)
        # The backend serves HTTPS only; its internal certificate is
        # self-signed, so upstream verification is disabled
        location ~ ^/api/node/(.*)$ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass https://node-backend/api/$1$is_args$args;
            proxy_ssl_verify off;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_intercept_errors off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Node.js Health Check
        location = /api/node/health {
            access_log off;
            proxy_pass https://node-backend/health;
            proxy_ssl_verify off;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        {{- end }}

        {{- if .Values.node.enabled }}
        # Node.js Frontend Framework Proxy (/app/* -> node:3001)
        location /app {
            rewrite ^/app/?(.*)$ /$1 break;
            proxy_pass http://node-frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_intercept_errors off;
            proxy_buffering off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Framework-specific internal routes (Next.js _next, Nuxt _nuxt)
        location ~ ^/(_next|_nuxt|__nuxt)/ {
            proxy_pass http://node-frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_intercept_errors off;
            proxy_buffering off;
        }
        {{- end }}

        # PHP-FPM Health Check
        location = /php-status {
            access_log off;
            fastcgi_pass php-fpm;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        # PHP-FPM Ping
        location = /php-ping {
            access_log off;
            fastcgi_pass php-fpm;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        # Standard Location
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Static files caching
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri =404;
        }

        # PHP-FPM Handler (TCP connection to PHP service)
        location ~ \.php$ {
            try_files $uri @php_router;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass php-fpm;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
            fastcgi_read_timeout 95;
        }

        # Fallback for non-existent .php files
        location @php_router {
            fastcgi_pass php-fpm;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param REQUEST_URI $request_uri;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
            fastcgi_read_timeout 95;
        }

        # Deny hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
{{- end }}
