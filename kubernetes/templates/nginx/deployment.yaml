{{- if .Values.nginx.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zappzarapp.fullname" . }}-nginx
  namespace: {{ include "zappzarapp.namespace" . }}
  labels:
    {{- include "zappzarapp.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
spec:
  replicas: {{ .Values.nginx.replicaCount }}
  selector:
    matchLabels:
      {{- include "zappzarapp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: nginx
  template:
    metadata:
      {{- if and .Values.nodeBackend.enabled (not .Values.secrets.existingSecrets.sslCert) }}
      annotations:
        # The internal-tls pair is regenerated on every upgrade; rolling the
        # pod on each upgrade keeps the trusted CA in lockstep with the
        # backend's certificate (a partial restart would split the pair)
        checksum/internal-tls: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
      {{- end }}
      labels:
        {{- include "zappzarapp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: nginx
    spec:
      securityContext:
        {{- toYaml .Values.nginx.podSecurityContext | nindent 8 }}
      containers:
        - name: nginx
          image: "{{ include "zappzarapp.imageRepository" (dict "global" .Values.global "image" .Values.nginx.image) }}:{{ include "zappzarapp.imageTag" (dict "global" .Values.global "image" .Values.nginx.image "appVersion" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          # Start nginx directly instead of the image entrypoint: the chart
          # supplies the complete nginx configuration via ConfigMap (nginx.conf
          # + default.conf), while the entrypoint renders Compose-oriented
          # artifacts (SSL config from templates, health-check snippets) into
          # /run and enforces the Compose production TLS policy. In Kubernetes
          # TLS terminates at the Ingress, so none of that applies here.
          command: ["nginx"]
          args: ["-g", "daemon off;"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "zappzarapp.fullname" . }}-config
          env:
            - name: ENABLE_PHP
              value: {{ .Values.php.enabled | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.nginx.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ .Values.nginx.securityContext.readOnlyRootFilesystem }}
            runAsNonRoot: {{ .Values.nginx.securityContext.runAsNonRoot }}
            capabilities:
              drop:
                {{- toYaml .Values.nginx.securityContext.capabilities.drop | nindent 16 }}
              add:
                {{- toYaml .Values.nginx.securityContext.capabilities.add | nindent 16 }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            {{- if .Values.nodeBackend.enabled }}
            # CA for verifying the node-backend upstream TLS
            - name: internal-ca
              mountPath: /etc/nginx/internal-ca.crt
              subPath: ca.crt
              readOnly: true
            {{- end }}
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
            - name: nginx-log
              mountPath: /var/log/nginx
            - name: nginx-lib
              mountPath: /var/lib/nginx/tmp
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "zappzarapp.fullname" . }}-nginx-config
        {{- if .Values.nodeBackend.enabled }}
        - name: internal-ca
          secret:
            secretName: {{ .Values.secrets.existingSecrets.sslCert | default (printf "%s-internal-tls" (include "zappzarapp.fullname" .)) }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
        - name: cache
          emptyDir:
            sizeLimit: 64Mi
        - name: run
          emptyDir:
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
        - name: nginx-log
          emptyDir:
            sizeLimit: 32Mi
        - name: nginx-lib
          emptyDir:
            sizeLimit: 64Mi
{{- end }}
