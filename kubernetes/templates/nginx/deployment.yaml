{{- if .Values.nginx.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zappzarapp.fullname" . }}-nginx
  namespace: {{ include "zappzarapp.namespace" . }}
  labels:
    {{- include "zappzarapp.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
spec:
  replicas: {{ .Values.nginx.replicaCount }}
  selector:
    matchLabels:
      {{- include "zappzarapp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: nginx
  template:
    metadata:
      labels:
        {{- include "zappzarapp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: nginx
    spec:
      containers:
        - name: nginx
          image: "{{ include "zappzarapp.imageRepository" (dict "global" .Values.global "image" .Values.nginx.image) }}:{{ include "zappzarapp.imageTag" (dict "global" .Values.global "image" .Values.nginx.image "appVersion" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: https
              containerPort: 443
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "zappzarapp.fullname" . }}-config
          env:
            - name: ENABLE_PHP
              value: {{ .Values.php.enabled | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.nginx.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: {{ .Values.nginx.securityContext.readOnlyRootFilesystem }}
            runAsNonRoot: {{ .Values.nginx.securityContext.runAsNonRoot }}
            capabilities:
              drop:
                {{- toYaml .Values.nginx.securityContext.capabilities.drop | nindent 16 }}
              add:
                {{- toYaml .Values.nginx.securityContext.capabilities.add | nindent 16 }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
            - name: nginx-log
              mountPath: /var/log/nginx
            - name: nginx-lib
              mountPath: /var/lib/nginx/tmp
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "zappzarapp.fullname" . }}-nginx-config
        - name: cache
          emptyDir:
            sizeLimit: 64Mi
        - name: run
          emptyDir:
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
        - name: nginx-log
          emptyDir:
            sizeLimit: 32Mi
        - name: nginx-lib
          emptyDir:
            sizeLimit: 64Mi
{{- end }}
