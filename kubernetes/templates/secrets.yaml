{{/*
Secrets template - creates secrets only if no existing secrets are specified.
For production, use existingSecrets to reference pre-created secrets.
*/}}

{{- if not .Values.secrets.existingSecrets.dbPassword }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zappzarapp.fullname" . }}-db-password
  namespace: {{ include "zappzarapp.namespace" . }}
  labels:
    {{- include "zappzarapp.labels" . | nindent 4 }}
type: Opaque
data:
  # IMPORTANT: Replace with actual base64-encoded password in production!
  # Generate with: echo -n 'your-secure-password' | base64
  db_password: {{ "change-me-in-production" | b64enc | quote }}
---
{{- end }}

{{- if and .Values.mariadb.enabled (not .Values.secrets.existingSecrets.dbRootPassword) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zappzarapp.fullname" . }}-db-root-password
  namespace: {{ include "zappzarapp.namespace" . }}
  labels:
    {{- include "zappzarapp.labels" . | nindent 4 }}
type: Opaque
data:
  db_root_password: {{ "change-me-in-production" | b64enc | quote }}
---
{{- end }}

{{- if not .Values.secrets.existingSecrets.encryptionKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zappzarapp.fullname" . }}-encryption-key
  namespace: {{ include "zappzarapp.namespace" . }}
  labels:
    {{- include "zappzarapp.labels" . | nindent 4 }}
type: Opaque
data:
  # IMPORTANT: Replace with actual base64-encoded 32-byte key!
  # Generate with: openssl rand -base64 32 | tr -d '\n' | base64
  encryption_key: {{ "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=" | b64enc | quote }}
---
{{- end }}

{{- if not .Values.secrets.existingSecrets.backupEncryptionKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zappzarapp.fullname" . }}-backup-encryption-key
  namespace: {{ include "zappzarapp.namespace" . }}
  labels:
    {{- include "zappzarapp.labels" . | nindent 4 }}
type: Opaque
data:
  backup_encryption_key: {{ "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=" | b64enc | quote }}
---
{{- end }}

{{- if and .Values.mercure.enabled (not .Values.secrets.existingSecrets.mercureJwtSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zappzarapp.fullname" . }}-mercure-jwt
  namespace: {{ include "zappzarapp.namespace" . }}
  labels:
    {{- include "zappzarapp.labels" . | nindent 4 }}
type: Opaque
data:
  mercure_jwt_secret: {{ "change-me-in-production" | b64enc | quote }}
---
{{- end }}

{{- if and .Values.meilisearch.enabled (not .Values.secrets.existingSecrets.meilisearchMasterKey) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zappzarapp.fullname" . }}-meilisearch-key
  namespace: {{ include "zappzarapp.namespace" . }}
  labels:
    {{- include "zappzarapp.labels" . | nindent 4 }}
type: Opaque
data:
  meilisearch_master_key: {{ "change-me-in-production" | b64enc | quote }}
---
{{- end }}

{{- if and .Values.seaweedfs.enabled (not .Values.secrets.existingSecrets.seaweedfsAccessKey) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zappzarapp.fullname" . }}-seaweedfs-credentials
  namespace: {{ include "zappzarapp.namespace" . }}
  labels:
    {{- include "zappzarapp.labels" . | nindent 4 }}
type: Opaque
data:
  seaweedfs_access_key: {{ "seaweedfs" | b64enc | quote }}
  seaweedfs_secret_key: {{ "change-me-in-production" | b64enc | quote }}
  s3_config: {{ printf "{\"identities\":[{\"name\":\"anvAdmin\",\"credentials\":[{\"accessKey\":\"seaweedfs\",\"secretKey\":\"change-me-in-production\"}],\"actions\":[\"Admin\",\"Read\",\"Write\"]}]}" | b64enc | quote }}
---
{{- end }}

{{- if and .Values.rabbitmq.enabled (not .Values.secrets.existingSecrets.rabbitmqUser) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zappzarapp.fullname" . }}-rabbitmq-credentials
  namespace: {{ include "zappzarapp.namespace" . }}
  labels:
    {{- include "zappzarapp.labels" . | nindent 4 }}
type: Opaque
data:
  rabbitmq_user: {{ "app" | b64enc | quote }}
  rabbitmq_password: {{ "change-me-in-production" | b64enc | quote }}
---
{{- end }}

{{- if and .Values.nodeBackend.enabled (not .Values.secrets.existingSecrets.sslCert) }}
{{- $fullname := include "zappzarapp.fullname" . }}
{{- $namespace := include "zappzarapp.namespace" . }}
{{- $altNames := list (printf "%s-node-backend" $fullname) (printf "%s-node-backend.%s.svc" $fullname $namespace) "localhost" }}
{{- $cert := genSelfSignedCert (printf "%s-node-backend" $fullname) nil $altNames 365 }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-internal-tls
  namespace: {{ $namespace }}
  labels:
    {{- include "zappzarapp.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  # Self-signed fallback for the node-backend HTTPS listener; regenerated on
  # every helm upgrade. For production, reference a pre-created TLS secret
  # via secrets.existingSecrets.sslCert instead.
  tls.crt: {{ $cert.Cert | b64enc | quote }}
  tls.key: {{ $cert.Key | b64enc | quote }}
{{- end }}
