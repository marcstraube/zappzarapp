[www]
; FPM Pool Configuration

; User and Group
user = www-data
group = www-data

; Unix Socket Configuration (more secure and faster than TCP)
listen = /var/run/php-fpm/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Process Manager
pm = dynamic
pm.max_children = 25
pm.start_servers = 5
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500
pm.process_idle_timeout = 10s

; Request Timeouts
request_terminate_timeout = 90s
request_slowlog_timeout = 30s

; Logging
access.log = /proc/self/fd/2
slowlog = /proc/self/fd/2
php_admin_value[error_log] = /proc/self/fd/2

; Security
php_admin_flag[log_errors] = on
; CRITICAL SECURITY NOTE:
; The 'php_admin_value[memory_limit]' directive is commented out in this generic
; development setup to allow the conf.d/*.ini overrides (e.g., 1024M) to take effect.
;
; FOR PRODUCTION DEPLOYMENTS: This directive MUST be uncommented to enforce a
; hard limit and prevent malicious or buggy code from consuming excessive memory
; via ini_set() calls.
; php_admin_value[memory_limit] = 512M

; Catch workers output
catch_workers_output = yes
decorate_workers_output = no

; Status Page (optional, for monitoring)
pm.status_path = /status
ping.path = /ping
