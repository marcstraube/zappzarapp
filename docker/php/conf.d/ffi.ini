; FFI Extension Configuration
; https://www.php.net/manual/en/book.ffi.php
;
; FFI ships loaded but DISABLED. It exists for the opt-in libvips
; image-processing path (ADR 0011): the php-vips binding (jcupitt/vips)
; talks to libvips through FFI instead of a compiled extension, so it
; survives PHP major upgrades without a PECL build. FFI widens the attack
; surface (native calls from PHP), so it stays off until consciously
; enabled.
;
; To activate libvips image processing:
;   1. Set ffi.enable=true below. Note: the contained preload mode
;      (ffi.enable=preload, bindings fixed via opcache.preload) does NOT
;      work with php-vips - it builds its bindings at runtime via
;      FFI::cdef, so activation means accepting full runtime FFI.
;   2. Rebuild the image: make build
;   3. In your project: composer require jcupitt/vips
extension=ffi

ffi.enable=false
