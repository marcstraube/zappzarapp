; BCMath Extension Configuration
; https://www.php.net/manual/en/book.bc.php
;
; Arbitrary precision mathematics for financial calculations,
; cryptocurrency, and other use cases requiring exact decimal handling.
;
; To disable this extension, comment out the line below.
extension=bcmath

; Default scale (decimal places) for bcmath functions
; Can be overridden per-operation with bcscale() or function parameter
;bcmath.scale = 0
