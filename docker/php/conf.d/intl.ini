; Intl Extension Configuration (ICU - International Components for Unicode)
; https://www.php.net/manual/en/intl.configuration.php
;
; To disable this extension, comment out the line below.
extension=intl

; Default locale for intl functions (e.g., NumberFormatter, Collator)
; Used when no locale is explicitly specified in function calls.
intl.default_locale = en_US.UTF-8

; Error level for intl functions
; 0 = no error reporting
; 1 = report errors (default)
intl.error_level = E_WARNING

; Use intl exceptions instead of errors
; 0 = use traditional error reporting (default)
; 1 = throw IntlException on errors
intl.use_exceptions = 0
