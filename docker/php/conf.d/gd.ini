; GD Extension Configuration
; https://www.php.net/manual/en/image.configuration.php
;
; To disable this extension, comment out the line below.
extension=gd

; Suppress libjpeg warnings (e.g., for slightly corrupted JPEG files)
; 1 = ignore warnings (recommended for production)
; 0 = show warnings
gd.jpeg_ignore_warning = 1
