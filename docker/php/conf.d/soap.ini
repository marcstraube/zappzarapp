; SOAP Extension Configuration
; https://www.php.net/manual/en/book.soap.php
;
; SOAP client and server for web services (WSDL-based).
; Used for legacy APIs, payment gateways, shipping providers.
;
; To disable this extension, comment out the line below.
extension=soap

; WSDL caching settings
; 0 = disabled, 1 = enabled (default), 2 = memory only, 3 = disk only
;soap.wsdl_cache_enabled = 1
;soap.wsdl_cache_dir = /tmp
;soap.wsdl_cache_ttl = 86400
;soap.wsdl_cache_limit = 5
