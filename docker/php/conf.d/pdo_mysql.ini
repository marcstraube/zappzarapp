; PDO MySQL Extension Configuration
; https://www.php.net/manual/en/ref.pdo-mysql.php
;
; MySQL/MariaDB database driver for PDO.
;
; To disable this extension, comment out the line below.
extension=pdo_mysql

; Default socket for MySQL connections (empty = use default)
; Only relevant for local connections; Docker uses TCP.
;pdo_mysql.default_socket =
