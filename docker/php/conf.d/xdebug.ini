; Xdebug Configuration for Docker Development

[xdebug]
; Modes: What Xdebug should do
; debug = Step debugging
; develop = Development helpers (var_dump improvements)
; coverage = Code coverage
; profile = Performance profiling
xdebug.mode=develop,debug

; IDE Key for debugging
xdebug.idekey=PHPSTORM

; When to start debugging
; yes = Always try to connect
; trigger = Only when XDEBUG_TRIGGER is set
xdebug.start_with_request=trigger

; Client (IDE) connection settings
; Use host.docker.internal to connect to host machine
xdebug.client_host=host.docker.internal
xdebug.client_port=9003

; Logging for troubleshooting
xdebug.log=/var/log/php/xdebug.log
xdebug.log_level=0

; Profiler output (if profiling is enabled in mode)
xdebug.output_dir=/var/log/php

; Discover client host automatically (useful for different environments)
xdebug.discover_client_host=false

; Maximum nesting level (prevent infinite recursion crashes)
xdebug.max_nesting_level=512
