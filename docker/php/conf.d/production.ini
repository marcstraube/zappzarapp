; Production Environment Overrides
; This file is loaded in production mode and overrides base php.ini settings

[PHP]
; Security: Never display errors to users
display_errors = Off
display_startup_errors = Off

; Security: Disable dangerous functions
; proc_open is required by Composer
disable_functions = exec,passthru,shell_exec,system,popen

; Only log errors in production
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Security: Hide sensitive data in exceptions
zend.exception_ignore_args = On
zend.exception_string_param_max_len = 0

; Performance: Disable assertions
zend.assertions = -1

; OPcache Settings for Production
; Aggressive caching for maximum performance
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

; Disable OPcache in CLI for Composer
opcache.enable_cli = 0
