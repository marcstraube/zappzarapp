; =============================================================================
; PHP Security Hardening Configuration
; =============================================================================
; Additional security settings for production hardening.
; These settings complement the base php.ini configuration.
; =============================================================================

; -----------------------------------------------------------------------------
; Filesystem Restrictions
; -----------------------------------------------------------------------------
; Restrict PHP file access to specific directories only.
; This prevents directory traversal and unauthorized file access.
; Paths: /var/www/html (app), /tmp (sessions/uploads), /var/run/php-fpm (socket)
open_basedir = /var/www/html:/tmp:/var/run/php-fpm

; -----------------------------------------------------------------------------
; Dangerous Function Restrictions
; -----------------------------------------------------------------------------
; Disable functions that are commonly exploited in attacks.
; Note: exec is kept for Composer operations during development builds.
; In a hardened production environment, consider disabling exec as well.
disable_functions = passthru,shell_exec,system,proc_open,popen,parse_ini_file,show_source

; -----------------------------------------------------------------------------
; Error Handling (Production)
; -----------------------------------------------------------------------------
; Never display errors to users (security risk: information disclosure)
display_errors = Off
display_startup_errors = Off
; Log errors instead of displaying them
log_errors = On
; Use syslog for centralized logging in container environments
error_log = /proc/self/fd/2

; -----------------------------------------------------------------------------
; PHP Version Exposure
; -----------------------------------------------------------------------------
; Hide PHP version from HTTP headers to reduce information disclosure.
expose_php = Off

; -----------------------------------------------------------------------------
; Session Security
; -----------------------------------------------------------------------------
; Use strict mode to prevent session fixation attacks
session.use_strict_mode = 1
; Only send cookies over HTTPS connections
session.cookie_secure = 1
; Prevent JavaScript access to session cookies
session.cookie_httponly = 1
; Set SameSite attribute to prevent CSRF via cookies
session.cookie_samesite = Lax

; -----------------------------------------------------------------------------
; File Upload Security
; -----------------------------------------------------------------------------
; Limit file upload size (adjust as needed for your application)
upload_max_filesize = 10M
post_max_size = 12M
; Maximum number of simultaneous file uploads
max_file_uploads = 5
