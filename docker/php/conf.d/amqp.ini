; AMQP Extension Configuration
; https://github.com/php-amqp/php-amqp
;
; High-performance AMQP client for RabbitMQ message broker.
; Required for reliable messaging with routing, priorities, and acknowledgments.
;
; To disable this extension, comment out the line below.
extension=amqp

; Connection settings (usually configured in application code)
;amqp.host = localhost
;amqp.port = 5672
;amqp.vhost = /
;amqp.login = guest
;amqp.password = guest

; Timeout settings (in seconds)
;amqp.read_timeout = 0
;amqp.write_timeout = 0
;amqp.connect_timeout = 0
;amqp.rpc_timeout = 0

; Channel settings
;amqp.channel_max = 256
;amqp.frame_max = 131072
;amqp.heartbeat = 0

; Auto-acknowledge messages (not recommended for production)
;amqp.auto_ack = 0

; Prefetch count for consumer (QoS)
;amqp.prefetch_count = 3
