; OPcache Extension Configuration
; https://www.php.net/manual/en/opcache.configuration.php
;
; OPcache improves PHP performance by storing precompiled bytecode in shared memory.
;
; To disable this extension, comment out the line below.
zend_extension=opcache

; Enable OPcache for FPM/Web requests
; Development override: conf.d/development.ini sets this to 0
opcache.enable = 1

; Disable OPcache for CLI (not useful, adds overhead)
opcache.enable_cli = 0

; Memory allocated for storing cached scripts (MB)
opcache.memory_consumption = 128

; Memory for interned strings (MB)
opcache.interned_strings_buffer = 8

; Maximum number of scripts that can be cached
; Production: 10000 is sufficient for most applications
opcache.max_accelerated_files = 10000

; How often to check for script updates (seconds)
; 0 = check on every request (development)
; 2 = check every 2 seconds (production balance)
; 60+ = less frequent checks (high-traffic production)
opcache.revalidate_freq = 2

; Validate timestamps (check if files have changed)
; 1 = check timestamps (default, recommended)
; 0 = never check (requires manual cache clear on deploy)
opcache.validate_timestamps = 1

; Enable file-based cache as second-level cache
; Useful for warming up cache after restarts
;opcache.file_cache = /tmp/opcache

; Optimization level (bitmask, default: 0x7FFEBFFF = all optimizations)
;opcache.optimization_level = 0x7FFEBFFF
