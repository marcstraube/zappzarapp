; Sodium Extension Configuration
; https://www.php.net/manual/en/book.sodium.php
;
; Sodium provides cryptographic functions for encryption, decryption,
; signatures, password hashing, and more. Built into PHP since 7.2.
;
; To disable this extension, comment out the line below.
extension=sodium

; Sodium has no runtime configuration directives.
; All settings are controlled via function parameters.
