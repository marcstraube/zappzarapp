[PHP]
; =======================================================
; DEVELOPMENT OVERRIDES (conf.d/development.ini)
; Sets environment for local development and debugging.
; =======================================================

; Error Handling (Development: Display all errors and warnings)
error_reporting = E_ALL
display_errors = On
display_startup_errors = On
log_errors = Off
ignore_repeated_errors = Off

; Resource Limits
memory_limit = 1024M ; Generous limit for development and debugging purposes.
; NOTE: This value overrides the php.ini default because the php-fpm.conf pool
; configuration does not enforce a hard 'php_admin_value' limit.

; Exception Handling (Show full details in stack traces)
zend.exception_ignore_args = Off

; Assertions (Enabled for development and debugging)
zend.assertions = 1
assert.exception = 1

; OPcache (Disabled for immediate code changes during development)
opcache.enable = 0 ; Disable FPM/Web OPcache

; Alternative for faster development with OPcache enabled:
; opcache.enable = 1
; opcache.validate_timestamps = 1
; opcache.revalidate_freq = 0             ; Check for changes on every request
; opcache.memory_consumption = 512       ; Increase memory limit for dev cache

; Security Functions (Development overrides)
; Enables shell_exec (required by phpDox) and curl_exec/curl_multi_exec (required by Composer).
; Production php.ini keeps all dangerous functions disabled.
disable_functions = exec,passthru,system,popen,parse_ini_file,show_source
