; Development Environment Overrides
; This file is loaded in development mode and overrides base php.ini settings

[PHP]
; Error Display for Development
display_errors = On
display_startup_errors = On

; More verbose error reporting in development
error_reporting = E_ALL

; Debug: Show full exception arguments
zend.exception_ignore_args = Off
zend.exception_string_param_max_len = 15

; Debug: Enable assertions
zend.assertions = 1

; OPcache Settings for Development
; Revalidate on every request for code changes
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Disable OPcache in CLI for Composer
opcache.enable_cli = 0
