; Gmagick Extension Configuration
; https://pecl.php.net/package/gmagick
;
; GraphicsMagick wrapper for PHP.
; Alternative to ImageMagick with better performance for basic operations.
;
; To disable this extension, comment out the line below.
extension=gmagick

; Gmagick has no PHP ini directives.
; Configuration is done via GraphicsMagick's delegates.xml and type.xml.
