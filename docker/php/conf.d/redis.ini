; Redis Extension Configuration (phpredis)
; https://github.com/phpredis/phpredis
;
; High-performance Redis client for PHP.
;
; To disable this extension, comment out the line below.
extension=redis

; Session handler settings (when using Redis for sessions)
; To enable Redis sessions, also configure session.save_handler in php.ini
;
; Locking settings for session handler
;redis.session.locking_enabled = 1
;redis.session.lock_expire = 0
;redis.session.lock_retries = 100
;redis.session.lock_wait_time = 20000
