[PHP]
; Base PHP Configuration - Optimized for Production Environment.
; Development-specific overrides are located in conf.d/development.ini.

; Timezone: Controlled via TZ environment variable (set in docker-compose.yaml)
; PHP uses TZ env var when date.timezone is not set. With tzdata installed,
; PHP correctly resolves timezone names like "Europe/Berlin" from TZ.
; Do NOT set date.timezone here - it would override the TZ environment variable.

; Basic Configuration
engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
zlib.output_compression = Off
implicit_flush = Off
serialize_precision = -1

; Security
expose_php = Off
; Disable functions known to be dangerous (RCE/Shell access)
disable_functions = exec,passthru,shell_exec,system,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source

; Session Security
session.cookie_httponly = 1
session.cookie_samesite = Strict
session.use_strict_mode = 1
session.use_only_cookies = 1

; Session Storage Handler (Default: file-based)
; By default, PHP uses file-based sessions (session.save_handler = files).
; To use Redis for session storage, uncomment the following lines:
;
; IMPORTANT: Redis requires code adaptations:
; - Session data must be serializable
; - No file locking (use Redis transactions if needed)
; - Session data is stored in memory (set maxmemory policy in redis.conf)
;
; session.save_handler = redis
; session.save_path = "tcp://redis:6379?auth=your_password_here"
;
; For production, use authentication:
; session.save_path = "tcp://redis:6379?auth=your_redis_password&timeout=2.5&database=0"
;
; For development without auth:
; session.save_path = "tcp://redis:6379?timeout=2.5&database=0"

; Resource Limits
max_execution_time = 90 ; max_execution_time should be coordinated with Nginx's fastcgi_read_timeout.
max_input_time = 90
memory_limit = 512M ; This is the production standard default. See development.ini for local override.
post_max_size = 32M
upload_max_filesize = 32M
max_file_uploads = 20

; Error Handling (Production defaults; overridden for development)
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
ignore_repeated_errors = Off

; Exception Handling (Production defaults; overridden for development)
zend.exception_ignore_args = On
zend.exception_string_param_max_len = 0

; Assertions (Disabled for production; overridden for development)
zend.assertions = -1

; Data Handling
default_charset = "UTF-8"
intl.default_locale = "en_US.utf8"

; File Uploads
file_uploads = On
upload_tmp_dir = /tmp

; GD Configuration
gd.jpeg_ignore_warning = 1

; OPcache
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 2 ; Revalidation frequency (0 = no revalidation, 2 = revalidate every 2 seconds)
