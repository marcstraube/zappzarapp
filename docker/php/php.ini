[PHP]
; Base PHP Configuration
; Environment-specific overrides are in conf.d/development.ini or conf.d/production.ini

; Basic Configuration
engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
zlib.output_compression = Off
implicit_flush = Off
serialize_precision = -1

; Security
expose_php = Off

; Resource Limits (optimized for image processing)
max_execution_time = 300
max_input_time = 300
memory_limit = 512M
post_max_size = 50M
upload_max_filesize = 50M
max_file_uploads = 20

; Error Handling (production defaults, overridden in dev)
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php/error.log
ignore_repeated_errors = Off

; Exception Handling (production defaults, overridden in dev)
zend.exception_ignore_args = On
zend.exception_string_param_max_len = 0

; Assertions (production defaults, overridden in dev)
zend.assertions = -1

; Data Handling
default_charset = "UTF-8"

; File Uploads
file_uploads = On
upload_tmp_dir = /tmp

; GD Configuration
gd.jpeg_ignore_warning = 1

; OPcache Configuration (production defaults, overridden in dev)
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 2

; Timezone
date.timezone = Europe/Berlin
