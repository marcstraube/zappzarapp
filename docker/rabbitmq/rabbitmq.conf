# RabbitMQ Configuration
# SSL/TLS Configuration for Development
# For production, use properly signed certificates

# Enable TLS for AMQP connections
listeners.ssl.default = 5671
ssl_options.cacertfile = /etc/rabbitmq/certs/server.crt
ssl_options.certfile = /etc/rabbitmq/certs/server.crt
ssl_options.keyfile = /etc/rabbitmq/certs/server.key
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false

# Keep non-TLS port for local development convenience
# Comment out in production to force TLS only
listeners.tcp.default = 5672

# Management plugin TLS (optional)
# management.ssl.port = 15671
# management.ssl.cacertfile = /etc/rabbitmq/certs/server.crt
# management.ssl.certfile = /etc/rabbitmq/certs/server.crt
# management.ssl.keyfile = /etc/rabbitmq/certs/server.key

# Logging
log.console = true
log.console.level = info
