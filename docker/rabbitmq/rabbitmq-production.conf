# RabbitMQ Production Configuration
# SSL/TLS Configuration - TLS Only (no plaintext connections)
# Requires properly signed certificates for production

# Disable non-TLS listeners (TLS only in production)
listeners.tcp = none

# Enable TLS for AMQP connections
listeners.ssl.default = 5671
ssl_options.cacertfile = /etc/rabbitmq/certs/server.crt
ssl_options.certfile = /etc/rabbitmq/certs/server.crt
ssl_options.keyfile = /etc/rabbitmq/certs/server.key
ssl_options.verify = verify_peer
ssl_options.fail_if_no_peer_cert = false

# Management plugin TLS
management.ssl.port = 15671
management.ssl.cacertfile = /etc/rabbitmq/certs/server.crt
management.ssl.certfile = /etc/rabbitmq/certs/server.crt
management.ssl.keyfile = /etc/rabbitmq/certs/server.key

# Disable non-TLS management (TLS only)
management.tcp.port = none

# Logging (minimal in production)
log.console = true
log.console.level = warning

# Connection limits
channel_max = 128
heartbeat = 60
