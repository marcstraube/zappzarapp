# ============================================================================
# DATABASE TOOLS PROXY (DEVELOPMENT ONLY)
# ============================================================================
# Proxy configuration for database administration tools.
# Access via: https://localhost:8443/_dev/adminer/
#             https://localhost:8443/_dev/pgadmin/
#
# Shows friendly error page when tools are not running.

# Named location for custom error page (used by location blocks below)
location @db_tool_not_running {
    root /usr/share/nginx/html/errors;
    rewrite ^(.*)$ /db-tool-not-running.html break;
}

# Adminer - Universal database admin UI (PostgreSQL, MariaDB, SQLite)
# ^~ prefix gives higher priority than regex locations (e.g., static files)
location ^~ /_dev/adminer/ {
    # Override server-level error_page for this location
    error_page 502 503 504 @db_tool_not_running;

    set $upstream_adminer adminer:8080;
    rewrite ^/_dev/adminer/(.*)$ /$1 break;
    proxy_pass http://$upstream_adminer;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_intercept_errors on;
}

# pgAdmin - PostgreSQL-specific admin tool
# ^~ prefix gives higher priority than regex locations (e.g., static files)
location ^~ /_dev/pgadmin/ {
    # Override server-level error_page for this location
    error_page 502 503 504 @db_tool_not_running;

    set $upstream_pgadmin pgadmin:80;
    proxy_pass http://$upstream_pgadmin;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Script-Name /_dev/pgadmin;
    proxy_redirect off;
    proxy_intercept_errors on;
    # pgAdmin requires longer timeouts for some operations
    proxy_read_timeout 300;
    proxy_connect_timeout 300;
    # WebSocket support for Socket.IO (dashboard state, real-time updates)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
}
