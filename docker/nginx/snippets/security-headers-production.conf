# Production security header set: shared headers + HSTS.
#
# nginx `add_header` is NOT additive across levels — a location that sets
# any add_header of its own (e.g. Cache-Control) discards ALL headers
# inherited from the server level. Include this snippet at the server level
# AND inside every location that sets its own add_header.

include /etc/nginx/snippets/security-headers.conf;

# HSTS (HTTP Strict Transport Security) - 1 year
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
