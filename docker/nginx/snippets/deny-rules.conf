# Deny Rules - Block access to sensitive files and directories
# Include this in server blocks: include /etc/nginx/snippets/deny-rules.conf;

# Deny Access to hidden files (e.g., .htaccess, .git)
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}

# Deny Access to Composer/Git files
location ~ /(composer\.json|composer\.lock|\.git) {
    deny all;
    access_log off;
    log_not_found off;
}

# Deny access to sensitive files
location ~* \.(env|log|sql|bak|swp)$ {
    deny all;
    access_log off;
    log_not_found off;
}
