# Deny Rules - Block access to sensitive files and directories
# Include this FIRST in every server block, before any other regex location:
# nginx evaluates regex locations in declaration order, so a later include
# lets earlier regexes (e.g. \.php$ or asset extensions) win over these
# deny rules for paths like /.hidden/x.php.

# Deny Access to hidden files (e.g., .htaccess, .git)
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}

# Deny Access to Composer/Git files
location ~ /(composer\.json|composer\.lock|\.git) {
    deny all;
    access_log off;
    log_not_found off;
}

# Deny access to sensitive files
location ~* \.(env|log|sql|bak|swp)$ {
    deny all;
    access_log off;
    log_not_found off;
}
