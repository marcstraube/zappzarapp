# Node.js Frontend Framework Proxy (shared between development and production)
# Include this in server blocks: include /etc/nginx/snippets/node-frontend-proxy.conf;
#
# Routes requests to Node.js frontend frameworks (Next.js, Nuxt, Remix, SvelteKit)
# These locations are always active but only work when Node container is running
# with NODE_MODE=framework or NODE_MODE=framework-api.
# If Node is not running, requests to /app/* return 502 Bad Gateway.
#
# Port assignment:
#   - Backend (Express): port 3000
#   - Frontend (Nuxt):   port 3001

# Node.js Frontend Framework routes
# Handles SSR pages, static assets, and HMR WebSocket connections
# URL rewrite: /app/* -> /* (Nuxt expects requests at /)
location /app {
    set $upstream_frontend node:3001;

    # Rewrite /app to / and /app/foo to /foo
    rewrite ^/app/?(.*)$ /$1 break;

    proxy_pass http://$upstream_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # WebSocket support for HMR (Hot Module Replacement)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Don't intercept errors - let the framework handle them
    proxy_intercept_errors off;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Buffering (disabled for SSR streaming)
    proxy_buffering off;
    proxy_request_buffering off;
}

# Framework-specific internal routes (Next.js _next, Nuxt _nuxt, etc.)
location ~ ^/(_next|_nuxt|__nuxt)/ {
    set $upstream_frontend node:3001;
    proxy_pass http://$upstream_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket support for HMR
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_intercept_errors off;
    proxy_buffering off;
}
