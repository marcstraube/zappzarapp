# Node.js Backend API Proxy (shared between development and production)
# Include this in server blocks: include /etc/nginx/snippets/node-backend-proxy.conf;
#
# Routes requests to Node.js backend server (Express/Fastify/etc.)
# Internal communication uses HTTPS for zero-trust networking.
# These locations are always active but only work when node-backend container is running.
# If node-backend is not running, requests to /api/node/* return 502 Bad Gateway.

# Node.js API endpoints - JSON errors (no HTML error pages)
location ~ ^/api/node/(.*)$ {
    set $upstream_backend node-backend:3000;

    # Internal TLS (always active for zero-trust)
    proxy_pass https://$upstream_backend/api/$1$is_args$args;

    # SSL upstream settings
    proxy_ssl_verify off;          # Self-signed certs in dev (Let's Encrypt in prod)
    proxy_ssl_server_name on;
    proxy_ssl_session_reuse on;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # Keep JSON error responses from Node.js
    proxy_intercept_errors off;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Buffering
    proxy_buffering off;
    proxy_request_buffering off;

    # WebSocket support (if needed for Socket.IO, etc.)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
}

# Node.js Health Check endpoints are now served via PHP:
# - /health -> Liveness (PHP or nginx fallback)
# - /ready  -> Readiness (PHP aggregates Node /ready internally)
# - /api/health -> Aggregated health (PHP checks both backends)
# Direct access to Node health is not exposed externally.
