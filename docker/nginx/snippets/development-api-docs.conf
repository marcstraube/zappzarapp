# ============================================================================
# API DOCUMENTATION (DEVELOPMENT ONLY)
# ============================================================================

# Node DevDashboard API (development only)
# Routes for Node.js coverage and docs generation
location ^~ /dev-dashboard/node/ {
    proxy_pass https://node:3000/dev-dashboard/node/;
    proxy_http_version 1.1;
    # Verify the upstream against the internal CA (zero-trust)
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/nginx/internal-ca.crt;
    proxy_ssl_verify_depth 2;
    proxy_ssl_name node;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Longer timeouts for coverage/docs generation
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
}

location = /docs {
    return 301 /docs/;
}

# Docsify guides (rendered Markdown documentation)
# Setting add_header drops all inherited server-level headers, so the basic
# set is re-added here. Deliberately WITHOUT the cross-origin isolation trio
# (COOP/COEP/CORP): the docs viewer loads docsify assets from a CDN, which
# COEP require-corp would block.
location ^~ /docs/guides/ {
    alias /var/www/html/.zappzarapp/docs/;
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache, must-revalidate";
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

location ^~ /docs/ {
    alias /var/www/html/docs/;
    autoindex on;
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache, must-revalidate";
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# Build outputs (test coverage reports)
location ^~ /build/ {
    alias /var/www/html/build/;
    autoindex on;
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache, must-revalidate";
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
