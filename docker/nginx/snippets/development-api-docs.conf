# ============================================================================
# API DOCUMENTATION (DEVELOPMENT ONLY)
# ============================================================================

# Node DevDashboard API (development only)
# Routes for Node.js coverage and docs generation
location ^~ /dev-dashboard/node/ {
    proxy_pass https://node:3000/dev-dashboard/node/;
    proxy_http_version 1.1;
    proxy_ssl_verify off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Longer timeouts for coverage/docs generation
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
}

location = /docs {
    return 301 /docs/;
}

# Docsify guides (rendered Markdown documentation)
location ^~ /docs/guides/ {
    alias /var/www/html/.zappzarapp/docs/;
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache, must-revalidate";
}

location ^~ /docs/ {
    alias /var/www/html/docs/;
    autoindex on;
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache, must-revalidate";
}

# Build outputs (test coverage reports)
location ^~ /build/ {
    alias /var/www/html/build/;
    autoindex on;
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache, must-revalidate";
}
