# ============================================================================
# VITE DEV-SERVER PROXY - FRAMEWORK MODE (DEVELOPMENT ONLY)
# ============================================================================
# Selected by the entrypoint when NODE_MODE is framework or framework-api.
# In these modes the frontend framework (SvelteKit, React Router/Remix, and
# the Vite layer under Nuxt) IS the Vite dev server, listening on node:3001
# over HTTPS with the internal certificate.
#
# The framework serves its HTML under /app (rewritten to / by
# node-frontend-proxy.conf), but that HTML references root-absolute Vite asset
# paths (/@vite, /@fs, /@id, /src, /.svelte-kit, /node_modules). The browser
# requests them at the root, so nginx must route those prefixes to the
# framework upstream here.
#
# Declared before deny-rules.conf so the /.svelte-kit/ route wins over the
# hidden-file deny rule (nginx evaluates regex locations in declaration order).

# SvelteKit generated files (dot-prefixed; must precede the hidden-file deny rule)
location ~ ^/\.svelte-kit/ {
    set $upstream_frontend node:3001;
    # nosemgrep: dynamic-proxy-host, missing-internal -- $upstream_* is a hardcoded service:port (not user input); this route is intentionally public.
    proxy_pass https://$upstream_frontend;

    # Internal TLS: verify the peer against the internal CA and pin the
    # expected identity (zero-trust - encryption alone does not authenticate).
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/nginx/internal-ca.crt;
    proxy_ssl_verify_depth 2;
    proxy_ssl_name node;
    proxy_ssl_server_name on;
    proxy_ssl_session_reuse on;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_intercept_errors off;
    proxy_buffering off;
}

# Vite internals, source modules and dependencies
# (@fs filesystem, @id module IDs, @vite client, @react-refresh runtime,
#  /src source files, /node_modules dependency pre-bundles)
location ~ ^/(@fs|@id|@vite|@react-refresh|src|node_modules)/ {
    set $upstream_frontend node:3001;
    # nosemgrep: dynamic-proxy-host, missing-internal -- $upstream_* is a hardcoded service:port (not user input); this route is intentionally public.
    proxy_pass https://$upstream_frontend;

    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/nginx/internal-ca.crt;
    proxy_ssl_verify_depth 2;
    proxy_ssl_name node;
    proxy_ssl_server_name on;
    proxy_ssl_session_reuse on;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # Vite returns 404 status with a valid JS body - don't intercept
    proxy_intercept_errors off;
    proxy_buffering off;
}
