# Server Defaults (shared between development and production)
# Include this in server blocks: include /etc/nginx/snippets/server-defaults.conf;

# Rate Limiting
limit_req zone=general burst=20 nodelay;
limit_conn addr 10;

# Logging
access_log /var/log/nginx/access_ssl.log;
error_log /var/log/nginx/error_ssl.log;
