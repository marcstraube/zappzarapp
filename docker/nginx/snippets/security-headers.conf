# Security Headers (shared between development and production)
# Include this in server blocks: include /etc/nginx/snippets/security-headers.conf;
#
# IMPORTANT: nginx `add_header` is NOT additive across levels — a location
# that sets any add_header of its own (e.g. Cache-Control) discards ALL
# headers inherited from the server level. Every such location must
# re-include this snippet (production: security-headers-production.conf,
# which adds HSTS).
#
# Note: CSP and HSTS are NOT included here as they differ between environments:
# - Development: Relaxed CSP with 'unsafe-inline'/'unsafe-eval' for Vite HMR
# - Production: Strict CSP + HSTS header

# Basic Security Headers
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
# Disable the legacy XSS auditor (OWASP recommendation: "0" — the auditor
# enables XS-Leaks in old browsers; CSP covers XSS protection)
add_header X-XSS-Protection "0" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# Cross-Origin Isolation Headers (Spectre mitigation)
# COOP: Prevents cross-origin documents from opening popups/accessing window
add_header Cross-Origin-Opener-Policy "same-origin" always;
# CORP: Controls which origins can embed this resource
# Using same-origin for strictest protection against Spectre attacks
add_header Cross-Origin-Resource-Policy "same-origin" always;
# COEP: Requires all resources to explicitly opt-in to cross-origin loading
add_header Cross-Origin-Embedder-Policy "require-corp" always;
