# ============================================================================
# VITE DEV-SERVER PROXY - ASSETS MODE (DEVELOPMENT ONLY)
# ============================================================================
# Selected by the entrypoint when NODE_MODE is assets, assets-api, or Node is
# not running a framework. These locations proxy the standalone Vite dev server
# (Hot Module Replacement) on node:5173.
# In Production, these URLs are never called, so they're harmless.

# Vite HMR WebSocket (custom path to avoid PHP routing conflicts)
location /__vite_hmr__ {
    # Variable upstream forces runtime DNS resolution (see resolver directive).
    # A static proxy_pass here would create an implicit upstream group named
    # "node:5173", frozen at config-load time - and because variable proxy_pass
    # matches upstream names first, that group would capture ALL locations
    # using the same host:port string, breaking them whenever the node
    # container is recreated with a new IP.
    set $upstream_node node:5173;
    # nosemgrep: dynamic-proxy-host, missing-internal -- $upstream_* is a hardcoded service:port (not user input); this route is intentionally public.
    proxy_pass http://$upstream_node;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host localhost:5173;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 86400;
}

# Vite HMR Client Script
location /@vite/client {
    set $upstream_node node:5173;
    # nosemgrep: dynamic-proxy-host, missing-internal -- $upstream_* is a hardcoded service:port (not user input); this route is intentionally public.
    proxy_pass http://$upstream_node;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    # Note: Vite returns 404 status with valid JS body - don't intercept
    proxy_intercept_errors off;
}

# Vite Dev Server (JS/CSS/Images)
location ~ ^/(js|css|images)/ {
    set $upstream_node node:5173;
    # nosemgrep: dynamic-proxy-host, missing-internal -- $upstream_* is a hardcoded service:port (not user input); this route is intentionally public.
    proxy_pass http://$upstream_node;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    # Note: Vite returns 404 status with valid JS body - don't intercept
    proxy_intercept_errors off;
}

# Vite Internal Routes (filesystem, module IDs, node_modules)
location ~ ^/(@fs|@id|@vite|node_modules)/ {
    set $upstream_node node:5173;
    # nosemgrep: dynamic-proxy-host, missing-internal -- $upstream_* is a hardcoded service:port (not user input); this route is intentionally public.
    proxy_pass http://$upstream_node;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_intercept_errors off;
}
