# Load Brotli modules (pre-installed)
load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;

worker_processes auto;
error_log stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 32M;

    # Security Headers (global defaults)
    server_tokens off;

    # Rate Limiting Zones (Separate zones for different resource types)
    #
    # Zone 'api': Strict limit for API endpoints (5 requests/sec)
    # Zone 'assets': Generous limit for static files (50 requests/sec)
    # Zone 'general': Default limit for everything else (10 requests/sec)
    #
    # To apply: Use 'limit_req zone=api' in location blocks
    # Burst allows temporary spike, nodelay processes burst immediately

    limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=assets:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_status 429;

    # Connection Limiting Zone (Max 10 concurrent connections per IP)
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # Dual Compression Strategy (Brotli + Gzip)
    # Modern clients receive Brotli (10-20% better compression)
    # Legacy clients fall back to Gzip automatically
    # Nginx negotiates via Accept-Encoding header

    # Brotli Compression (Primary - Modern browsers)
    brotli on;
    brotli_comp_level 6;
    brotli_types text/plain text/css text/xml text/javascript
                 application/json application/javascript application/xml+rss
                 application/rss+xml font/truetype font/opentype
                 application/vnd.ms-fontobject image/svg+xml;

    # Gzip Compression (Fallback - Legacy browsers)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # WebSocket upgrade mapping (for Vite HMR and Node.js WebSockets)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    include /etc/nginx/conf.d/*.conf;

    # Runtime-generated configs (tmpfs, for read-only filesystems)
    include /run/nginx/conf.d/*.conf;
}
