server {
    listen 8080;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    # Enable Rate Limiting
    limit_req zone=general burst=20 nodelay;
    limit_conn addr 10;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # CRITICAL SECURITY NOTE:
    # The Content-Security-Policy (CSP) below provides a BASIC, immediately active
    # security baseline (allows 'unsafe-inline' for compatibility).
    #
    # !!! FOR PRODUCTION AND HIGH SECURITY, YOU MUST REMOVE THIS LINE !!!
    #
    # The application layer (PHP) must dynamically generate a Nonce-based
    # Strict-Dynamic CSP header instead. See index.php/documentation for details.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always;

    # Standard Location
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Health Check Endpoint
    location = /health {
        access_log off;
        try_files /health.php =404;
        fastcgi_pass php:9000;
        fastcgi_index health.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/health.php;
        fastcgi_param SCRIPT_NAME /health.php;
    }

    # Static files caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # PHP-FPM Handler
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 95;
    }

    # Deny Access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny Access to Composer/Git files
    location ~ /(composer\.json|composer\.lock|\.git) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to sensitive files
    location ~* \.(env|log|sql|bak|swp)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
