server {
    listen 8080;
    server_name _;

    # Docker's internal DNS resolver for dynamic upstream resolution
    resolver 127.0.0.11 valid=30s ipv6=off;

    root /var/www/html/public;
    index index.php index.html;

    # Enable Rate Limiting (General Zone - default for all locations)
    limit_req zone=general burst=20 nodelay;
    limit_conn addr 10;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Custom Error Pages
    # Used by nginx directly (static files) and via fastcgi_intercept_errors (PHP)
    error_page 404 /errors/404.html;
    error_page 500 502 503 504 /errors/50x.html;

    location ^~ /errors/ {
        internal;
        alias /usr/share/nginx/html/errors/;
    }

    # CRITICAL SECURITY NOTE:
    # The Content-Security-Policy (CSP) below is DEVELOPMENT-OPTIMIZED.
    # It allows Vite HMR from localhost:5173 for Development.
    #
    # !!! FOR PRODUCTION, YOU MUST USE A STRICTER CSP !!!
    #
    # Production CSP should:
    # 1. Remove localhost:5173 from script-src and connect-src
    # 2. Use Nonce-based CSP (see index.php for implementation)
    # 3. Remove 'unsafe-inline' and 'unsafe-eval' directives
    #
    # Development CSP (current):
    # Note: 'unsafe-eval' is required for Vite's Hot Module Replacement (HMR)
    # Note: 'data:' in img-src allows base64 encoded images (e.g., phpinfo logos)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' http://localhost:5173; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://localhost:5173 http://localhost:5173;" always;

    # CORS Headers (Optional - Uncomment if needed for API)
    # add_header Access-Control-Allow-Origin "*" always;
    # add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    # add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
    # add_header Access-Control-Allow-Credentials "true" always;
    # add_header Access-Control-Max-Age "3600" always;

    # Handle OPTIONS requests for CORS preflight
    # if ($request_method = 'OPTIONS') {
    #     return 204;
    # }

    # ============================================================================
    # VITE HMR PROXY (DEVELOPMENT ONLY)
    # ============================================================================
    # These locations proxy Vite dev server for Hot Module Replacement.
    # In Production, these URLs are never called, so they're harmless.
    # The node container runs on port 5173 only in Development mode.

    # Vite HMR WebSocket
    location /@vite/client {
        set $upstream_node node:5173;
        proxy_pass http://$upstream_node;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        # Note: Vite returns 404 status with valid JS body - don't intercept
        proxy_intercept_errors off;
    }

    # Vite Dev Server (JS/CSS/Images)
    location ~ ^/(js|css|images)/ {
        set $upstream_node node:5173;
        proxy_pass http://$upstream_node;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        # Note: Vite returns 404 status with valid JS body - don't intercept
        proxy_intercept_errors off;
    }

    # Vite Internal Routes (filesystem, module IDs, node_modules)
    location ~ ^/(@fs|@id|@vite|node_modules)/ {
        set $upstream_node node:5173;
        proxy_pass http://$upstream_node;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_intercept_errors off;
    }
    # ============================================================================

    # ============================================================================
    # API DOCUMENTATION (DEVELOPMENT ONLY)
    # ============================================================================
    # Serves generated API docs at http://localhost:8080/docs/
    # In production, the docs/ directory doesn't exist (not mounted), so 404 is returned.
    # This is intentional - API docs should not be publicly accessible in production.
    #
    # ^~ modifier prevents regex location matching (needed for .css/.js files)

    # Redirect /docs to /docs/ (trailing slash)
    location = /docs {
        return 301 /docs/;
    }

    location ^~ /docs/ {
        alias /var/www/html/docs/;
        autoindex on;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    # ============================================================================

    # ============================================================================
    # NODE.JS BACKEND API PROXY
    # ============================================================================
    # Routes requests to Node.js backend server (Express/Fastify/etc.)
    # Activated when NODE_MODE includes 'backend' or 'full-stack'
    # The node container runs on port 3000 for backend API

    # Node.js API endpoints - JSON errors (no HTML error pages)
    location ~ ^/api/node/(.*)$ {
        set $upstream_backend node:3000;
        proxy_pass http://$upstream_backend/api/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Keep JSON error responses from Node.js
        proxy_intercept_errors off;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;

        # WebSocket support (if needed for Socket.IO, etc.)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Node.js Health Check
    location = /api/node/health {
        access_log off;
        set $upstream_backend node:3000;
        proxy_pass http://$upstream_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    # ============================================================================

    # Standard Location
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # API Endpoints - Stricter Rate Limiting, JSON errors (no HTML error pages)
    location ~ ^/api/ {
        limit_req zone=api burst=10 nodelay;
        try_files $uri /index.php?$query_string;

        # Nested PHP handler for API - keeps JSON error responses
        location ~ \.php$ {
            fastcgi_intercept_errors off;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass unix:/var/run/php-fpm/php-fpm.sock;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
            fastcgi_read_timeout 95;
        }
    }

    # Health Check Endpoint
    # Tries PHP first (for full health check), falls back to static JSON (Nginx-only mode)
    location = /health {
        access_log off;
        try_files /health.php @nginx_health;
        fastcgi_pass unix:/var/run/php-fpm/php-fpm.sock;
        fastcgi_index health.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/health.php;
        fastcgi_param SCRIPT_NAME /health.php;
    }

    # Fallback health check when PHP is not available (static/JAMstack mode)
    location @nginx_health {
        default_type application/json;
        return 200 '{"status":"ok","service":"nginx","timestamp":"$time_iso8601"}';
    }

    # Static files caching - More generous rate limiting
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        limit_req zone=assets burst=100 nodelay;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # PHP-FPM Handler (Unix Socket for better security and performance)
    # Existing .php files are executed directly, non-existent ones route through index.php
    location ~ \.php$ {
        try_files $uri @php_router;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/var/run/php-fpm/php-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 95;
    }

    # Fallback for non-existent .php files - route through PHP router
    location @php_router {
        fastcgi_pass unix:/var/run/php-fpm/php-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 95;
    }

    # Deny Access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny Access to Composer/Git files
    location ~ /(composer\.json|composer\.lock|\.git) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to sensitive files
    location ~* \.(env|log|sql|bak|swp)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
