# ============================================================================
# PRODUCTION CONTENT SECURITY POLICY (CSP)
# ============================================================================
# This file provides a STRICT Content-Security-Policy for production.
#
# USAGE:
# Mount this file in compose.prod.yaml to override the development CSP:
#
# services:
#   nginx:
#     volumes:
#       - ./docker/nginx/conf.d/csp-production.conf:/etc/nginx/conf.d/csp.conf:ro
#
# This will add a stricter CSP header that:
# 1. Removes Vite HMR endpoints (localhost:5173)
# 2. Removes 'unsafe-inline' and 'unsafe-eval' directives
# 3. Uses nonce-based CSP for inline scripts (if implemented in index.php)
#
# For nonce-based CSP implementation, see:
# https://content-security-policy.com/nonce/
# ============================================================================

# Map for CSP nonce (if using nonce-based CSP in PHP)
# Uncomment and implement in index.php if needed:
# map $request_id $csp_nonce {
#     default $request_id;
# }

# Production CSP Header
# This is a STRICT policy that should be reviewed and adjusted for your app
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

# Additional hardening headers (already in default.conf, but repeated here for completeness)
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# Optional: Strict-Transport-Security (HSTS) for HTTPS deployments
# Uncomment if using HTTPS:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
