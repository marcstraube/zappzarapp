# ./compose.yaml
# Docker Compose Base Configuration

services:
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
      target: production
    container_name: ${COMPOSE_PROJECT_NAME:-docker-webdev}-nginx
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      - NGINX_SSL_PORT=${NGINX_SSL_PORT:-8443}
    ports:
      - "${NGINX_PORT:-8080}:8080"
      - "${NGINX_SSL_PORT:-8443}:${NGINX_SSL_PORT:-8443}"
    volumes:
      # Shared socket directory for PHP-FPM Unix socket communication
      - php-fpm-socket:/var/run/php-fpm
      # SSL/HTTPS certificates
      - ./docker/certs:/etc/nginx/certs:ro
    depends_on:
      node:
        condition: service_started
        required: false
      php:
        condition: service_healthy
        required: false
    networks:
      - frontend
      - backend

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
    container_name: ${COMPOSE_PROJECT_NAME:-docker-webdev}-php
    restart: unless-stopped
    profiles: ["php"]
    volumes:
      # Shared socket directory for PHP-FPM Unix socket communication
      - php-fpm-socket:/var/run/php-fpm
      # SSL certificates for external database connections
      - ./docker/certs:/etc/ssl/db-certs:ro
    depends_on:
      node:
        condition: service_started
        required: false
    environment:
      - TZ=${TZ:-UTC}
      - ENV=${ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # Database (12-Factor: DATABASE_URL takes precedence)
      - DATABASE_URL=${DATABASE_URL:-}
      - DB_TYPE=${DB_TYPE:-postgres}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-app}
      - DB_USER=${DB_USER:-app}
      - DB_SSL_CA=${DB_SSL_CA:-}
      - DB_SSL_VERIFY=${DB_SSL_VERIFY:-false}
      - REDIS_URL=${REDIS_URL:-rediss://redis:6379}
      # Secrets (mounted as files at /run/secrets/)
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - ENCRYPTION_KEY_FILE=/run/secrets/encryption_key
      - BACKUP_ENCRYPTION_KEY_FILE=/run/secrets/backup_encryption_key
    secrets:
      - db_password
      - encryption_key
      - backup_encryption_key
    networks:
      - backend
      - database
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect /var/run/php-fpm/php-fpm.sock || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  node:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
      # Conditionally set the build target based on the environment variable,
      # defaulting to the secure 'asset-server' stage (the idle state).
      target: ${NODE_TARGET:-asset-server}
    image: ${COMPOSE_PROJECT_NAME:-docker-webdev}-node:latest
    container_name: ${COMPOSE_PROJECT_NAME:-docker-webdev}-node
    restart: unless-stopped
    profiles: ["node"]
    volumes:
      # SSL certificates for external database connections
      - ./docker/certs:/etc/ssl/db-certs:ro
    environment:
      - TZ=${TZ:-UTC}
      - NODE_ENV=${ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # Database (12-Factor: DATABASE_URL takes precedence)
      - DATABASE_URL=${DATABASE_URL:-}
      - DB_TYPE=${DB_TYPE:-postgres}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-app}
      - DB_USER=${DB_USER:-app}
      - DB_SSL_CA=${DB_SSL_CA:-}
      - DB_SSL_VERIFY=${DB_SSL_VERIFY:-false}
      - REDIS_URL=${REDIS_URL:-rediss://redis:6379}
      # Secrets (mounted as files at /run/secrets/)
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - ENCRYPTION_KEY_FILE=/run/secrets/encryption_key
      - BACKUP_ENCRYPTION_KEY_FILE=/run/secrets/backup_encryption_key
    secrets:
      - db_password
      - encryption_key
      - backup_encryption_key
    # Expose port 3000 if Node runs as an upstream server for Nginx or is accessed directly.
    expose:
      - "3000"
    networks:
      - backend
      - database
    depends_on:
      redis:
        condition: service_healthy
        required: false

  redis:
    build:
      context: .
      dockerfile: docker/redis/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-docker-webdev}-redis
    restart: unless-stopped
    profiles: ["redis"]
    environment:
      - TZ=${TZ:-UTC}
    expose:
      - "6379"
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --tls-port 6379
      --port 0
      --tls-cert-file /etc/ssl/certs/redis.crt
      --tls-key-file /etc/ssl/private/redis.key
      --tls-auth-clients no
    volumes:
      - redis-data:/data
      # SSL/TLS certificates for encrypted connections
      - ./docker/certs/cert.crt:/etc/ssl/certs/redis.crt:ro
      - ./docker/certs/cert.key:/etc/ssl/private/redis.key:ro
    networks:
      - database
    # Health check defined in Dockerfile (with TLS support)

  # PostgreSQL with pg_cron extension pre-installed for scheduled database jobs
  # pg_cron config (shared_preload_libraries) is set via command in override files
  # Usage: CREATE EXTENSION pg_cron; See: documentation/security/RETENTION-POLICY.md
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-docker-webdev}-postgres
    restart: unless-stopped
    profiles: ["postgres"]
    expose:
      - "5432"
    environment:
      TZ: ${TZ:-UTC}
      PGTZ: ${TZ:-UTC}
      POSTGRES_DB: ${DB_NAME:-app}
      POSTGRES_USER: ${DB_USER:-app}
      # ─────────────────────────────────────────────────────────────────
      # PASSWORD CONFIGURATION - Choose ONE option (mutually exclusive!)
      # ─────────────────────────────────────────────────────────────────
      # Option 1: Docker Secrets (recommended, default)
      #   Reads password from /run/secrets/db_password file.
      #   Secrets are generated by 'make setup' or 'make secrets'.
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      #
      # Option 2: Environment Variable (for external DB or legacy setups)
      #   Uncomment below AND comment out POSTGRES_PASSWORD_FILE above.
      #   Set DB_PASSWORD in .env or use the default.
      #POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      # ─────────────────────────────────────────────────────────────────
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8"
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - db_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app} -d ${DB_NAME:-app}"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  mariadb:
    build:
      context: .
      dockerfile: docker/mariadb/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-docker-webdev}-mariadb
    restart: unless-stopped
    profiles: ["mariadb"]
    expose:
      - "3306"
    environment:
      TZ: ${TZ:-UTC}
      MARIADB_DATABASE: ${DB_NAME:-app}
      MARIADB_USER: ${DB_USER:-app}
      # ─────────────────────────────────────────────────────────────────
      # PASSWORD CONFIGURATION - Choose ONE option (mutually exclusive!)
      # ─────────────────────────────────────────────────────────────────
      # Option 1: Docker Secrets (recommended, default)
      #   Reads passwords from /run/secrets/ files.
      #   Secrets are generated by 'make setup' or 'make secrets'.
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      #
      # Option 2: Environment Variables (for external DB or legacy setups)
      #   Uncomment below AND comment out the _FILE options above.
      #   Set DB_PASSWORD and DB_ROOT_PASSWORD in .env or use defaults.
      #MARIADB_PASSWORD: ${DB_PASSWORD:-secret}
      #MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      # ─────────────────────────────────────────────────────────────────
    secrets:
      - db_password
      - db_root_password
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - database
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ═══════════════════════════════════════════════════════════════════════════
  # OPTIONAL SERVICES
  # ═══════════════════════════════════════════════════════════════════════════

  # Mercure Hub - Real-time messaging server using Server-Sent Events (SSE)
  # Native integration with Symfony/API Platform. Lightweight alternative to WebSockets.
  # Usage: ENABLE_MERCURE=true in .env, then 'make up'
  # Docs: https://mercure.rocks/
  mercure:
    build:
      context: .
      dockerfile: docker/mercure/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-docker-webdev}-mercure
    restart: unless-stopped
    profiles: ["mercure"]
    environment:
      TZ: ${TZ:-UTC}
      # Server configuration
      SERVER_NAME: ':80'
      # JWT keys loaded from secret file via entrypoint.sh
      # Allow anonymous subscribers (set to 0 in production for auth-only)
      MERCURE_EXTRA_DIRECTIVES: |
        anonymous
        cors_origins *
    secrets:
      - mercure_jwt_secret
    expose:
      - "80"
    volumes:
      - mercure-data:/data
    networks:
      - backend
    # Health check defined in Dockerfile

  # Meilisearch - Lightning fast, typo-tolerant search engine
  # Lightweight alternative to Elasticsearch. Great for product search, autocomplete.
  # Usage: ENABLE_MEILISEARCH=true in .env, then 'make up'
  # Docs: https://www.meilisearch.com/docs
  meilisearch:
    build:
      context: .
      dockerfile: docker/meilisearch/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-docker-webdev}-meilisearch
    restart: unless-stopped
    profiles: ["meilisearch"]
    environment:
      TZ: ${TZ:-UTC}
      # Master key for API authentication (required in production)
      MEILI_MASTER_KEY_FILE: /run/secrets/meilisearch_master_key
      # Environment: development or production
      MEILI_ENV: ${ENV:-development}
      # Disable analytics
      MEILI_NO_ANALYTICS: true
    secrets:
      - meilisearch_master_key
    expose:
      - "7700"
    volumes:
      - meilisearch-data:/meili_data
    networks:
      - database
    # Health check defined in Dockerfile

  # Elasticsearch - Distributed search and analytics engine
  # Full-featured search with aggregations, analytics, geo-queries.
  # Resource-intensive (min 2GB RAM). Use Meilisearch for simpler use cases.
  # Usage: ENABLE_ELASTICSEARCH=true in .env, then 'make up'
  # Docs: https://www.elastic.co/guide/en/elasticsearch/reference/current/index.html
  elasticsearch:
    build:
      context: .
      dockerfile: docker/elasticsearch/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-docker-webdev}-elasticsearch
    restart: unless-stopped
    profiles: ["elasticsearch"]
    environment:
      TZ: ${TZ:-UTC}
      # Single-node discovery (no cluster)
      discovery.type: single-node
      # Disable security features for development (enable in production!)
      xpack.security.enabled: 'false'
      # JVM heap size (should be ~50% of available container memory)
      ES_JAVA_OPTS: '-Xms${ELASTICSEARCH_HEAP_SIZE:-512m} -Xmx${ELASTICSEARCH_HEAP_SIZE:-512m}'
      # Disable machine learning (reduces memory footprint)
      xpack.ml.enabled: 'false'
      # Snapshot repository path (required for backups)
      path.repo: /usr/share/elasticsearch/backup
    expose:
      - "9200"
      - "9300"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
      - elasticsearch-backup:/usr/share/elasticsearch/backup
    networks:
      - database
    # Health check defined in Dockerfile

  # Mailpit - Email testing tool for development
  # Catches all outgoing emails and displays them in a web UI.
  # Configure your app to send mail to mailpit:1025 (SMTP).
  # Usage: ENABLE_MAILPIT=true in .env, then 'make up'
  # Docs: https://mailpit.axllent.org/docs/
  mailpit:
    build:
      context: .
      dockerfile: docker/mailpit/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-docker-webdev}-mailpit
    restart: unless-stopped
    profiles: ["mailpit"]
    environment:
      TZ: ${TZ:-UTC}
      # Max number of emails to store (older ones are deleted)
      MP_MAX_MESSAGES: ${MAILPIT_MAX_MESSAGES:-500}
      # Database path for persistence
      MP_DATABASE: /data/mailpit.db
    expose:
      - "1025"
      - "8025"
    volumes:
      - mailpit-data:/data
    networks:
      - backend
    # Health check defined in Dockerfile

  # MinIO - S3-compatible object storage
  # Use same SDKs as AWS S3. Switch to real S3 in production without code changes.
  # Usage: ENABLE_MINIO=true in .env, then 'make up'
  # Docs: https://min.io/docs/minio/container/index.html
  minio:
    build:
      context: .
      dockerfile: docker/minio/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-docker-webdev}-minio
    restart: unless-stopped
    profiles: ["minio"]
    environment:
      TZ: ${TZ:-UTC}
      # Root credentials (change in production!)
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    command: server /data --console-address ":9001"
    secrets:
      - minio_root_user
      - minio_root_password
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

  # RabbitMQ - Enterprise message broker
  # Reliable messaging with routing, priorities, acknowledgments, and dead letter queues.
  # Includes management UI for monitoring queues and connections.
  # Usage: ENABLE_RABBITMQ=true in .env, then 'make up'
  # Docs: https://www.rabbitmq.com/docs
  rabbitmq:
    build:
      context: .
      dockerfile: docker/rabbitmq/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-docker-webdev}-rabbitmq
    restart: unless-stopped
    profiles: ["rabbitmq"]
    environment:
      TZ: ${TZ:-UTC}
      # Default user and vhost
      RABBITMQ_DEFAULT_USER_FILE: /run/secrets/rabbitmq_user
      RABBITMQ_DEFAULT_PASS_FILE: /run/secrets/rabbitmq_password
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    secrets:
      - rabbitmq_user
      - rabbitmq_password
    expose:
      - "5672"
      - "15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - backend
    # Health check defined in Dockerfile

networks:
  # 3-Network Security Architecture for GDPR Compliance
  # - frontend: Public-facing nginx only
  # - backend: Application layer (nginx, php, node)
  # - database: Data layer (databases + php/node as gateways)
  frontend:
    driver: bridge
    name: ${COMPOSE_PROJECT_NAME:-docker-webdev}-frontend
  backend:
    driver: bridge
    name: ${COMPOSE_PROJECT_NAME:-docker-webdev}-backend
  database:
    driver: bridge
    name: ${COMPOSE_PROJECT_NAME:-docker-webdev}-database

volumes:
  php-fpm-socket:
    driver: local
    name: ${COMPOSE_PROJECT_NAME:-docker-webdev}-php-fpm-socket
  redis-data:
    driver: local
    name: ${COMPOSE_PROJECT_NAME:-docker-webdev}-redis-data
  postgres-data:
    driver: local
    name: ${COMPOSE_PROJECT_NAME:-docker-webdev}-postgres-data
  mariadb-data:
    driver: local
    name: ${COMPOSE_PROJECT_NAME:-docker-webdev}-mariadb-data
  mercure-data:
    driver: local
    name: ${COMPOSE_PROJECT_NAME:-docker-webdev}-mercure-data
  meilisearch-data:
    driver: local
    name: ${COMPOSE_PROJECT_NAME:-docker-webdev}-meilisearch-data
  elasticsearch-data:
    driver: local
    name: ${COMPOSE_PROJECT_NAME:-docker-webdev}-elasticsearch-data
  elasticsearch-backup:
    driver: local
    name: ${COMPOSE_PROJECT_NAME:-docker-webdev}-elasticsearch-backup
  mailpit-data:
    driver: local
    name: ${COMPOSE_PROJECT_NAME:-docker-webdev}-mailpit-data
  minio-data:
    driver: local
    name: ${COMPOSE_PROJECT_NAME:-docker-webdev}-minio-data
  rabbitmq-data:
    driver: local
    name: ${COMPOSE_PROJECT_NAME:-docker-webdev}-rabbitmq-data

# Docker Secrets (file-based for development, external for production/swarm)
# Secrets are mounted at /run/secrets/<secret_name> in containers
# Use *_FILE environment variables to reference them (e.g., DB_PASSWORD_FILE=/run/secrets/db_password)
secrets:
  db_password:
    file: ./secrets/db_password.txt
  db_root_password:
    file: ./secrets/db_root_password.txt
  encryption_key:
    file: ./secrets/encryption_key.txt
  backup_encryption_key:
    file: ./secrets/backup_encryption_key.txt
  meilisearch_master_key:
    file: ./secrets/meilisearch_master_key.txt
  minio_root_user:
    file: ./secrets/minio_root_user.txt
  minio_root_password:
    file: ./secrets/minio_root_password.txt
  rabbitmq_user:
    file: ./secrets/rabbitmq_user.txt
  rabbitmq_password:
    file: ./secrets/rabbitmq_password.txt
  mercure_jwt_secret:
    file: ./secrets/mercure_jwt_secret.txt
