# ./compose.yaml
# Docker Compose Default Environment

services:
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "${NGINX_PORT:-8080}:8080"
    volumes:
      - ${LOG_DIR:-./logs}/nginx:/var/log/nginx
    depends_on:
      - php
    networks:
      - app-network
    restart: unless-stopped

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ${DATA_DIR:-./data}:/var/www/html/data
      - ${LOG_DIR:-./logs}/app:/var/log/app
      - ${LOG_DIR:-./logs}/php:/var/log/php
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini:ro
      - ./docker/php/php-fpm.conf:/usr/local/etc/php-fpm.d/zz-custom.conf:ro
    environment:
      - ENV=${ENV:-production}
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
