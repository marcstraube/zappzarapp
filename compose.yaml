# ./compose.yaml
# Docker Compose Base Configuration
#
# ENVIRONMENT FILES (loaded in order, later files override earlier):
#   .env              - Team defaults (committed)
#   .env.production   - Production overrides (committed, loaded if ENV=production)
#   .env.local        - Local overrides (gitignored, loaded via Makefile)
#
# SECRETS HANDLING:
#   Uses bind mounts (./secrets:/run/secrets:ro) instead of Docker secrets.
#   Docker Compose (standalone) does NOT support uid/gid/mode for secrets.
#   Secret files are created with mode 0644 by 'make setup'.
#   For stricter security, use Kubernetes with native K8s Secrets + securityContext.fsGroup.
#
# SERVICE ORDER: Core → Data → Optional (alphabetically within each category)
#   Core:     nginx, node, node-backend, php
#   Data:     mariadb, postgres, redis
#   Optional: elasticsearch, mailpit, meilisearch, mercure, rabbitmq, seaweedfs

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # CORE SERVICES
  # ═══════════════════════════════════════════════════════════════════════════

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
      # NGINX_TARGET: production (with Vite assets) or production-proxy (framework modes)
      # Auto-detected by Makefile based on NODE_MODE
      target: ${NGINX_TARGET:-production}
    image: ${COMPOSE_PROJECT_NAME:-zappzarapp}-nginx:${NGINX_TARGET:-production}
    container_name: ${COMPOSE_PROJECT_NAME:-zappzarapp}-nginx
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      - NGINX_SSL_PORT=${NGINX_SSL_PORT:-8443}
      - ENABLE_PHP=${ENABLE_PHP:-true}
      - ENABLE_NODE=${ENABLE_NODE:-false}
      - NODE_MODE=${NODE_MODE:-assets-api}
    ports:
      - "${NGINX_PORT:-8080}:8080"
      - "${NGINX_SSL_PORT:-8443}:${NGINX_SSL_PORT:-8443}"
    volumes:
      # Shared socket directory for PHP-FPM Unix socket communication
      - php-fpm-socket:/var/run/php-fpm
      # SSL certificates (bind mount)
      - ${CERT_PATH_NGINX:-./docker/certs/nginx}:/etc/nginx/certs:ro
    depends_on:
      node:
        condition: service_started
        required: false
      node-backend:
        condition: service_started
        required: false
      php:
        condition: service_healthy
        required: false
    networks:
      - frontend
      - backend

  # ─────────────────────────────────────────────────────────────────────────────
  # NODE.JS SERVICES
  # ─────────────────────────────────────────────────────────────────────────────
  # Two separate services for clean architecture:
  #   - node:         Frontend/Assets (assets, framework modes) - Port 3001
  #   - node-backend: Express API (api, assets-api modes) - Port 3000
  #
  # Usage by NODE_MODE:
  #   assets       → node (assets target, sleeps)
  #   api          → node-backend (api target)
  #   assets-api   → node-backend (api target)
  #   framework    → node (framework target)
  #   framework-api→ node-backend + node (both containers)
  #   idle         → node (development target, sleeps)
  # ─────────────────────────────────────────────────────────────────────────────

  node:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
      # Build target for frontend/assets container.
      # Available targets: development, assets, framework
      target: ${NODE_TARGET:-assets}
    image: ${COMPOSE_PROJECT_NAME:-zappzarapp}-node:${NODE_TARGET:-assets}
    container_name: ${COMPOSE_PROJECT_NAME:-zappzarapp}-node
    restart: unless-stopped
    profiles: ["node"]
    volumes:
      # Internal certificates + CA for trust
      - ${CERT_PATH_INTERNAL:-./docker/certs/internal}/cert.crt:/etc/ssl/certs/cert.crt:ro
      - ${CERT_PATH_INTERNAL:-./docker/certs/internal}/cert.key:/etc/ssl/private/cert.key:ro
      - ${CERT_PATH_INTERNAL:-./docker/certs/internal}/ca.crt:/etc/ssl/certs/internal-ca.crt:ro
      # Secrets (bind mount)
      - ./secrets:/run/secrets:ro
    environment:
      - TZ=${TZ:-UTC}
      - NODE_ENV=${ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # Internal TLS for Nitro server (Nuxt)
      - NITRO_SSL_CERT=/etc/ssl/certs/cert.crt
      - NITRO_SSL_KEY=/etc/ssl/private/cert.key
      # Database (12-Factor: DATABASE_URL takes precedence)
      # Priority: DATABASE_URL > DB_PASSWORD_FILE (secrets) > DB_PASSWORD (env var)
      - DATABASE_URL=${DATABASE_URL:-}
      - DB_TYPE=${DB_TYPE:-postgres}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-app}
      - DB_USER=${DB_USER:-app}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_SSL_CA=${DB_SSL_CA:-}
      - DB_SSL_VERIFY=${DB_SSL_VERIFY:-false}
      - REDIS_URL=${REDIS_URL:-rediss://redis:6379}
      # Secrets (mounted as files at /run/secrets/)
      - DB_PASSWORD_FILE=/run/secrets/db_password.txt
      - ENCRYPTION_KEY_FILE=/run/secrets/encryption_key.txt
      - BACKUP_ENCRYPTION_KEY_FILE=/run/secrets/backup_encryption_key.txt
    # Port 3001 for frontend framework (Nuxt/Next/etc)
    expose:
      - "3001"
    networks:
      - backend
      - database
    depends_on:
      redis:
        condition: service_healthy
        required: false

  node-backend:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
      # Build target for Express API backend.
      # Available targets: development, api
      target: ${NODE_BACKEND_TARGET:-api}
    image: ${COMPOSE_PROJECT_NAME:-zappzarapp}-node-backend:${NODE_BACKEND_TARGET:-api}
    container_name: ${COMPOSE_PROJECT_NAME:-zappzarapp}-node-backend
    restart: unless-stopped
    profiles: ["node-backend"]
    volumes:
      # Internal certificates + CA for trust
      - ${CERT_PATH_INTERNAL:-./docker/certs/internal}/cert.crt:/etc/ssl/certs/cert.crt:ro
      - ${CERT_PATH_INTERNAL:-./docker/certs/internal}/cert.key:/etc/ssl/private/cert.key:ro
      - ${CERT_PATH_INTERNAL:-./docker/certs/internal}/ca.crt:/etc/ssl/certs/internal-ca.crt:ro
      # Secrets (bind mount)
      - ./secrets:/run/secrets:ro
    environment:
      - TZ=${TZ:-UTC}
      - NODE_ENV=${ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # Database (12-Factor: DATABASE_URL takes precedence)
      # Priority: DATABASE_URL > DB_PASSWORD_FILE (secrets) > DB_PASSWORD (env var)
      - DATABASE_URL=${DATABASE_URL:-}
      - DB_TYPE=${DB_TYPE:-postgres}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-app}
      - DB_USER=${DB_USER:-app}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_SSL_CA=${DB_SSL_CA:-}
      - DB_SSL_VERIFY=${DB_SSL_VERIFY:-false}
      - REDIS_URL=${REDIS_URL:-rediss://redis:6379}
      # Secrets (mounted as files at /run/secrets/)
      - DB_PASSWORD_FILE=/run/secrets/db_password.txt
      - ENCRYPTION_KEY_FILE=/run/secrets/encryption_key.txt
      - BACKUP_ENCRYPTION_KEY_FILE=/run/secrets/backup_encryption_key.txt
    # Port 3000 for Express API backend
    expose:
      - "3000"
    networks:
      - backend
      - database
    depends_on:
      redis:
        condition: service_healthy
        required: false

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: ${PHP_TARGET:-production}
    image: ${COMPOSE_PROJECT_NAME:-zappzarapp}-php:${PHP_TARGET:-production}
    container_name: ${COMPOSE_PROJECT_NAME:-zappzarapp}-php
    restart: unless-stopped
    profiles: ["php"]
    volumes:
      # Shared socket directory for PHP-FPM Unix socket communication
      - php-fpm-socket:/var/run/php-fpm
      # Internal CA for TLS verification
      - ${CERT_PATH_INTERNAL:-./docker/certs/internal}/ca.crt:/etc/ssl/certs/internal-ca.crt:ro
      # Secrets (bind mount)
      - ./secrets:/run/secrets:ro
    depends_on:
      node:
        condition: service_started
        required: false
    environment:
      - TZ=${TZ:-UTC}
      - ENV=${ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # Service activation flags (for DevDashboard)
      - ENABLE_PHP=${ENABLE_PHP:-true}
      - ENABLE_NODE=${ENABLE_NODE:-true}
      - ENABLE_DATABASE=${ENABLE_DATABASE:-true}
      - ENABLE_REDIS=${ENABLE_REDIS:-true}
      - ENABLE_MERCURE=${ENABLE_MERCURE:-false}
      - ENABLE_MEILISEARCH=${ENABLE_MEILISEARCH:-false}
      - ENABLE_ELASTICSEARCH=${ENABLE_ELASTICSEARCH:-false}
      - ENABLE_MAILPIT=${ENABLE_MAILPIT:-false}
      - ENABLE_SEAWEEDFS=${ENABLE_SEAWEEDFS:-false}
      - ENABLE_RABBITMQ=${ENABLE_RABBITMQ:-false}
      # Database (12-Factor: DATABASE_URL takes precedence)
      # Priority: DATABASE_URL > DB_PASSWORD_FILE (secrets) > DB_PASSWORD (env var)
      - DATABASE_URL=${DATABASE_URL:-}
      - DB_TYPE=${DB_TYPE:-postgres}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-app}
      - DB_USER=${DB_USER:-app}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_SSL_CA=${DB_SSL_CA:-}
      - DB_SSL_VERIFY=${DB_SSL_VERIFY:-false}
      - REDIS_URL=${REDIS_URL:-rediss://redis:6379}
      # Secrets (mounted as files at /run/secrets/)
      - DB_PASSWORD_FILE=/run/secrets/db_password.txt
      - ENCRYPTION_KEY_FILE=/run/secrets/encryption_key.txt
      - BACKUP_ENCRYPTION_KEY_FILE=/run/secrets/backup_encryption_key.txt
    networks:
      - backend
      - database
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect /var/run/php-fpm/php-fpm.sock || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  # ═══════════════════════════════════════════════════════════════════════════
  # DATA SERVICES
  # ═══════════════════════════════════════════════════════════════════════════

  mariadb:
    build:
      context: .
      dockerfile: docker/mariadb/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-zappzarapp}-mariadb
    restart: unless-stopped
    profiles: ["mariadb"]
    expose:
      - "3306"
    environment:
      TZ: ${TZ:-UTC}
      MARIADB_DATABASE: ${DB_NAME:-app}
      MARIADB_USER: ${DB_USER:-app}
      # ─────────────────────────────────────────────────────────────────
      # PASSWORD CONFIGURATION - Choose ONE option (mutually exclusive!)
      # ─────────────────────────────────────────────────────────────────
      # Option 1: Secrets via bind mount (recommended, default)
      #   Reads passwords from /run/secrets/ files.
      #   Secrets are generated by 'make setup' or 'make secrets'.
      MARIADB_PASSWORD_FILE: /run/secrets/db_password.txt
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password.txt
      #
      # Option 2: Environment Variables (for external DB or legacy setups)
      #   Uncomment below AND comment out the _FILE options above.
      #   Set DB_PASSWORD and DB_ROOT_PASSWORD in .env or use defaults.
      #MARIADB_PASSWORD: ${DB_PASSWORD:-secret}
      #MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      # ─────────────────────────────────────────────────────────────────
    volumes:
      - mariadb-data:/var/lib/mysql
      # Secrets (bind mount)
      - ./secrets:/run/secrets:ro
    networks:
      - database
    healthcheck:
      # Uses gosu to run as mysql user (avoids DAC_OVERRIDE for reading .my-healthcheck.cnf)
      test: ["CMD", "/custom-healthcheck.sh"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # PostgreSQL with pg_cron extension pre-installed for scheduled database jobs
  # pg_cron config (shared_preload_libraries) is set via command in override files
  # Usage: CREATE EXTENSION pg_cron; See: .zappzarapp/docs/security/RETENTION-POLICY.md
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
      target: final
    container_name: ${COMPOSE_PROJECT_NAME:-zappzarapp}-postgres
    restart: unless-stopped
    profiles: ["postgres"]
    expose:
      - "5432"
    environment:
      TZ: ${TZ:-UTC}
      PGTZ: ${TZ:-UTC}
      POSTGRES_DB: ${DB_NAME:-app}
      POSTGRES_USER: ${DB_USER:-app}
      # ─────────────────────────────────────────────────────────────────
      # PASSWORD CONFIGURATION - Choose ONE option (mutually exclusive!)
      # ─────────────────────────────────────────────────────────────────
      # Option 1: Secrets via bind mount (recommended, default)
      #   Reads password from /run/secrets/db_password.txt file.
      #   Secrets are generated by 'make setup' or 'make secrets'.
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password.txt
      #
      # Option 2: Environment Variable (for external DB or legacy setups)
      #   Uncomment below AND comment out POSTGRES_PASSWORD_FILE above.
      #   Set DB_PASSWORD in .env or use the default.
      #POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      # ─────────────────────────────────────────────────────────────────
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Secrets (bind mount)
      - ./secrets:/run/secrets:ro
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app} -d ${DB_NAME:-app}"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  redis:
    build:
      context: .
      dockerfile: docker/redis/Dockerfile
      target: base
    container_name: ${COMPOSE_PROJECT_NAME:-zappzarapp}-redis
    restart: unless-stopped
    profiles: ["redis"]
    environment:
      - TZ=${TZ:-UTC}
    expose:
      - "6379"
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --tls-port 6379
      --port 0
      --tls-cert-file /etc/redis/certs/cert.crt
      --tls-key-file /etc/redis/certs/cert.key
      --tls-auth-clients no
    volumes:
      - redis-data:/data
      # SSL certificates (bind mount)
      - ${CERT_PATH_INTERNAL:-./docker/certs/internal}/cert.crt:/etc/redis/certs/cert.crt:ro
      - ${CERT_PATH_INTERNAL:-./docker/certs/internal}/cert.key:/etc/redis/certs/cert.key:ro
    networks:
      - database
    # Health check defined in Dockerfile (with TLS support)

  # ═══════════════════════════════════════════════════════════════════════════
  # OPTIONAL SERVICES (alphabetically sorted)
  # ═══════════════════════════════════════════════════════════════════════════

  # Elasticsearch - Distributed search and analytics engine
  # Full-featured search with aggregations, analytics, geo-queries.
  # Resource-intensive (min 2GB RAM). Use Meilisearch for simpler use cases.
  # Usage: ENABLE_ELASTICSEARCH=true in .env, then 'make up'
  # Docs: https://www.elastic.co/guide/en/elasticsearch/reference/current/index.html
  elasticsearch:
    build:
      context: .
      dockerfile: docker/elasticsearch/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-zappzarapp}-elasticsearch
    restart: unless-stopped
    profiles: ["elasticsearch"]
    environment:
      TZ: ${TZ:-UTC}
      # Single-node discovery (no cluster)
      discovery.type: single-node
      # Security with TLS for zero-trust internal HTTPS
      xpack.security.enabled: 'true'
      xpack.security.http.ssl.enabled: 'true'
      xpack.security.http.ssl.key: /usr/share/elasticsearch/config/certs/cert.key
      xpack.security.http.ssl.certificate: /usr/share/elasticsearch/config/certs/cert.crt
      xpack.security.http.ssl.verification_mode: 'none'
      # Disable transport TLS (single-node, no inter-node communication)
      xpack.security.transport.ssl.enabled: 'false'
      # Bootstrap password for initial API key generation
      ELASTIC_PASSWORD_FILE: /run/secrets/elasticsearch_bootstrap_password.txt
      # JVM heap size (should be ~50% of available container memory)
      ES_JAVA_OPTS: '-Xms${ELASTICSEARCH_HEAP_SIZE:-512m} -Xmx${ELASTICSEARCH_HEAP_SIZE:-512m}'
      # Disable machine learning (reduces memory footprint)
      xpack.ml.enabled: 'false'
      # Disable telemetry/monitoring data collection
      xpack.monitoring.collection.enabled: 'false'
      # Snapshot repository path (required for backups)
      path.repo: /usr/share/elasticsearch/backup
    expose:
      - "9200"
      - "9300"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
      - elasticsearch-backup:/usr/share/elasticsearch/backup
      # TLS certificates for internal HTTPS
      - ${CERT_PATH_INTERNAL:-./docker/certs/internal}/cert.crt:/usr/share/elasticsearch/config/certs/cert.crt:ro
      - ${CERT_PATH_INTERNAL:-./docker/certs/internal}/cert.key:/usr/share/elasticsearch/config/certs/cert.key:ro
      # Secrets (bind mount)
      - ./secrets:/run/secrets:ro
    networks:
      - database
    # Health check defined in Dockerfile

  # Mailpit - Email testing tool for development
  # Catches all outgoing emails and displays them in a web UI.
  # Configure your app to send mail to mailpit:1025 (SMTP).
  # Usage: ENABLE_MAILPIT=true in .env, then 'make up'
  # Docs: https://mailpit.axllent.org/docs/
  mailpit:
    build:
      context: .
      dockerfile: docker/mailpit/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-zappzarapp}-mailpit
    restart: unless-stopped
    profiles: ["mailpit"]
    environment:
      TZ: ${TZ:-UTC}
      # Max number of emails to store (older ones are deleted)
      MP_MAX_MESSAGES: ${MAILPIT_MAX_MESSAGES:-500}
      # Database path for persistence
      MP_DATABASE: /data/mailpit.db
    expose:
      - "1025"
      - "8025"
    volumes:
      - mailpit-data:/data
    networks:
      - backend
    # Health check defined in Dockerfile

  # Meilisearch - Lightning fast, typo-tolerant search engine
  # Lightweight alternative to Elasticsearch. Great for product search, autocomplete.
  # Usage: ENABLE_MEILISEARCH=true in .env, then 'make up'
  # Docs: https://www.meilisearch.com/docs
  meilisearch:
    build:
      context: .
      dockerfile: docker/meilisearch/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-zappzarapp}-meilisearch
    restart: unless-stopped
    profiles: ["meilisearch"]
    environment:
      TZ: ${TZ:-UTC}
      # Master key for API authentication (required in production)
      MEILI_MASTER_KEY_FILE: /run/secrets/meilisearch_master_key.txt
      # Environment: development or production
      MEILI_ENV: ${ENV:-development}
      # Disable analytics
      MEILI_NO_ANALYTICS: "true"
      # TLS configuration for zero-trust internal HTTPS
      MEILI_SSL_CERT_PATH: /etc/ssl/certs/cert.crt
      MEILI_SSL_KEY_PATH: /etc/ssl/private/cert.key
    expose:
      - "7700"
    volumes:
      - meilisearch-data:/meili_data
      # Secrets (bind mount)
      - ./secrets:/run/secrets:ro
      # TLS certificates for internal HTTPS
      - ${CERT_PATH_INTERNAL:-./docker/certs/internal}/cert.crt:/etc/ssl/certs/cert.crt:ro
      - ${CERT_PATH_INTERNAL:-./docker/certs/internal}/cert.key:/etc/ssl/private/cert.key:ro
    networks:
      - database
    # Health check defined in Dockerfile

  # Mercure Hub - Real-time messaging server using Server-Sent Events (SSE)
  # Native integration with Symfony/API Platform. Lightweight alternative to WebSockets.
  # Usage: ENABLE_MERCURE=true in .env, then 'make up'
  # Docs: https://mercure.rocks/
  mercure:
    build:
      context: .
      dockerfile: docker/mercure/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-zappzarapp}-mercure
    restart: unless-stopped
    profiles: ["mercure"]
    environment:
      TZ: ${TZ:-UTC}
      # Server configuration (HTTPS for zero-trust internal TLS)
      SERVER_NAME: ':443'
      # JWT keys loaded from secret file via entrypoint.sh
      # Allow anonymous subscribers (set to 0 in production for auth-only)
      # Mercure configuration - anonymous subscribers and CORS
      MERCURE_EXTRA_DIRECTIVES: anonymous
      # Caddy TLS configuration - use custom certificates
      CADDY_SERVER_EXTRA_DIRECTIVES: "tls /etc/mercure/certs/cert.crt /etc/mercure/certs/cert.key"
    expose:
      - "443"
    volumes:
      - mercure-data:/data
      # Secrets (bind mount)
      - ./secrets:/run/secrets:ro
      # TLS certificates for internal HTTPS
      - ${CERT_PATH_INTERNAL:-./docker/certs/internal}/cert.crt:/etc/mercure/certs/cert.crt:ro
      - ${CERT_PATH_INTERNAL:-./docker/certs/internal}/cert.key:/etc/mercure/certs/cert.key:ro
    networks:
      - backend
    # Health check defined in Dockerfile

  # RabbitMQ - Enterprise message broker
  # Reliable messaging with routing, priorities, acknowledgments, and dead letter queues.
  # Includes management UI for monitoring queues and connections.
  # Usage: ENABLE_RABBITMQ=true in .env, then 'make up'
  # Docs: https://www.rabbitmq.com/docs
  rabbitmq:
    build:
      context: .
      dockerfile: docker/rabbitmq/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-zappzarapp}-rabbitmq
    restart: unless-stopped
    profiles: ["rabbitmq"]
    environment:
      TZ: ${TZ:-UTC}
      # Default vhost (user/pass loaded from secrets via entrypoint.sh)
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    expose:
      - "5672"
      - "15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      # Secrets (bind mount)
      - ./secrets:/run/secrets:ro
    networks:
      - backend
    # Health check defined in Dockerfile

  # SeaweedFS - S3-compatible distributed object storage
  # Use same SDKs as AWS S3. Switch to real S3 in production without code changes.
  # Fast storage for billions of files with O(1) disk seek performance.
  # Usage: ENABLE_SEAWEEDFS=true in .env, then 'make up'
  # Docs: https://github.com/seaweedfs/seaweedfs/wiki
  seaweedfs:
    build:
      context: .
      dockerfile: docker/seaweedfs/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-zappzarapp}-seaweedfs
    restart: unless-stopped
    profiles: ["seaweedfs"]
    environment:
      TZ: ${TZ:-UTC}
      # S3 credentials (loaded from secrets via entrypoint.sh)
      SEAWEEDFS_S3_ACCESS_KEY_FILE: /run/secrets/seaweedfs_access_key.txt
      SEAWEEDFS_S3_SECRET_KEY_FILE: /run/secrets/seaweedfs_secret_key.txt
    expose:
      # S3 API endpoint (main interface for applications)
      - "8333"
      # Internal ports (master: 9333, volume: 8080, filer: 8888)
    volumes:
      - seaweedfs-data:/data
      # Secrets (bind mount)
      - ./secrets:/run/secrets:ro
      # TLS certificates for internal HTTPS (zero-trust architecture)
      - ${CERT_PATH_INTERNAL:-./docker/certs/internal}/cert.crt:/etc/ssl/certs/cert.crt:ro
      - ${CERT_PATH_INTERNAL:-./docker/certs/internal}/cert.key:/etc/ssl/private/cert.key:ro
    networks:
      - backend
    # Health check defined in Dockerfile

networks:
  # 3-Network Security Architecture for GDPR Compliance
  # - frontend: Public-facing nginx only
  # - backend: Application layer (nginx, php, node)
  # - database: Data layer (databases + php/node as gateways)
  frontend:
    driver: bridge
