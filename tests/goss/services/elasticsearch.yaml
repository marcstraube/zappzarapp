# GOSS Tests for elasticsearch container
# Note: HTTP tests use internal localhost (inside container)
# Authentication via bootstrap password (API key may not exist yet during GOSS)

# ============================================================================
# PROCESS TESTS (Internal)
# ============================================================================
process:
  java:
    running: true

# ============================================================================
# PORT TESTS (Internal)
# ============================================================================
port:
  tcp:9200:
    listening: true
    ip:
      - 0.0.0.0
  tcp:9300:
    listening: true
    ip:
      - 0.0.0.0

# ============================================================================
# FILE TESTS (Internal)
# ============================================================================
file:
  /usr/share/elasticsearch/data:
    exists: true
    filetype: directory
  /usr/share/elasticsearch/backup:
    exists: true
    filetype: directory
  /usr/share/elasticsearch/config/elasticsearch.yml:
    exists: true
  # Bootstrap password secret should be mounted
  /run/secrets/elasticsearch_bootstrap_password.txt:
    exists: true

# ============================================================================
# COMMAND TESTS (Internal - with authentication)
# ============================================================================
command:
  # Health check using bootstrap password (API key may not exist yet during GOSS)
  "curl -sk -u elastic:$(cat /run/secrets/elasticsearch_bootstrap_password.txt) https://localhost:9200/_cluster/health":
    exit-status: 0
    timeout: 35000
    stdout:
      - '"status"'
      - '"cluster_name"'

  # Verify security is enabled (anonymous access should fail)
  "curl -sk https://localhost:9200/_cluster/health":
    exit-status: 0
    stdout:
      - '"error"'
      - '"security_exception"'
