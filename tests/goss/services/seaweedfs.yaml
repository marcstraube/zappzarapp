# GOSS Tests for SeaweedFS container
# Two-phase testing: dgoss (external) + docker exec (internal)
#
# SeaweedFS S3-compatible distributed object storage
# S3 API on port 8333 (TLS)

# ============================================================================
# PROCESS TESTS (Internal)
# ============================================================================
process:
  weed:
    running: true

# ============================================================================
# PORT TESTS (Internal)
# ============================================================================
port:
  # S3 API port
  tcp:8333:
    listening: true
    ip:
      - 0.0.0.0
  # Master port (internal)
  tcp:9333:
    listening: true
    ip:
      - 0.0.0.0
  # Volume port (internal)
  tcp:8080:
    listening: true
    ip:
      - 0.0.0.0
  # Filer port (internal)
  tcp:8888:
    listening: true
    ip:
      - 0.0.0.0

# ============================================================================
# FILE TESTS (Internal)
# ============================================================================
file:
  # Data directory
  /data:
    exists: true
    filetype: directory

  # TLS certificates
  /etc/seaweedfs/certs/s3.crt:
    exists: true
  /etc/seaweedfs/certs/s3.key:
    exists: true

  # S3 credentials config
  /etc/seaweedfs/config/s3.json:
    exists: true
    contains:
      - '"accessKey"'
      - '"secretKey"'

  # Secrets (bind mount)
  /run/secrets/seaweedfs_access_key.txt:
    exists: true
  /run/secrets/seaweedfs_secret_key.txt:
    exists: true

# ============================================================================
# HTTP TESTS (Internal - 127.0.0.1 for Alpine compatibility)
# ============================================================================
http:
  # S3 API endpoint (returns 403 without auth, but proves TLS works)
  https://127.0.0.1:8333/:
    status: 403
    timeout: 5000
    insecure: true

# ============================================================================
# COMMAND TESTS (Internal)
# ============================================================================
command:
  # SeaweedFS version check
  weed version:
    exit-status: 0
    timeout: 5000
    stdout:
      - "version"

  # Check master status (use 127.0.0.1 - Alpine doesn't always resolve localhost)
  wget -q -O - http://127.0.0.1:9333/cluster/status:
    exit-status: 0
    timeout: 10000
