# GOSS Tests for node-frontend container (Nuxt/Next/SvelteKit/Remix)
#
# Build-time tests: Files, commands, configuration
# Runtime tests: Processes, ports, HTTP (see runtime-tests.sh)

# ============================================================================
# FILE TESTS (Build-time)
# ============================================================================
file:
  # Application root
  /app:
    exists: true
    filetype: directory

  # Package files
  /app/package.json:
    exists: true

  # Node modules
  /app/node_modules:
    exists: true
    filetype: directory

  # NOTE: build-time checks here are intentionally framework-AGNOSTIC so this
  # stage stays green on the bare boilerplate (no framework installed) AND after
  # a user runs `make node-frontend-nuxt|next|sveltekit|remix`. The
  # framework-specific build output dir varies (Nuxt `.output/`, Next `.next/`,
  # SvelteKit `build/`|`.svelte-kit/`, Remix `build/`), so asserting one here
  # would wrongly fail the other three. The framework-specific output check
  # lives in node-frontend.framework.yaml, generated by the scaffold targets
  # and validated by the test-framework image stage alongside this file;
  # runtime serving is covered by tests/goss/runtime-tests.sh node-frontend.

  # Entrypoint
  /usr/local/bin/entrypoint.production.sh:
    exists: true
    mode: "0755"

# ============================================================================
# COMMAND TESTS (Build-time)
# ============================================================================
command:
  # Node.js version check
  node -v:
    exit-status: 0
    timeout: 5000
    stdout:
      - "/v2[0-9]+\\./"

  # pnpm is available
  pnpm -v:
    exit-status: 0
    timeout: 5000

  # curl is available (for health checks)
  which curl:
    exit-status: 0
    timeout: 5000
