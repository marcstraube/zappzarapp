# ./compose.ci.yaml
# Docker Compose CI Environment
#
# Purpose: Override development settings for CI pipelines (GitHub Actions, GitLab CI)
# Key difference from compose.override.yaml:
#   - NO lockfile bind mounts (composer.lock, pnpm-lock.yaml)
#   - Lockfiles are generated fresh inside the container
#   - Avoids bind mount permission issues in ephemeral CI runners
#
# Usage: docker compose -f compose.yaml -f compose.ci.yaml [command]
#        Or set: COMPOSE_FILE=compose.yaml:compose.ci.yaml

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # NODE.JS SERVICES
  # ═══════════════════════════════════════════════════════════════════════════

  node:
    build:
      target: development
    image: ${COMPOSE_PROJECT_NAME:-zappzarapp}-node:development
    # Remove profile restriction - node should always start in CI for BATS tests
    profiles: []
    volumes:
      # === FROM compose.yaml (base config, must be included) ===
      # SSL certificates for external database connections
      - ./docker/certs:/etc/ssl/db-certs:ro
      # SSL certificates for internal HTTPS server (Nuxt/Nitro)
      - ./docker/certs/internal/cert.crt:/etc/ssl/certs/cert.crt:ro
      - ./docker/certs/internal/cert.key:/etc/ssl/private/cert.key:ro
      # Secrets (bind mount)
      - ./secrets:/run/secrets:ro

      # === CI-specific mounts ===
      # Entrypoint Script
      - ./docker/node/entrypoint.development.sh:/usr/local/bin/entrypoint.development.sh:ro

      # Package manager config (read-only, lockfile generated inside container)
      - ./package.json:/app/package.json:ro
      # NO pnpm-lock.yaml mount - single file bind mounts can't be atomically replaced

      # Dependencies (bind mounts for CI - allows host filesystem checks in BATS tests)
      # Note: directories must be created before container startup
      - ./node_modules:/app/node_modules

      # Source and Tests (needed for quality checks and tests)
      - ./src:/app/src
      - ./tests:/app/tests
      - ./resources:/app/resources

      # Workspace node_modules (bind mounts for CI - MUST be after ./src mount)
      - ./src/node/backend/node_modules:/app/src/node/backend/node_modules
      - ./src/node/frontend/node_modules:/app/src/node/frontend/node_modules

      # Build output and docs
      - ./build:/app/build
      - ./dist:/app/dist
      - ./public:/app/public
      - ./docs:/app/docs

      # Build config files (needed for Vite, TypeScript)
      - ./vite.config.js:/app/vite.config.js:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./tsconfig.resources.json:/app/tsconfig.resources.json:ro
      - ./tsconfig.base.json:/app/tsconfig.base.json:ro
      - ./tsconfig.build.json:/app/tsconfig.build.json:ro
      - ./tsconfig.vitest.json:/app/tsconfig.vitest.json:ro
      - ./vitest.config.ts:/app/vitest.config.ts:ro
      # Note: pnpm-workspace.yaml needs write access (pnpm audit uses atomic rename)
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml

      # Static config files (read-only)
      - ./eslint.config.js:/app/eslint.config.js:ro
      - ./.prettierrc.json:/app/.prettierrc.json:ro
      - ./.prettierignore:/app/.prettierignore:ro
      - ./.markdownlint-cli2.jsonc:/app/.markdownlint-cli2.jsonc:ro
      - ./.depcheckrc.json:/app/.depcheckrc.json:ro

      # TypeDoc config files (for docs generation)
      - ./typedoc.backend.json:/app/typedoc.backend.json:ro
      - ./typedoc.frontend.json:/app/typedoc.frontend.json:ro
      - ./tsconfig.typedoc.json:/app/tsconfig.typedoc.json:ro

      # Markdown files for linting
      - ./.zappzarapp:/app/.zappzarapp:ro
      - ./README.md:/app/README.md:ro
    environment:
      - TZ=${TZ:-UTC}
      - NODE_ENV=development
      - NODE_MODE=idle
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # Database
      - DATABASE_URL=${DATABASE_URL:-}
      - DB_TYPE=${DB_TYPE:-postgres}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-app}
      - DB_USER=${DB_USER:-app}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_SSL_CA=${DB_SSL_CA:-}
      - DB_SSL_VERIFY=${DB_SSL_VERIFY:-false}
      - REDIS_URL=${REDIS_URL:-rediss://redis:6379}

  # ═══════════════════════════════════════════════════════════════════════════
  # PHP SERVICE
  # ═══════════════════════════════════════════════════════════════════════════

  php:
    build:
      target: development
    image: ${COMPOSE_PROJECT_NAME:-zappzarapp}-php:development
    entrypoint: ["/entrypoint.development.sh"]
    command: ["php-fpm"]
    volumes:
      # === FROM compose.yaml (base config, must be included) ===
      # Shared socket directory for PHP-FPM Unix socket communication
      - php-fpm-socket:/var/run/php-fpm
      # SSL certificates for external database connections
      - ./docker/certs:/etc/ssl/db-certs:ro
      # Secrets (bind mount)
      - ./secrets:/run/secrets:ro

      # === CI-specific mounts ===
      # Entrypoint Script
      - ./docker/php/entrypoint.development.sh:/entrypoint.development.sh:ro

      # Composer config (read-only, lockfile generated inside container)
      - ./composer.json:/var/www/html/composer.json:ro
      # NO composer.lock mount - generated fresh inside container

      # Dependencies (bind mount for CI - allows host filesystem checks in BATS tests)
      # Note: directory must be created before container startup
      - ./vendor:/var/www/html/vendor

      # Source and Tests (needed for quality checks and tests)
      - ./src/php:/var/www/html/src/php
      - ./tests/php:/var/www/html/tests/php
      - ./templates:/var/www/html/templates

      # Configuration files
      - ./config:/var/www/html/config:ro

      # Boilerplate config (needed for docs theme customization)
      - ./.zappzarapp:/var/www/html/.zappzarapp:ro

      # Build outputs and docs
      - ./build:/var/www/html/build
      - ./docs:/var/www/html/docs
      - ./tools:/var/www/html/tools

      # Public directory (needed for PHP-CS-Fixer)
      - ./public:/var/www/html/public

      # Quality Assurance Tools Config
      - ./phpstan.neon:/var/www/html/phpstan.neon:ro
      - ./phpmd.xml.dist:/var/www/html/phpmd.xml.dist:ro
      - ./.php-cs-fixer.dist.php:/var/www/html/.php-cs-fixer.dist.php:ro
      - ./phpunit.xml.dist:/var/www/html/phpunit.xml.dist:ro
      - ./rector.php:/var/www/html/rector.php:ro
      - ./phpdoc.xml:/var/www/html/phpdoc.xml:ro

      # PHP Configuration (Read-Only)
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini:ro
      - ./docker/php/php-fpm.conf:/usr/local/etc/php-fpm.d/www.conf:ro
      - ./docker/php/zz-docker.conf:/usr/local/etc/php-fpm.d/zz-docker.conf:ro

      # PHP Extension Configuration (conf.d/)
      - ./docker/php/conf.d/exif.ini:/usr/local/etc/php/conf.d/exif.ini:ro
      - ./docker/php/conf.d/gd.ini:/usr/local/etc/php/conf.d/gd.ini:ro
      - ./docker/php/conf.d/gmagick.ini:/usr/local/etc/php/conf.d/gmagick.ini:ro
      - ./docker/php/conf.d/intl.ini:/usr/local/etc/php/conf.d/intl.ini:ro
      - ./docker/php/conf.d/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini:ro
      - ./docker/php/conf.d/pdo_mysql.ini:/usr/local/etc/php/conf.d/pdo_mysql.ini:ro
      - ./docker/php/conf.d/pdo_pgsql.ini:/usr/local/etc/php/conf.d/pdo_pgsql.ini:ro
      - ./docker/php/conf.d/redis.ini:/usr/local/etc/php/conf.d/redis.ini:ro
      - ./docker/php/conf.d/sodium.ini:/usr/local/etc/php/conf.d/sodium.ini:ro
      - ./docker/php/conf.d/zip.ini:/usr/local/etc/php/conf.d/zip.ini:ro

      # Development-only overrides
      - ./docker/php/conf.d/development.ini:/usr/local/etc/php/conf.d/zz-development.ini:ro
      - ./docker/php/conf.d/xdebug.ini:/usr/local/etc/php/conf.d/zz-xdebug.ini:ro
    environment:
      - TZ=${TZ:-UTC}
      - ZAPPZARAPP_ENV=development
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - XDEBUG_MODE=${XDEBUG_MODE:-off}
      - ENABLE_PHP=${ENABLE_PHP:-true}
      - ENABLE_NODE=${ENABLE_NODE:-false}
      # Skip vendor check in entrypoint (deps installed via exec)
      - PHP_SKIP_DEPENDENCY_CHECK=1
      - ENABLE_DATABASE=${ENABLE_DATABASE:-true}
      - ENABLE_REDIS=${ENABLE_REDIS:-true}
      - ENABLE_MERCURE=${ENABLE_MERCURE:-false}
      - ENABLE_MEILISEARCH=${ENABLE_MEILISEARCH:-false}
      - ENABLE_ELASTICSEARCH=${ENABLE_ELASTICSEARCH:-false}
      - ENABLE_MAILPIT=${ENABLE_MAILPIT:-false}
      - ENABLE_SEAWEEDFS=${ENABLE_SEAWEEDFS:-false}
      - ENABLE_RABBITMQ=${ENABLE_RABBITMQ:-false}
      - NODE_MODE=idle
      # Database
      - DATABASE_URL=${DATABASE_URL:-}
      - DB_TYPE=${DB_TYPE:-postgres}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-app}
      - DB_USER=${DB_USER:-app}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_SSL_CA=${DB_SSL_CA:-}
      - DB_SSL_VERIFY=${DB_SSL_VERIFY:-false}
      - REDIS_URL=${REDIS_URL:-rediss://redis:6379}

  # ═══════════════════════════════════════════════════════════════════════════
  # NGINX SERVICE
  # ═══════════════════════════════════════════════════════════════════════════

  nginx:
    # Force development target in CI to avoid COPY --from=zappzarapp-node-backend:latest
    # (production target requires node-backend image which may not exist in CI)
    build:
      target: development
    image: ${COMPOSE_PROJECT_NAME:-zappzarapp}-nginx:development
    volumes:
      # === FROM compose.yaml (must be repeated, volumes don't merge) ===
      # Shared socket directory for PHP-FPM Unix socket communication
      - php-fpm-socket:/var/run/php-fpm
      # SSL certificates (bind mount)
      - ./docker/certs/nginx/cert.crt:/etc/nginx/certs/cert.crt:ro
      - ./docker/certs/nginx/cert.key:/etc/nginx/certs/cert.key:ro
      # === CI-specific / Development mounts ===
      - ./public:/var/www/html/public:ro
      - ./docs:/var/www/html/docs:ro
      - ./.zappzarapp:/var/www/html/.zappzarapp:ro
      # Nginx Configuration (Read-Only)
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/snippets:/etc/nginx/snippets:ro
      # SSL template (processed by entrypoint, enables HTTPS on 8443)
      - ./docker/nginx/conf.d/ssl-development.conf.template:/etc/nginx/conf.d/ssl-development.conf.template:ro

  # ═══════════════════════════════════════════════════════════════════════════
  # DATA SERVICES (minimal overrides for CI)
  # ═══════════════════════════════════════════════════════════════════════════

  postgres:
    # Use simpler command for CI (no verbose logging needed)
    command: >
      postgres
      -c shared_buffers=64MB
      -c max_connections=20

  redis:
    # Simpler Redis config for CI
    command: >
      redis-server
      --appendonly no
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
      --tls-port 6379
      --port 0
      --tls-cert-file /etc/redis/certs/cert.crt
      --tls-key-file /etc/redis/certs/cert.key
      --tls-auth-clients no

  # ═══════════════════════════════════════════════════════════════════════════
  # DEV-TOOLS - Dedicated container for Git hooks and linting (CI version)
  # ═══════════════════════════════════════════════════════════════════════════
  # Required for Makefile targets: lint-node, lint-md, type-check, prettier-check, test-node
  # ═══════════════════════════════════════════════════════════════════════════
  dev-tools:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
      target: development
    image: ${COMPOSE_PROJECT_NAME:-zappzarapp}-dev-tools:development
    # No profile restriction in CI - needs to be accessible for make targets
    profiles: []
    working_dir: /app
    volumes:
      # Package manager config (read-only, lockfile generated inside container)
      - ./package.json:/app/package.json:ro
      # NO pnpm-lock.yaml mount - single file bind mounts can't be atomically replaced

      # Dependencies (bind mounts for CI)
      - ./node_modules:/app/node_modules

      # Source and Tests (read-write for lint-staged auto-fix)
      - ./src:/app/src
      - ./tests:/app/tests
      - ./templates:/app/templates
      # Frontend asset sources — the dev-dashboard vitest suites import
      # @resources/js/dev-dashboard/*; without this mount they fail to resolve.
      - ./resources:/app/resources

      # Workspace node_modules (MUST be after ./src mount)
      - ./src/node/backend/node_modules:/app/src/node/backend/node_modules
      - ./src/node/frontend/node_modules:/app/src/node/frontend/node_modules

      # Documentation and boilerplate config
      - ./.zappzarapp:/app/.zappzarapp
      - ./README.md:/app/README.md

      # Linting/Formatting config files
      - ./eslint.config.js:/app/eslint.config.js:ro
      - ./.prettierrc.json:/app/.prettierrc.json:ro
      - ./.prettierignore:/app/.prettierignore:ro
      - ./.markdownlint-cli2.jsonc:/app/.markdownlint-cli2.jsonc:ro

      # TypeScript config (for type-check)
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./tsconfig.resources.json:/app/tsconfig.resources.json:ro
      - ./tsconfig.base.json:/app/tsconfig.base.json:ro
      - ./tsconfig.build.json:/app/tsconfig.build.json:ro
      - ./tsconfig.vitest.json:/app/tsconfig.vitest.json:ro
      - ./vitest.config.ts:/app/vitest.config.ts:ro

      # pnpm workspace config
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml:ro
    environment:
      - TZ=${TZ:-UTC}
      - NODE_ENV=development
    # No entrypoint - run commands directly
    entrypoint: []
    command: ["echo", "dev-tools container ready"]

volumes:
  # From compose.yaml (needed for PHP-FPM socket)
  php-fpm-socket:
    driver: local
  # Note: vendor, node_modules, and workspace node_modules use bind mounts (not named volumes)
  # to allow BATS tests to verify directories exist on the host filesystem
