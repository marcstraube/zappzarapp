<!DOCTYPE html>
<html lang="en">
<head>

    <title>zappzarapp</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            padding: 3rem;
            text-align: center;
            max-width: 500px;
        }
        .logo {
            width: 96px;
            height: 96px;
            margin-bottom: 1.5rem;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: #1a1a2e;
        }

            font-family: monospace;
            color: #666;
            margin-bottom: 0.5rem;
        }
        .tagline {
            font-style: italic;
            color: #555;
            margin-bottom: 2rem;
            line-height: 1.5;
        }
        .links {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .links a {
            color: #667eea;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border: 1px solid #667eea;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .links a:hover {

            color: white;
        }

</head>
<body>
    <div class="card">

                    <stop offset="0%" style="stop-color:#FFD700"/>
                    <stop offset="100%" style="stop-color:#FFA500"/>

            <path d="M36 8 L18 34 L28 34 L24 56 L46 28 L34 28 Z" fill="url(#bolt)"/>
        </svg>
        <h1>zappzarapp</h1>

        <div class="links">
