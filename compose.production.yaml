# ./compose.production.yaml
# Docker Compose Production Environment
#
# Usage:
#   Single-server: make up (with ZAPPZARAPP_ENV=production)
#   Multi-node:    make k8s-deploy (Kubernetes/Helm)
#
# SECRETS HANDLING:
#   Docker Compose (standalone) does NOT support uid/gid/mode for secrets.
#   We use bind mounts instead: ./secrets:/run/secrets:ro
#   Secret files are created with mode 0644 by 'make setup'.
#   For production with stricter security, use Kubernetes (native secrets with fsGroup).
#
# UIDs reference (verified against the built images' /etc/passwd — Alpine
# uids differ from the Debian variants):
#   nginx:       100:101 (nginx user in Alpine)
#   php:         82:82   (www-data in Alpine)
#   node:        50000:50000 (custom node user)
#   postgres:    70:70   (postgres user in Alpine)
#   mariadb:     999:999 (mysql user)
#   redis:       999:1000 (redis user in Alpine)
#   rabbitmq:    100:101 (rabbitmq user in Alpine)
#   seaweedfs:   1000:1000 (image user)
#   meilisearch/mercure/mailpit: 1000:1000 (no dedicated image user; data
#     directories are chowned to 1000 in the Dockerfiles)
#   elasticsearch: 1000:0 (USER directive in the image)
#
# Every service runs unprivileged (user: directive or image USER) with
# cap_drop: ALL and no capability adds; the official DB/broker entrypoints
# skip their root-only chown/gosu/su-exec phase when started unprivileged.
#
# SERVICE ORDER: Core → Data → Optional (alphabetically within each category)
#   Core:     nginx, node, node-backend, php
#   Data:     mariadb, postgres, redis
#   Optional: elasticsearch, mailpit, meilisearch, mercure, rabbitmq, seaweedfs

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # CORE SERVICES
  # ═══════════════════════════════════════════════════════════════════════════

  nginx:
    build:
      target: production
      # Vite assets are copied from the node-backend image via the tagless
      # `node-backend-assets` context (COPY --from=node-backend-assets). As a
      # docker-image context, BuildKit loads the local node-backend image that the
      # `make` production targets build + tag :latest first. CI resolves the same
      # tagless ref via bake `contexts` (see docker-bake.hcl).
      additional_contexts:
        - "node-backend-assets=docker-image://zappzarapp-node-backend:latest"
    # Run as nginx user (uid 100, gid 101 in the Alpine image) - completely
    # unprivileged
    user: "100:101"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - ENABLE_PHP=${ENABLE_PHP:-true}
    volumes:
      # Shared socket directory for PHP-FPM Unix socket communication
      - php-fpm-socket:/var/run/php-fpm
      # Production SSL config template (processed by entrypoint at runtime)
      - ./docker/nginx/conf.d/ssl-production.conf.template:/etc/nginx/conf.d/ssl-production.conf.template:ro
      # SSL certificates (bind mount; key is 0600 + ACL for uid 101,
      # set by docker/certs/generate-internal.sh)
      - ./docker/certs/nginx/cert.crt:/etc/nginx/certs/cert.crt:ro
      - ./docker/certs/nginx/cert.key:/etc/nginx/certs/cert.key:ro
    read_only: true
    tmpfs:
      # All tmpfs owned by nginx user (uid 101) - no root needed
      - /var/cache/nginx:mode=0770,uid=101,gid=101,size=64M
      - /var/log/nginx:mode=0770,uid=101,gid=101,size=32M
      - /var/lib/nginx/tmp:mode=0770,uid=101,gid=101,size=64M
      - /tmp:mode=0770,uid=101,gid=101,size=32M
      - /run:mode=0770,uid=101,gid=101,size=16M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # NO cap_add needed - runs entirely as unprivileged nginx user
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
          pids: 64
        reservations:
          cpus: '1.0'
          memory: 1G

  node:
    # Run directly as node user (no privilege dropping needed with bind-mounted secrets)
    user: "50000:50000"
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=256M
      - /home/node/.cache:mode=0770,uid=50000,gid=50000,size=256M
    volumes:
      # Secrets (bind mount, readable by all container users)
      - ./secrets:/run/secrets:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
          pids: 128
        reservations:
          cpus: '0.25'
          memory: 256M

  node-backend:
    # Run directly as node user (no privilege dropping needed with bind-mounted secrets)
    user: "50000:50000"
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=256M
      - /home/node/.cache:mode=0770,uid=50000,gid=50000,size=256M
    volumes:
      # Secrets (bind mount, readable by all container users)
      - ./secrets:/run/secrets:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
          pids: 128
        reservations:
          cpus: '0.25'
          memory: 256M

  php:
    build:
      target: production
      # See the nginx service above: the tagless `node-backend-assets` context
      # loads the locally-built node-backend image (tagged :latest by the `make`
      # production targets) so BuildKit resolves COPY --from without a pull.
      additional_contexts:
        - "node-backend-assets=docker-image://zappzarapp-node-backend:latest"
    # Run as www-data user (uid 82) - completely unprivileged
    user: "82:82"
    volumes:
      # Shared socket directory for PHP-FPM Unix socket communication
      # Socket mode 0666 (set in php-fpm.conf) allows nginx to connect
      - php-fpm-socket:/var/run/php-fpm
      # Persistent Storage for Uploads and generated files
      - ${STORAGE_DIR:-./storage}:/var/www/html/storage:rw
      # Secrets (bind mount, readable by all container users - mode 0644)
      - ./secrets:/run/secrets:ro
    read_only: true
    tmpfs:
      # Owned by www-data (uid 82) - no root needed
      - /tmp:mode=0770,uid=82,gid=82,size=1G
      # Twig template cache (read-only filesystem requires tmpfs for cache writes)
      - /var/www/html/build/cache:mode=0770,uid=82,gid=82,size=256M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # NO cap_add needed - runs entirely as unprivileged www-data user
    environment:
      - ZAPPZARAPP_ENV=production
      # Hard-off in production: the committed .env enables the toolbar for
      # development, and the guard's explicit switch takes precedence over its
      # environment gate - without this override the toolbar (a full $_SERVER
      # dump incl. container IPs) renders on production pages (ZAP finding).
      - ENABLE_DEV_TOOLBAR=false
      # Same hard-off for the DevDashboard (belt to the dev-only routing in
      # public/index.php and the early return in DevDashboard/routes.php)
      - ENABLE_DEV_DASHBOARD=false
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
          pids: 256
        reservations:
          cpus: '1.0'
          memory: 1G

  # ═══════════════════════════════════════════════════════════════════════════
  # DATA SERVICES
  # ═══════════════════════════════════════════════════════════════════════════

  mariadb:
    # Run directly as the mysql user: the official entrypoint skips its
    # root-only chown/gosu phase, so no capabilities are needed. Secrets are
    # 0644 and the cert key carries a read ACL for uid 999 (set by
    # docker/certs/generate-internal.sh).
    user: "999:999"
    environment:
      # Arms the entrypoint's fail-fast: missing SSL certificates abort startup
      ZAPPZARAPP_ENV: production
    read_only: true
    tmpfs:
      # All tmpfs owned by the mysql user (uid 999) - no root needed
      - /var/run/mysqld:mode=0770,uid=999,gid=999,size=64M
      - /tmp:mode=0770,uid=999,gid=999,size=256M
      # Cert destination (entrypoint copies the key here so it is owned by
      # the server user, as mariadbd requires)
      - /etc/mysql/certs:mode=0770,uid=999,gid=999,size=1M
      # Slow query log target (see --slow-query-log-file below)
      - /var/log/mysql:mode=0770,uid=999,gid=999,size=64M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    shm_size: 256mb
    volumes:
      - mariadb-data:/var/lib/mysql
      # Secrets (bind mount)
      - ./secrets:/run/secrets:ro
      # SSL certificates (mounted to /tmp/certs, entrypoint copies with correct ownership)
      - ./docker/certs/internal:/tmp/certs:ro
    command: >
      --innodb-buffer-pool-size=256M
      --max-connections=100
      --innodb-log-file-size=64M
      --innodb-flush-log-at-trx-commit=2
      --innodb-flush-method=O_DIRECT
      --slow-query-log=1
      --slow-query-log-file=/var/log/mysql/slow.log
      --long-query-time=1
      --ssl-ca=/etc/mysql/certs/server.crt
      --ssl-cert=/etc/mysql/certs/server.crt
      --ssl-key=/etc/mysql/certs/server.key
      --require-secure-transport=ON
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
          pids: 128
        reservations:
          cpus: '0.5'
          memory: 512M

  postgres:
    # Run directly as the postgres user: the official entrypoint skips its
    # root-only chown/gosu phase, so no capabilities are needed. Secrets are
    # 0644 and the cert key carries a read ACL for uid 70 (set by
    # docker/certs/generate-internal.sh).
    user: "70:70"
    environment:
      # Arms the entrypoint's fail-fast: missing SSL certificates abort startup
      ZAPPZARAPP_ENV: production
    read_only: true
    tmpfs:
      # Socket dir + cert destination (entrypoint copies the key into
      # /run/postgresql/certs so it is owned by the server user, as
      # postgres requires) - owned by uid 70, no root needed
      - /run/postgresql:mode=0770,uid=70,gid=70,size=64M
      - /tmp:mode=0770,uid=70,gid=70,size=256M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    shm_size: 256mb
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Secrets (bind mount)
      - ./secrets:/run/secrets:ro
      # SSL certificates (mounted to /tmp/certs, entrypoint copies with correct ownership)
      - ./docker/certs/internal:/tmp/certs:ro
    command: >
      postgres
      -c shared_buffers=256MB
      -c max_connections=100
      -c effective_cache_size=512MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=2621kB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c log_destination=stderr
      -c logging_collector=off
      -c log_min_duration_statement=1000
      -c ssl=on
      -c ssl_cert_file=/run/postgresql/certs/server.crt
      -c ssl_key_file=/run/postgresql/certs/server.key
      -c ssl_min_protocol_version=TLSv1.2
      -c shared_preload_libraries=pg_cron
      -c cron.database_name=${DB_NAME:-app}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
          pids: 128
        reservations:
          cpus: '0.5'
          memory: 512M

  redis:
    # Run directly as redis user (no privilege dropping needed with no-new-privileges)
    user: "999:1000"
    read_only: true
    tmpfs:
      - /tmp:mode=0770,uid=999,gid=1000,size=64M
    volumes:
      - redis-data:/data
      # SSL certificates (bind mount)
      - ./docker/certs/internal/cert.crt:/etc/redis/certs/cert.crt:ro
      - ./docker/certs/internal/cert.key:/etc/redis/certs/cert.key:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Use custom entrypoint for SSL validation (defined in Dockerfile)
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - "900 1"
      - --save
      - "300 10"
      - --save
      - "60 10000"
      - --tls-port
      - "6379"
      - --port
      - "0"
      - --tls-cert-file
      - /etc/redis/certs/cert.crt
      - --tls-key-file
      - /etc/redis/certs/cert.key
      - --tls-auth-clients
      - "no"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
          pids: 32
        reservations:
          cpus: '0.25'
          memory: 256M

  # ═══════════════════════════════════════════════════════════════════════════
  # OPTIONAL SERVICES - Production Hardening (alphabetically sorted)
  # ═══════════════════════════════════════════════════════════════════════════

  elasticsearch:
    read_only: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      # Production: Enable security
      xpack.security.enabled: 'true'
      # Minimal logging
      logger.level: WARN
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
          pids: 256
        reservations:
          cpus: '0.5'
          memory: 1G

  # Note: Mailpit is typically NOT used in production
  # Configure your app to use a real mail provider (SendGrid, Mailgun, etc.)
  mailpit:
    deploy:
      replicas: 0

  meilisearch:
    # Run as uid 1000 (no dedicated image user; /meili_data is chowned to
    # 1000 in the Dockerfile so the named volume inherits that ownership).
    # Secrets are 0644 and the cert key carries a read ACL for uid 1000
    # (set by docker/certs/generate-internal.sh).
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:mode=0770,uid=1000,gid=1000,size=64M
    volumes:
      # Secrets (bind mount)
      - ./secrets:/run/secrets:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      # Production environment
      MEILI_ENV: production
      # Minimal logging
      MEILI_LOG_LEVEL: WARN
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
          pids: 64
        reservations:
          cpus: '0.25'
          memory: 256M

  mercure:
    # Run as uid 1000 (no dedicated image user; /data and /config are
    # chowned to 1000 in the Dockerfile so the named volume inherits that
    # ownership). Secrets are 0644 and the cert key carries a read ACL for
    # uid 1000 (set by docker/certs/generate-internal.sh).
    user: "1000:1000"
    # Caddy binds :443 as an unprivileged user inside the container netns
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    read_only: true
    tmpfs:
      # All tmpfs owned by uid 1000 - no root needed
      - /tmp:mode=0770,uid=1000,gid=1000,size=64M
      # Caddy config autosave dir (XDG_CONFIG_HOME)
      - /config:mode=0770,uid=1000,gid=1000,size=16M
    volumes:
      # Secrets (bind mount)
      - ./secrets:/run/secrets:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      # Production: no anonymous subscribers - only cors_origins remains,
      # which the entrypoint builds from CORS_ORIGINS
      MERCURE_EXTRA_DIRECTIVES: ""
      # Restrict CORS to specific origins (default: allow all); the
      # entrypoint translates this comma-separated canonical list into
      # Mercure's space-separated cors_origins directive
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
          pids: 32
        reservations:
          cpus: '0.1'
          memory: 64M

  rabbitmq:
    # Run directly as the rabbitmq user (uid 100, gid 101 in the Alpine
    # image): the official entrypoint skips its root-only chown/su-exec
    # phase, so no capabilities are needed. Secrets are 0644 and the cert
    # key carries a read ACL for uid 100 (set by
    # docker/certs/generate-internal.sh).
    user: "100:101"
    environment:
      # Arms the entrypoint's fail-fast: missing SSL certificates abort startup
      ZAPPZARAPP_ENV: production
    read_only: true
    tmpfs:
      # Owned by the rabbitmq user (uid 100) - no root needed
      - /tmp:mode=0770,uid=100,gid=101,size=256M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      # RabbitMQ TLS configuration (production - TLS only)
      - ./docker/rabbitmq/rabbitmq-production.conf:/etc/rabbitmq/rabbitmq.conf:ro
      # Secrets (bind mount)
      - ./secrets:/run/secrets:ro
      # SSL certificates (bind mount)
      - ./docker/certs/internal/cert.crt:/etc/rabbitmq/certs/server.crt:ro
      - ./docker/certs/internal/cert.key:/etc/rabbitmq/certs/server.key:ro
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
          pids: 128
        reservations:
          cpus: '0.25'
          memory: 128M

  seaweedfs:
    # Run directly as the seaweedfs user (uid 1000): the entrypoint skips its
    # root-only chown/su-exec phase, so no capabilities are needed. Secrets
    # are 0644 and the cert key carries a read ACL for uid 1000 (set by
    # docker/certs/generate-internal.sh).
    user: "1000:1000"
    environment:
      # Arms the entrypoint's fail-fast: missing SSL certificates abort startup
      ZAPPZARAPP_ENV: production
    read_only: true
    tmpfs:
      # All tmpfs owned by the seaweedfs user (uid 1000) - no root needed
      - /tmp:mode=0770,uid=1000,gid=1000,size=64M
      # Entrypoint-written S3 credentials config and cert copies
      - /etc/seaweedfs/config:mode=0770,uid=1000,gid=1000,size=1M
      - /etc/seaweedfs/certs:mode=0770,uid=1000,gid=1000,size=1M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - seaweedfs-data:/data
      # Secrets (bind mount)
      - ./secrets:/run/secrets:ro
      # SSL certificates (TLS is configured via entrypoint)
      - ./docker/certs/internal/cert.crt:/etc/ssl/certs/cert.crt:ro
      - ./docker/certs/internal/cert.key:/etc/ssl/private/cert.key:ro
    # Healthcheck defined in Dockerfile
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
          pids: 64
        reservations:
          cpus: '0.25'
          memory: 256M
