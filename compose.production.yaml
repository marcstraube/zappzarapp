# ./compose.production.yaml
# Docker Compose Production Environment
#
# IMPORTANT: Production requires Docker Swarm for proper secrets permissions.
# Usage: make swarm-deploy
#
# UIDs reference (from container images):
#   nginx:    101 (nginx user in Alpine)
#   php:      82  (www-data in Alpine)
#   node:     50000 (custom node user)
#   redis:    999 (redis user)
#   postgres: 70  (postgres user in Alpine)
#   mariadb:  999 (mysql user)

services:
  nginx:
    build:
      target: production
    volumes:
      # Shared socket directory for PHP-FPM Unix socket communication
      - php-fpm-socket:/var/run/php-fpm
      # Production SSL config
      - ./docker/nginx/conf.d/ssl-production.conf:/etc/nginx/conf.d/ssl.conf:ro
    # SSL certificates via secrets (defined in compose.yaml)
    read_only: true
    tmpfs:
      # Mode 1777 REQUIRED: nginx starts as root, needs write access before user switch
      - /var/cache/nginx:mode=1777,size=64M
      - /var/log/nginx:mode=1777,size=32M
      - /var/lib/nginx/tmp:mode=1777,size=64M
      - /tmp:mode=1777,size=32M
      - /var/run:mode=1777,size=16M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # REQUIRED: nginx needs this for dlopen() to load dynamic modules (brotli etc)
      - DAC_READ_SEARCH
      # REQUIRED: chown tmpfs and user switch
      - CHOWN
      - SETUID
      - SETGID
    secrets:
      - source: ssl_cert
        target: /etc/nginx/certs/cert.crt
        uid: '101'
        gid: '101'
        mode: 0444
      - source: ssl_key
        target: /etc/nginx/certs/cert.key
        uid: '101'
        gid: '101'
        mode: 0400
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
          pids: 64
        reservations:
          cpus: '1.0'
          memory: 1G

  php:
    build:
      target: production
    volumes:
      # Shared socket directory for PHP-FPM Unix socket communication
      - php-fpm-socket:/var/run/php-fpm
      # Persistent Storage for Uploads and generated files
      - ${STORAGE_DIR:-./storage}:/var/www/html/storage:rw
    read_only: true
    tmpfs:
      - /tmp:mode=0770,uid=82,gid=82,size=1G
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # REQUIRED: PHP-FPM socket chown and user switch
      - CHOWN
      - SETUID
      - SETGID
    secrets:
      - source: db_password
        uid: '82'
        gid: '82'
        mode: 0400
      - source: encryption_key
        uid: '82'
        gid: '82'
        mode: 0400
      - source: backup_encryption_key
        uid: '82'
        gid: '82'
        mode: 0400
    environment:
      - ENV=production
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
          pids: 256
        reservations:
          cpus: '1.0'
          memory: 1G

  node:
    read_only: true
    tmpfs:
      - /tmp:mode=0770,uid=50000,gid=50000,size=256M
      - /home/node/.cache:mode=0770,uid=50000,gid=50000,size=256M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    secrets:
      - source: db_password
        uid: '50000'
        gid: '50000'
        mode: 0400
      - source: encryption_key
        uid: '50000'
        gid: '50000'
        mode: 0400
      - source: backup_encryption_key
        uid: '50000'
        gid: '50000'
        mode: 0400
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
          pids: 128
        reservations:
          cpus: '0.25'
          memory: 256M

  redis:
    read_only: true
    tmpfs:
      - /tmp:mode=0770,uid=999,gid=999,size=64M
    volumes:
      - redis-data:/data
    # SSL certificates via secrets (defined in compose.yaml)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # REQUIRED: redis entrypoint needs to fix data dir permissions and switch user
      - SETUID
      - SETGID
    secrets:
      - source: ssl_cert
        uid: '999'
        gid: '999'
        mode: 0444
      - source: ssl_key
        uid: '999'
        gid: '999'
        mode: 0400
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --tls-port 6379
      --port 0
      --tls-cert-file /run/secrets/ssl_cert
      --tls-key-file /run/secrets/ssl_key
      --tls-auth-clients no
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
          pids: 32
        reservations:
          cpus: '0.25'
          memory: 256M

  postgres:
    read_only: false
    tmpfs:
      - /tmp:mode=0770,uid=70,gid=70,size=256M
      - /run/postgresql:mode=0770,uid=70,gid=70,size=64M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # REQUIRED: SSL cert ownership and user switch
      - CHOWN
      - SETUID
      - SETGID
      # REQUIRED: entrypoint needs chmod on SSL certs
      - FOWNER
    shm_size: 256mb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    secrets:
      - source: db_password
        uid: '70'
        gid: '70'
        mode: 0400
      - source: ssl_cert
        uid: '70'
        gid: '70'
        mode: 0444
      - source: ssl_key
        uid: '70'
        gid: '70'
        mode: 0400
    command: >
      postgres
      -c shared_buffers=256MB
      -c max_connections=100
      -c effective_cache_size=512MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=2621kB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c log_destination=stderr
      -c logging_collector=off
      -c log_min_duration_statement=1000
      -c ssl=on
      -c ssl_cert_file=/var/lib/postgresql/server.crt
      -c ssl_key_file=/var/lib/postgresql/server.key
      -c shared_preload_libraries=pg_cron
      -c cron.database_name=${DB_NAME:-app}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
          pids: 128
        reservations:
          cpus: '0.5'
          memory: 512M

  mariadb:
    read_only: false
    tmpfs:
      - /tmp:mode=0770,uid=999,gid=999,size=256M
      - /var/run/mysqld:mode=0770,uid=999,gid=999,size=64M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # REQUIRED: user switch to mysql
      - CHOWN
      - SETUID
      - SETGID
    shm_size: 256mb
    volumes:
      - mariadb-data:/var/lib/mysql
    secrets:
      - source: db_password
        uid: '999'
        gid: '999'
        mode: 0400
      - source: db_root_password
        uid: '999'
        gid: '999'
        mode: 0400
      - source: ssl_cert
        uid: '999'
        gid: '999'
        mode: 0444
      - source: ssl_key
        uid: '999'
        gid: '999'
        mode: 0400
    command: >
      --innodb-buffer-pool-size=256M
      --max-connections=100
      --innodb-log-file-size=64M
      --innodb-flush-log-at-trx-commit=2
      --innodb-flush-method=O_DIRECT
      --slow-query-log=1
      --slow-query-log-file=/var/log/mysql/slow.log
      --long-query-time=1
      --ssl-ca=/run/secrets/ssl_cert
      --ssl-cert=/run/secrets/ssl_cert
      --ssl-key=/run/secrets/ssl_key
      --require-secure-transport=ON
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
          pids: 128
        reservations:
          cpus: '0.5'
          memory: 512M

  # ═══════════════════════════════════════════════════════════════════════════
  # OPTIONAL SERVICES - Production Hardening
  # ═══════════════════════════════════════════════════════════════════════════

  mercure:
    read_only: true
    tmpfs:
      - /tmp:mode=0770,size=64M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    secrets:
      - source: mercure_jwt_secret
        uid: '0'
        gid: '0'
        mode: 0400
    environment:
      # Production: Restrict CORS to specific origins
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins ${CORS_ORIGINS:-}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
          pids: 32
        reservations:
          cpus: '0.1'
          memory: 64M

  meilisearch:
    read_only: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    secrets:
      - source: meilisearch_master_key
        uid: '0'
        gid: '0'
        mode: 0400
    environment:
      # Production environment
      MEILI_ENV: production
      # Minimal logging
      MEILI_LOG_LEVEL: WARN
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
          pids: 64
        reservations:
          cpus: '0.25'
          memory: 256M

  elasticsearch:
    read_only: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      # Production: Enable security
      xpack.security.enabled: 'true'
      # Minimal logging
      logger.level: WARN
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
          pids: 256
        reservations:
          cpus: '0.5'
          memory: 1G

  # Note: Mailpit is typically NOT used in production
  # Configure your app to use a real mail provider (SendGrid, Mailgun, etc.)
  mailpit:
    deploy:
      replicas: 0

  minio:
    read_only: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - minio-data:/data
    secrets:
      - source: minio_root_user
        uid: '0'
        gid: '0'
        mode: 0400
      - source: minio_root_password
        uid: '0'
        gid: '0'
        mode: 0400
      - source: ssl_cert
        target: /root/.minio/certs/public.crt
        uid: '0'
        gid: '0'
        mode: 0444
      - source: ssl_key
        target: /root/.minio/certs/private.key
        uid: '0'
        gid: '0'
        mode: 0400
    environment:
      # Enable TLS (MinIO auto-detects certs in /root/.minio/certs/)
      MINIO_SERVER_URL: https://minio:9000
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
          pids: 64
        reservations:
          cpus: '0.25'
          memory: 256M

  rabbitmq:
    read_only: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      # RabbitMQ TLS configuration (production - TLS only)
      - ./docker/rabbitmq/rabbitmq-production.conf:/etc/rabbitmq/rabbitmq.conf:ro
    secrets:
      - source: rabbitmq_user
        uid: '999'
        gid: '999'
        mode: 0400
      - source: rabbitmq_password
        uid: '999'
        gid: '999'
        mode: 0400
      - source: ssl_cert
        target: /etc/rabbitmq/certs/server.crt
        uid: '999'
        gid: '999'
        mode: 0444
      - source: ssl_key
        target: /etc/rabbitmq/certs/server.key
        uid: '999'
        gid: '999'
        mode: 0400
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
          pids: 128
        reservations:
          cpus: '0.25'
          memory: 128M
