# ./compose.production.yaml
# Docker Compose Production Environment
#
# Usage:
#   Single-server: make up (with ENV=production)
#   Multi-node:    make k8s-deploy (Kubernetes/Helm)
#
# SECRETS HANDLING:
#   Docker Compose (standalone) does NOT support uid/gid/mode for secrets.
#   We use bind mounts instead: ./secrets:/run/secrets:ro
#   Secret files are created with mode 0644 by 'make setup'.
#   For production with stricter security, use Kubernetes (native secrets with fsGroup).
#
# UIDs reference (from container images):
#   nginx:    101 (nginx user in Alpine)
#   php:      82  (www-data in Alpine)
#   node:     50000 (custom node user)
#   redis:    999 (redis user)
#   postgres: 70  (postgres user in Alpine)
#   mariadb:  999 (mysql user)

services:
  nginx:
    build:
      target: production
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - ENABLE_PHP=${ENABLE_PHP:-true}
    volumes:
      # Shared socket directory for PHP-FPM Unix socket communication
      - php-fpm-socket:/var/run/php-fpm
      # Production SSL config template (processed by entrypoint at runtime)
      - ./docker/nginx/conf.d/ssl-production.conf.template:/etc/nginx/conf.d/ssl-production.conf.template:ro
      # SSL certificates (bind mount, readable by all container users)
      - ./docker/certs/cert.crt:/etc/nginx/certs/cert.crt:ro
      - ./docker/certs/cert.key:/etc/nginx/certs/cert.key:ro
    read_only: true
    tmpfs:
      # Mode 1777 REQUIRED: nginx starts as root, needs write access before user switch
      - /var/cache/nginx:mode=1777,size=64M
      - /var/log/nginx:mode=1777,size=32M
      - /var/lib/nginx/tmp:mode=1777,size=64M
      - /tmp:mode=1777,size=32M
      - /var/run:mode=1777,size=16M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # REQUIRED: nginx needs this for dlopen() to load dynamic modules (brotli etc)
      - DAC_READ_SEARCH
      # REQUIRED: chown tmpfs and user switch
      - CHOWN
      - SETUID
      - SETGID
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
          pids: 64
        reservations:
          cpus: '1.0'
          memory: 1G

  php:
    build:
      target: production
    volumes:
      # Shared socket directory for PHP-FPM Unix socket communication
      - php-fpm-socket:/var/run/php-fpm
      # Persistent Storage for Uploads and generated files
      - ${STORAGE_DIR:-./storage}:/var/www/html/storage:rw
      # Secrets (bind mount, readable by all container users)
      - ./secrets:/run/secrets:ro
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=1G
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # REQUIRED: PHP-FPM socket chown and user switch
      - CHOWN
      - SETUID
      - SETGID
    environment:
      - ENV=production
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
          pids: 256
        reservations:
          cpus: '1.0'
          memory: 1G

  node:
    # Run directly as node user (no privilege dropping needed with bind-mounted secrets)
    user: "50000:50000"
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=256M
      - /home/node/.cache:mode=0770,uid=50000,gid=50000,size=256M
    volumes:
      # Secrets (bind mount, readable by all container users)
      - ./secrets:/run/secrets:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
          pids: 128
        reservations:
          cpus: '0.25'
          memory: 256M

  node-backend:
    # Run directly as node user (no privilege dropping needed with bind-mounted secrets)
    user: "50000:50000"
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=256M
      - /home/node/.cache:mode=0770,uid=50000,gid=50000,size=256M
    volumes:
      # Secrets (bind mount, readable by all container users)
      - ./secrets:/run/secrets:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
          pids: 128
        reservations:
          cpus: '0.25'
          memory: 256M

  redis:
    # Run directly as redis user (no privilege dropping needed with no-new-privileges)
    user: "999:1000"
    read_only: true
    tmpfs:
      - /tmp:mode=0770,uid=999,gid=1000,size=64M
    volumes:
      - redis-data:/data
      # SSL certificates (bind mount)
      - ./docker/certs/cert.crt:/etc/redis/certs/cert.crt:ro
      - ./docker/certs/cert.key:/etc/redis/certs/cert.key:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Skip redis entrypoint and run redis-server directly
    entrypoint: ["redis-server"]
    command:
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - "900 1"
      - --save
      - "300 10"
      - --save
      - "60 10000"
      - --tls-port
      - "6379"
      - --port
      - "0"
      - --tls-cert-file
      - /etc/redis/certs/cert.crt
      - --tls-key-file
      - /etc/redis/certs/cert.key
      - --tls-auth-clients
      - "no"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
          pids: 32
        reservations:
          cpus: '0.25'
          memory: 256M

  postgres:
    read_only: false
    tmpfs:
      - /run/postgresql:mode=0770,uid=70,gid=70,size=64M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # REQUIRED: SSL cert ownership and user switch
      - CHOWN
      - SETUID
      - SETGID
      # FOWNER: allows chmod on files not owned by root (for cert permissions)
      - FOWNER
      # Note: DAC_OVERRIDE not needed - secrets/certs are 0644 (world-readable)
    shm_size: 256mb
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Secrets (bind mount)
      - ./secrets:/run/secrets:ro
      # SSL certificates (mounted to /tmp/certs, entrypoint copies with correct ownership)
      - ./docker/certs:/tmp/certs:ro
    command: >
      postgres
      -c shared_buffers=256MB
      -c max_connections=100
      -c effective_cache_size=512MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=2621kB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c log_destination=stderr
      -c logging_collector=off
      -c log_min_duration_statement=1000
      -c ssl=on
      -c ssl_cert_file=/var/lib/postgresql/server.crt
      -c ssl_key_file=/var/lib/postgresql/server.key
      -c shared_preload_libraries=pg_cron
      -c cron.database_name=${DB_NAME:-app}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
          pids: 128
        reservations:
          cpus: '0.5'
          memory: 512M

  mariadb:
    read_only: false
    tmpfs:
      - /var/run/mysqld:mode=0770,uid=999,gid=999,size=64M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # REQUIRED: user switch to mysql and cert ownership
      - CHOWN
      - SETUID
      - SETGID
      # FOWNER: allows chmod on files not owned by root (for cert permissions)
      - FOWNER
      # Note: DAC_OVERRIDE not needed - secrets/certs are 0644 (world-readable)
    shm_size: 256mb
    volumes:
      - mariadb-data:/var/lib/mysql
      # Secrets (bind mount)
      - ./secrets:/run/secrets:ro
      # SSL certificates (mounted to /tmp/certs, entrypoint copies with correct ownership)
      - ./docker/certs:/tmp/certs:ro
    command: >
      --innodb-buffer-pool-size=256M
      --max-connections=100
      --innodb-log-file-size=64M
      --innodb-flush-log-at-trx-commit=2
      --innodb-flush-method=O_DIRECT
      --slow-query-log=1
      --slow-query-log-file=/var/log/mysql/slow.log
      --long-query-time=1
      --ssl-ca=/etc/mysql/certs/server.crt
      --ssl-cert=/etc/mysql/certs/server.crt
      --ssl-key=/etc/mysql/certs/server.key
      --require-secure-transport=ON
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
          pids: 128
        reservations:
          cpus: '0.5'
          memory: 512M

  # ═══════════════════════════════════════════════════════════════════════════
  # OPTIONAL SERVICES - Production Hardening
  # ═══════════════════════════════════════════════════════════════════════════

  mercure:
    read_only: true
    tmpfs:
      - /tmp:mode=0770,size=64M
    volumes:
      # Secrets (bind mount)
      - ./secrets:/run/secrets:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      # Production: Restrict CORS to specific origins (default: allow all)
      MERCURE_EXTRA_DIRECTIVES: 'cors_origins "${CORS_ORIGINS:-*}"'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
          pids: 32
        reservations:
          cpus: '0.1'
          memory: 64M

  meilisearch:
    read_only: false
    volumes:
      # Secrets (bind mount)
      - ./secrets:/run/secrets:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      # Production environment
      MEILI_ENV: production
      # Minimal logging
      MEILI_LOG_LEVEL: WARN
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
          pids: 64
        reservations:
          cpus: '0.25'
          memory: 256M

  elasticsearch:
    read_only: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      # Production: Enable security
      xpack.security.enabled: 'true'
      # Minimal logging
      logger.level: WARN
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
          pids: 256
        reservations:
          cpus: '0.5'
          memory: 1G

  # Note: Mailpit is typically NOT used in production
  # Configure your app to use a real mail provider (SendGrid, Mailgun, etc.)
  mailpit:
    deploy:
      replicas: 0

  minio:
    read_only: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - minio-data:/data
      # Secrets (bind mount)
      - ./secrets:/run/secrets:ro
      # SSL certificates (bind mount to MinIO's expected location)
      - ./docker/certs/cert.crt:/root/.minio/certs/public.crt:ro
      - ./docker/certs/cert.key:/root/.minio/certs/private.key:ro
    environment:
      # Enable TLS (MinIO auto-detects certs in /root/.minio/certs/)
      MINIO_SERVER_URL: https://minio:9000
    # Override healthcheck for TLS (mc ready doesn't work well with self-signed certs)
    healthcheck:
      test: ["CMD", "curl", "-sfk", "https://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
          pids: 64
        reservations:
          cpus: '0.25'
          memory: 256M

  rabbitmq:
    read_only: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # REQUIRED: RabbitMQ entrypoint uses chown/chmod for cookie permissions
      - CHOWN
      - SETUID
      - SETGID
      # Note: DAC_READ_SEARCH not needed - healthcheck uses su-exec to run as rabbitmq user
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      # RabbitMQ TLS configuration (production - TLS only)
      - ./docker/rabbitmq/rabbitmq-production.conf:/etc/rabbitmq/rabbitmq.conf:ro
      # Secrets (bind mount)
      - ./secrets:/run/secrets:ro
      # SSL certificates (bind mount)
      - ./docker/certs/cert.crt:/etc/rabbitmq/certs/server.crt:ro
      - ./docker/certs/cert.key:/etc/rabbitmq/certs/server.key:ro
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
          pids: 128
        reservations:
          cpus: '0.25'
          memory: 128M
