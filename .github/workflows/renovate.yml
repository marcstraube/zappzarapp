name: Renovate

# Self-hosted Renovate runner.
#
# This is the cross-platform / no-third-party-SaaS activation path: the same
# renovate/renovate that `make renovate` uses locally and that .gitlab-ci.yml can
# drive on GitLab. The Mend Renovate GitHub App is the zero-setup alternative for
# GitHub-only users (see docs/development/RENOVATE.md).
#
# Requires a RENOVATE_TOKEN repository secret — a fine-grained PAT scoped to THIS
# repo with: Contents RW, Pull requests RW, Issues RW (Dependency Dashboard),
# Workflows RW (Renovate updates .github/workflows/*). Config: ./renovate.json.
#
# Manual runs default to automerge OFF so the first rounds can be reviewed before
# anything merges itself; scheduled runs let renovate.json govern (automerge on).

on:
  workflow_dispatch:
    inputs:
      disableAutomerge:
        description: "Open PRs but don't auto-merge them (recommended for the first runs)"
        type: boolean
        default: true
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

permissions:
  contents: read # Renovate authenticates via RENOVATE_TOKEN, not GITHUB_TOKEN

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Run Renovate
        uses: renovatebot/github-action@v46
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_AUTODISCOVER: "false"
          LOG_LEVEL: debug
          # Runtime override applied last, over renovate.json. On manual runs the
          # input defaults to true → automerge disabled for that run. Scheduled
          # runs leave it empty → renovate.json governs (automerge on).
          RENOVATE_FORCE: ${{ github.event.inputs.disableAutomerge == 'true' && '{"automerge":false}' || '' }}
