name: Renovate

# Self-hosted Renovate runner — OPT-IN.
#
# The zero-setup default for GitHub-only repos is the hosted Mend Renovate App
# (see docs/development/RENOVATE.md). This workflow is the cross-platform /
# no-third-party-SaaS alternative: the same renovate/renovate that
# `make renovate` uses locally and that .gitlab-ci.yml can drive on GitLab.
#
# The weekly schedule only runs when the repository variable
# RENOVATE_SELF_HOSTED is set to "true" — without the opt-in the job skips
# instead of failing red every week on repos that never configured a token.
# Manual runs (workflow_dispatch) always work.
#
# Requires a RENOVATE_TOKEN repository secret — a fine-grained PAT scoped to THIS
# repo with: Contents RW, Pull requests RW, Issues RW (Dependency Dashboard),
# Commit statuses RW (minimumReleaseAge stability check), Workflows RW (Renovate
# updates .github/workflows/*), Dependabot alerts RO (vulnerability-alert
# prioritisation). Config: ./renovate.json.
#
# Optional auth upgrade: provide RENOVATE_APP_ID + RENOVATE_APP_PRIVATE_KEY
# secrets for a GitHub App (installed on this repo, same permissions as the
# PAT). The workflow then authenticates with an installation token and enables
# platform commits: Renovate creates its branch commits through the GitHub
# API, GitHub signs them (Verified) and attributes them to the app's bot
# identity. Platform commits stay off on the PAT path — under PAT auth they
# only switch the attribution to the token owner while staying unsigned.
#
# Manual runs default to automerge OFF so the first rounds can be reviewed before
# anything merges itself; scheduled runs let renovate.json govern (automerge on).

on:
  workflow_dispatch:
    inputs:
      disableAutomerge:
        description: "Open PRs but don't auto-merge them (recommended for the first runs)"
        type: boolean
        default: true
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

permissions:
  contents: read # Renovate authenticates via RENOVATE_TOKEN, not GITHUB_TOKEN

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    # Schedule is opt-in via repo variable; manual dispatch always runs.
    if: github.event_name == 'workflow_dispatch' || vars.RENOVATE_SELF_HOSTED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # A step-level if cannot read the secrets context - lift the presence
      # check into a job env flag; the secret values themselves stay scoped
      # to the token step below.
      HAS_RENOVATE_APP: ${{ secrets.RENOVATE_APP_ID != '' && secrets.RENOVATE_APP_PRIVATE_KEY != '' }}
    steps:
      # Runs only when the GitHub App secrets are configured (see the header);
      # without them the step skips and Renovate falls back to the PAT.
      - name: Generate GitHub App token
        id: app-token
        if: ${{ env.HAS_RENOVATE_APP == 'true' }}
        uses: actions/create-github-app-token@v3.2.0 # full pin, matching the action pin below; Renovate bumps this
        with:
          # The client-id input accepts the App's client ID as well as its
          # numeric app ID - both are valid JWT issuers for GitHub Apps
          client-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Run Renovate
        uses: renovatebot/github-action@v46.2.0 # only full tags published; Renovate bumps this
        with:
          token: ${{ steps.app-token.outputs.token || secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_AUTODISCOVER: "false"
          # Platform (API) commits only under App auth - they are GitHub-signed
          # there; under PAT auth they would merely switch the commit
          # attribution to the token owner while staying unsigned.
          RENOVATE_PLATFORM_COMMIT: ${{ steps.app-token.outputs.token != '' && 'enabled' || 'disabled' }}
          LOG_LEVEL: debug
          # Runtime override applied last, over renovate.json. On manual runs the
          # input defaults to true → automerge disabled for that run. Scheduled
          # runs leave it empty → renovate.json governs (automerge on).
          RENOVATE_FORCE: ${{ github.event.inputs.disableAutomerge == 'true' && '{"automerge":false}' || '' }}
