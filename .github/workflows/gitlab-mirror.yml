name: Mirror to GitLab

# Push-mirror GitHub -> GitLab so the GitLab CI pipeline runs on the same
# commits. GitHub stays the single source of truth (Issues/PRs); GitLab is a
# read-only downstream mirror that exercises .gitlab-ci.yml.
on:
  push:
    branches: [master, develop]
  workflow_dispatch:

# A mirror push must complete, never be cancelled by the next trigger. Parallel
# mirror jobs also race for GitLab's ref lock ("cannot lock ref"), so queue runs
# instead of running them concurrently (cancel-in-progress: false is deliberate).
concurrency:
  group: mirror-gitlab
  cancel-in-progress: false

# Least privilege: the mirror only reads the repo; pushing to GitLab uses
# GITLAB_MIRROR_TOKEN, not GITHUB_TOKEN
permissions:
  contents: read

jobs:
  mirror:
    name: Push mirror to GitLab
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Push current branch to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
        run: |
          if [ -z "${GITLAB_TOKEN}" ]; then
            echo "::error::GITLAB_MIRROR_TOKEN secret is not set - skipping mirror."
            exit 1
          fi
          git push --force \
            "https://oauth2:${GITLAB_TOKEN}@gitlab.com/marcstraube/zappzarapp.git" \
            "HEAD:refs/heads/${GITHUB_REF_NAME}"
