  #       run: |
  #         helm upgrade --install zappzarapp ./kubernetes \
  #           --namespace ${{ vars.KUBE_NAMESPACE || 'zappzarapp' }} \
  #           --create-namespace \
  #           -f kubernetes/values.production.yaml
