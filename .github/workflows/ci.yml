  #
  # Required Secrets (Settings > Secrets and variables > Actions):
  #   KUBECONFIG_DATA:  Base64-encoded kubeconfig file
  #   KUBE_NAMESPACE:   Target namespace (default: zappzarapp)
  #
  # See: .zappzarapp/docs/infrastructure/KUBERNETES.md
