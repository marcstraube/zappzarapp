name: CI/CD Pipeline

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save runner minutes.
# master is exempt: its runs validate the deployable artifact and must complete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  # Note: COMPOSE_PROJECT_NAME intentionally not set here - uses value from .env
  # to ensure consistency between docker compose build and make up (which sources .env)
  ENV: development
  # Use CI-specific compose file (no lockfile bind mounts)
  COMPOSE_FILE: compose.yaml:compose.ci.yaml

jobs:
  # ============================================================================
  # CHANGE DETECTION (path-based job gating)
  # ============================================================================
  # Mirrors docker/hooks/change-detector.sh: only run the jobs a change needs.
  # A change to .github/ (ci) forces every downstream job to run.
  # ============================================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      php: ${{ steps.filter.outputs.php }}
      node: ${{ steps.filter.outputs.node }}
      infra: ${{ steps.filter.outputs.infra }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Filter changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            php:
              - '**/*.php'
              - 'composer.json'
              - 'composer.lock'
              - 'phpstan*.neon'
              - 'phpunit.xml*'
              - 'phpdoc.xml'
              - 'phpmd.xml*'
              - 'rector.php'
              - '.php-cs-fixer*.php'
            node:
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.js'
              - '**/*.cjs'
              - '**/*.md'
              - 'resources/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - 'eslint.config.*'
              - '.prettier*'
              - '.markdownlint*'
              - 'vitest.config.*'
            infra:
              - '**/Dockerfile*'
              - 'docker/**'
              - 'compose*.yaml'
              - 'compose*.yml'
              - 'Makefile'
              - '**/*.sh'
              - 'tests/**'
              - 'goss*.yaml'
            ci:
              - '.github/workflows/**'
              - '.github/actions/**'

  # ============================================================================
  # BUILD & CACHE IMAGES
  # ============================================================================
  # Build the PHP and Node dev images once and export their layers to the
  # BuildKit `gha` cache (mode=max). Downstream jobs rebuild with cache-from and
  # get a near-instant cache hit instead of recompiling PHP extensions / the Node
  # toolchain. This is the GitHub-native equivalent of the GitLab Container
  # Registry reuse in .gitlab-ci.yml (build:php/build:node -> downstream pull).
  build-images:
    name: Build & Cache Images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.php == 'true' || needs.changes.outputs.node == 'true' || needs.changes.outputs.ci == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & cache PHP dev image
        if: needs.changes.outputs.php == 'true' || needs.changes.outputs.ci == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: development
          tags: zappzarapp-php:development
          cache-from: type=gha,scope=php
          cache-to: type=gha,scope=php,mode=max
          load: false

      - name: Build & cache Node dev image
        if: needs.changes.outputs.node == 'true' || needs.changes.outputs.ci == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/node/Dockerfile
          target: development
          tags: zappzarapp-node:development
          cache-from: type=gha,scope=node
          cache-to: type=gha,scope=node,mode=max
          load: false

  # ============================================================================
  # PHP QUALITY CHECKS
  # ============================================================================
  php-quality:
    name: PHP Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, build-images]
    if: needs.changes.outputs.php == 'true' || needs.changes.outputs.ci == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Initialize environment
        run: |
          make init
          make secrets

      - name: Load PHP image from cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: development
          tags: zappzarapp-php:development
          cache-from: type=gha,scope=php
          load: true

      - name: Start PHP container
        run: |
          docker compose up -d php
          # Wait for container to be ready (entrypoint initialization)
          sleep 5

      - name: Install PHP dependencies
        run: docker compose exec -T php composer install --no-progress --no-interaction

      - name: PHP Coding Standards (PHP-CS-Fixer)
        run: docker compose exec -T php composer cs-check

      - name: PHP Static Analysis (PHPStan)
        run: docker compose exec -T php composer analyse

      - name: PHP Mess Detector (PHPMD)
        run: docker compose exec -T php composer phpmd

      - name: Rector Check (Dry-Run)
        run: docker compose exec -T php composer rector-check

      - name: Composer Validate
        run: docker compose exec -T php composer validate

      - name: Cleanup
        uses: ./.github/actions/docker-cleanup

  # ============================================================================
  # PHP TESTS
  # ============================================================================
  php-tests:
    name: PHP Tests (PHPUnit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, build-images]
    if: needs.changes.outputs.php == 'true' || needs.changes.outputs.ci == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Initialize environment
        run: |
          make init
          make secrets
          make ssl-internal

      - name: Load PHP image from cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: development
          tags: zappzarapp-php:development
          cache-from: type=gha,scope=php
          load: true

      - name: Start services (PHP + Database)
        run: |
          docker compose --profile postgres up -d php postgres
          # Wait for container to be ready (entrypoint initialization)
          sleep 5
          docker compose exec -T php composer install --no-progress --no-interaction

      - name: Wait for database
        run: |
          timeout 30 sh -c 'until docker compose exec -T postgres pg_isready -U app; do sleep 1; done'

      - name: Run PHPUnit tests with coverage
        run: |
          docker compose exec -T php sh -c 'XDEBUG_MODE=coverage vendor/bin/phpunit --coverage-clover build/coverage/php/clover.xml'

      - name: Enforce coverage threshold
        run: make coverage-check-php

      - name: Upload clover report (coverage diagnostics)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: php-clover
          path: build/coverage/php/clover.xml
          retention-days: 7

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/coverage/php/clover.xml
          flags: php
          name: php-coverage
          fail_ci_if_error: false

      - name: Cleanup
        uses: ./.github/actions/docker-cleanup

  # ============================================================================
  # NODE.JS QUALITY CHECKS
  # ============================================================================
  node-quality:
    name: Node.js Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, build-images]
    if: needs.changes.outputs.node == 'true' || needs.changes.outputs.ci == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Initialize environment
        run: |
          make init
          make secrets
          make ssl-internal

      - name: Load Node image from cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/node/Dockerfile
          target: development
          tags: zappzarapp-node:development
          cache-from: type=gha,scope=node
          load: true

      - name: Start Node container
        run: |
          # Create lockfile for bind mount (compose.ci.yaml)
          [ -f pnpm-lock.yaml ] || touch pnpm-lock.yaml
          docker compose up -d node
          # Wait for container to be ready (entrypoint initialization)
          sleep 5

      - name: Install Node dependencies
        run: docker compose exec -T node pnpm install

      - name: TypeScript Type Check
        run: docker compose exec -T node pnpm run type-check

      - name: ESLint
        run: docker compose exec -T node pnpm run lint

      - name: Prettier Check
        run: docker compose exec -T node pnpm run format:check

      - name: Validate package.json
        run: docker compose exec -T node pnpm run quality

      - name: Markdownlint
        run: docker compose exec -T node pnpm run lint:md

      - name: Cleanup
        uses: ./.github/actions/docker-cleanup

  # ============================================================================
  # NODE.JS TESTS
  # ============================================================================
  node-tests:
    name: Node.js Tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, build-images]
    if: needs.changes.outputs.node == 'true' || needs.changes.outputs.ci == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Initialize environment
        run: |
          make init
          make secrets
          make ssl-internal

      - name: Load Node image from cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/node/Dockerfile
          target: development
          tags: zappzarapp-node:development
          cache-from: type=gha,scope=node
          load: true

      - name: Start services (Node + Redis)
        run: |
          # Create lockfile for bind mount (compose.ci.yaml)
          [ -f pnpm-lock.yaml ] || touch pnpm-lock.yaml
          docker compose --profile redis up -d node redis
          # Wait for container to be ready (entrypoint initialization)
          sleep 5
          docker compose exec -T node pnpm install

      - name: Wait for Redis
        run: |
          timeout 30 sh -c 'until docker compose exec -T redis redis-cli --tls --insecure ping; do sleep 1; done'

      - name: Run Vitest tests
        run: docker compose exec -T node pnpm test

      - name: Generate coverage report
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: docker compose exec -T node pnpm test:coverage

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/coverage/lcov.info
          flags: node
          name: node-coverage
          fail_ci_if_error: false

      - name: Cleanup
        uses: ./.github/actions/docker-cleanup

  # ============================================================================
  # DEPENDENCY AUDIT
  # ============================================================================
  # Note: Comprehensive security scans (Trivy, secrets, filesystem) run in
  # .github/workflows/security-scan.yml on a weekly schedule.
  # ============================================================================
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, build-images]
    if: needs.changes.outputs.php == 'true' || needs.changes.outputs.node == 'true' || needs.changes.outputs.ci == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Initialize environment
        run: |
          make init
          make secrets
          make ssl-internal

      - name: Load PHP image from cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: development
          tags: zappzarapp-php:development
          cache-from: type=gha,scope=php
          load: true

      - name: Load Node image from cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/node/Dockerfile
          target: development
          tags: zappzarapp-node:development
          cache-from: type=gha,scope=node
          load: true

      - name: Start containers
        run: |
          # Create lockfile for bind mount (compose.ci.yaml)
          [ -f pnpm-lock.yaml ] || touch pnpm-lock.yaml
          docker compose up -d php node
          # Wait for containers to be ready (entrypoint initialization)
          sleep 5

      - name: Install dependencies
        run: |
          docker compose exec -T php composer install --no-progress --no-interaction
          docker compose exec -T node pnpm install
          # Wait for pnpm to fully release lockfiles before audit
          sleep 3

      - name: PHP Composer Audit
        run: docker compose exec -T php composer audit

      - name: Node pnpm Audit
        run: docker compose exec -T node pnpm audit

      - name: Cleanup
        uses: ./.github/actions/docker-cleanup

  # ============================================================================
  # SAST ANALYSIS (Semgrep)
  # ============================================================================
  sast-scan:
    name: SAST Analysis (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.php == 'true' || needs.changes.outputs.node == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Semgrep
        run: pip install semgrep==1.172.0

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/secrets \
            --config p/php \
            --config p/typescript \
            --sarif \
            --output semgrep.sarif \
            --error \
            .
        continue-on-error: true

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v4
        # Code scanning (SARIF upload) requires a public repo or GitHub Advanced
        # Security; skip on private forks so they do not fail the job.
        if: always() && github.event.repository.visibility == 'public'
        with:
          sarif_file: semgrep.sarif

  # ============================================================================
  # BATS TESTS (Makefile Validation)
  # ============================================================================
  bats-quick:
    name: BATS Quick Tests (Dry-Run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: needs.changes.outputs.infra == 'true' || needs.changes.outputs.ci == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Initialize environment
        run: |
          make init
          make secrets
          make ssl-internal

      - name: Build BATS container
        run: make bats-build

      - name: Run BATS dry-run tests
        run: make bats-test

      - name: Cleanup
        uses: ./.github/actions/docker-cleanup

  bats-integration:
    name: BATS Integration Tests
    runs-on: ubuntu-latest
    # Runs the full make-target suite incl. PHPUnit twice (test + check);
    # was at ~28 min with a 30-min timeout — headroom for suite growth
    timeout-minutes: 45
    needs: [changes, bats-quick]
    if: >-
      (needs.changes.outputs.infra == 'true' || needs.changes.outputs.ci == 'true') &&
      (github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')))

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build goss utility image (dependency)
        run: docker build -t zappzarapp-goss:latest -f docker/goss/Dockerfile .

      - name: Initialize environment
        run: |
          make init
          make secrets
          make ssl-internal

      - name: Build BATS container
        run: make bats-build

      - name: Build application containers
        run: |
          # Create empty lockfiles (Dockerfile COPY needs them)
          [ -f composer.lock ] || echo '{}' > composer.lock
          [ -f pnpm-lock.yaml ] || touch pnpm-lock.yaml
          # Create dependency directories (compose.ci.yaml uses bind mounts for BATS tests)
          mkdir -p vendor node_modules src/node/backend/node_modules src/node/frontend/node_modules backups/db docs/api/php docs/api/node-backend docs/api/node-frontend tools public/build
          # Make directories writable by container users (node=1000, www-data=82)
          # This is required because bind mounts preserve host permissions
          # Include parent directories (public, not just public/build) for mkdir operations
          # Also include vendor and node_modules so BATS tests can rm -rf them and
          # containers can recreate them (cross-UID ownership requires 777)
          chmod -R 777 vendor node_modules tools docs public
          # IMPORTANT: Use DOCKER_BUILDKIT=0 for all builds to ensure images are
          # available to local Docker daemon (setup-buildx-action creates a builder
          # that stores images in BuildKit cache, not local Docker)
          # Build node-backend first for nginx COPY --from dependency
          # Note: Uses COMPOSE_PROJECT_NAME=zappzarapp from .env
          DOCKER_BUILDKIT=0 docker compose --profile node-backend build node-backend || true
          docker tag zappzarapp-node-backend:api zappzarapp-node-backend:latest 2>/dev/null || true
          # Build all remaining images (nginx needs NGINX_TARGET=development for :development tag)
          # Include postgres for make up image check, dev-tools for Node linting/testing
          DOCKER_BUILDKIT=0 NGINX_TARGET=development docker compose --profile postgres build php node nginx postgres dev-tools

      - name: Start containers
        run: make up

      - name: Install dependencies
        run: |
          make composer-install
          make pnpm-install

      - name: Wait for healthy containers
        run: |
          timeout 120 sh -c 'until make check-health 2>/dev/null; do sleep 5; done'

      - name: Run BATS integration tests
        run: make bats-test-integration

      - name: Cleanup
        if: always()
        run: make down || true

      - name: Docker cleanup
        if: always()
        uses: ./.github/actions/docker-cleanup

  # ============================================================================
  # BUILD TEST (Production)
  # ============================================================================
  build-production:
    name: Production Build Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop') &&
      (needs.changes.outputs.php == 'true' || needs.changes.outputs.node == 'true' || needs.changes.outputs.infra == 'true' || needs.changes.outputs.ci == 'true')

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build goss utility image (dependency)
        run: |
          DOCKER_BUILDKIT=0 docker build -t zappzarapp-goss:latest -f docker/goss/Dockerfile .

      - name: Initialize environment
        run: |
          make init
          make secrets
          make ssl-internal

      - name: Verify CORS Configuration (Security)
        run: |
          if [ -f .env.production ] && grep -q "^CORS_ORIGINS=\*" .env.production; then
            echo "❌ CRITICAL: CORS_ORIGINS=* found in .env.production"
            echo "This is a severe security risk in production."
            echo "Set specific allowed origins instead of wildcard."
            exit 1
          fi
          echo "✓ CORS configuration validated"

      - name: Build production images
        run: |
          # Create empty lockfiles for production build (Dockerfile COPY needs them)
          [ -f composer.lock ] || echo '{}' > composer.lock
          [ -f pnpm-lock.yaml ] || touch pnpm-lock.yaml

          # Build node-backend first, then tag for cross-image COPY compatibility
          # BuildKit in compose build can't see external local images, so we build
          # node-backend separately and tag it, then build php/nginx with DOCKER_BUILDKIT=0
          # Note: Uses COMPOSE_PROJECT_NAME=zappzarapp from .env
          docker compose -f compose.yaml -f compose.production.yaml --profile node-backend build node-backend
          docker tag zappzarapp-node-backend:api zappzarapp-node-backend:latest
          # Disable BuildKit for php/nginx build so they can see the local tagged image
          DOCKER_BUILDKIT=0 ENV=production docker compose -f compose.yaml -f compose.production.yaml --profile php --profile postgres build php nginx postgres

      - name: Test production build
        run: |
          # Use ENV-aware production test (respects .env configuration)
          # Tests nginx + app (php/node) + database + activated services
          ENV=production make test-production

      - name: Show container status
        if: always()
        run: |
          docker compose ps
          docker compose logs --tail=100

      - name: Cleanup
        if: always()
        uses: ./.github/actions/docker-cleanup

  # ============================================================================
  # KUBERNETES DEPLOYMENT (Optional)
  # ============================================================================
  # Uncomment to enable automatic deployment to Kubernetes.
  #
  # Required Secrets (Settings > Secrets and variables > Actions):
  #   KUBECONFIG_DATA:  Base64-encoded kubeconfig file
  #   KUBE_NAMESPACE:   Target namespace (default: zappzarapp)
  #
  # See: .zappzarapp/docs/infrastructure/KUBERNETES.md
  #
  # deploy-kubernetes:
  #   name: Deploy to Kubernetes
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 10
  #   needs: build-production
  #   if: github.ref == 'refs/heads/master'
  #   environment:
  #     name: production
  #     url: https://${{ vars.DOMAIN }}
  #
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v7
  #
  #     - name: Setup kubectl
  #       uses: azure/setup-kubectl@v5
  #
  #     - name: Setup Helm
  #       uses: azure/setup-helm@v5
  #
  #     - name: Configure kubeconfig
  #       run: |
  #         mkdir -p ~/.kube
  #         echo "${{ secrets.KUBECONFIG_DATA }}" | base64 -d > ~/.kube/config
  #
  #     - name: Deploy to Kubernetes
  #       run: |
  #         helm upgrade --install zappzarapp ./kubernetes \
  #           --namespace ${{ vars.KUBE_NAMESPACE || 'zappzarapp' }} \
  #           --create-namespace \
  #           -f kubernetes/values.production.yaml
  #         kubectl get pods -n ${{ vars.KUBE_NAMESPACE || 'zappzarapp' }}

  # ============================================================================
  # CI SUMMARY
  # ============================================================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [changes, build-images, php-quality, php-tests, node-quality, node-tests, dependency-audit, sast-scan, bats-quick, bats-integration, build-production]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "# CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Detect Changes | ${{ needs.changes.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Cache Images | ${{ needs.build-images.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| PHP Quality | ${{ needs.php-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| PHP Tests | ${{ needs.php-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Node.js Quality | ${{ needs.node-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Node.js Tests | ${{ needs.node-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Audit | ${{ needs.dependency-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SAST (Semgrep) | ${{ needs.sast-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| BATS Quick | ${{ needs.bats-quick.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| BATS Integration | ${{ needs.bats-integration.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Production Build | ${{ needs.build-production.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Check for failures
        if: contains(needs.*.result, 'failure')
        run: |
          echo "One or more CI jobs failed. See summary above for details."
          exit 1