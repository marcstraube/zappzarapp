name: CI/CD Pipeline

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

env:
  COMPOSE_PROJECT_NAME: zappzarapp-ci
  ENV: development
  # Use CI-specific compose file (no lockfile bind mounts)
  COMPOSE_FILE: compose.yaml:compose.ci.yaml

jobs:
  # ============================================================================
  # PHP QUALITY CHECKS
  # ============================================================================
  php-quality:
    name: PHP Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build goss utility image (dependency)
        run: docker build -t zappzarapp-goss:latest -f docker/goss/Dockerfile .

      - name: Initialize environment
        run: |
          make init
          make secrets

      - name: Build PHP container
        run: |
          docker compose build php
          docker compose up -d php
          # Wait for container to be ready (entrypoint initialization)
          sleep 5

      - name: Install PHP dependencies
        run: docker compose exec -T php composer install --no-progress --no-interaction

      - name: PHP Coding Standards (PHP-CS-Fixer)
        run: docker compose exec -T php composer cs-check

      - name: PHP Static Analysis (PHPStan)
        run: docker compose exec -T php composer analyse

      - name: PHP Mess Detector (PHPMD)
        run: docker compose exec -T php composer phpmd

      - name: Rector Check (Dry-Run)
        run: docker compose exec -T php composer rector-check

      - name: Composer Validate
        run: docker compose exec -T php composer validate

      - name: Cleanup
        uses: ./.github/actions/docker-cleanup

  # ============================================================================
  # PHP TESTS
  # ============================================================================
  php-tests:
    name: PHP Tests (PHPUnit)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build goss utility image (dependency)
        run: docker build -t zappzarapp-goss:latest -f docker/goss/Dockerfile .

      - name: Initialize environment
        run: |
          make init
          make secrets
          make ssl-selfsigned

      - name: Start services (PHP + Database)
        run: |
          docker compose --profile postgres up -d php postgres
          # Wait for container to be ready (entrypoint initialization)
          sleep 5
          docker compose exec -T php composer install --no-progress --no-interaction

      - name: Wait for database
        run: |
          timeout 30 sh -c 'until docker compose exec -T postgres pg_isready -U app; do sleep 1; done'

      - name: Run PHPUnit tests
        run: docker compose exec -T php composer test

      - name: Generate coverage report
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          docker compose exec -T php sh -c 'XDEBUG_MODE=coverage vendor/bin/phpunit --coverage-html build/coverage --coverage-clover build/coverage/clover.xml'

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: codecov/codecov-action@v4
        with:
          files: ./build/coverage/clover.xml
          flags: php
          name: php-coverage

      - name: Cleanup
        uses: ./.github/actions/docker-cleanup

  # ============================================================================
  # NODE.JS QUALITY CHECKS
  # ============================================================================
  node-quality:
    name: Node.js Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build goss utility image (dependency)
        run: docker build -t zappzarapp-goss:latest -f docker/goss/Dockerfile .

      - name: Initialize environment
        run: |
          make init
          make secrets
          make ssl-selfsigned

      - name: Build Node container
        run: |
          docker compose build node
          docker compose up -d node
          # Wait for container to be ready (entrypoint initialization)
          sleep 5

      - name: Install Node dependencies
        run: docker compose exec -T node pnpm install

      - name: TypeScript Type Check
        run: docker compose exec -T node pnpm run type-check

      - name: ESLint
        run: docker compose exec -T node pnpm run lint

      - name: Prettier Check
        run: docker compose exec -T node pnpm run format:check

      - name: Validate package.json
        run: docker compose exec -T node pnpm run quality

      - name: Markdownlint
        run: docker compose exec -T node pnpm run lint:md

      - name: Cleanup
        uses: ./.github/actions/docker-cleanup

  # ============================================================================
  # NODE.JS TESTS
  # ============================================================================
  node-tests:
    name: Node.js Tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build goss utility image (dependency)
        run: docker build -t zappzarapp-goss:latest -f docker/goss/Dockerfile .

      - name: Initialize environment
        run: |
          make init
          make secrets
          make ssl-selfsigned

      - name: Start services (Node + Redis)
        run: |
          docker compose --profile redis up -d node redis
          # Wait for container to be ready (entrypoint initialization)
          sleep 5
          docker compose exec -T node pnpm install

      - name: Wait for Redis
        run: |
          timeout 30 sh -c 'until docker compose exec -T redis redis-cli --tls --insecure ping; do sleep 1; done'

      - name: Run Vitest tests
        run: docker compose exec -T node pnpm test

      - name: Generate coverage report
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: docker compose exec -T node pnpm test:coverage

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: codecov/codecov-action@v4
        with:
          files: ./build/coverage/lcov.info
          flags: node
          name: node-coverage

      - name: Cleanup
        uses: ./.github/actions/docker-cleanup

  # ============================================================================
  # DEPENDENCY AUDIT
  # ============================================================================
  # Note: Comprehensive security scans (Trivy, secrets, filesystem) run in
  # .github/workflows/security-scan.yml on a weekly schedule.
  # ============================================================================
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build goss utility image (dependency)
        run: docker build -t zappzarapp-goss:latest -f docker/goss/Dockerfile .

      - name: Initialize environment
        run: |
          make init
          make secrets
          make ssl-selfsigned

      - name: Build containers
        run: |
          docker compose build php node
          docker compose up -d php node
          # Wait for containers to be ready (entrypoint initialization)
          sleep 5

      - name: Install dependencies
        run: |
          docker compose exec -T php composer install --no-progress --no-interaction
          docker compose exec -T node pnpm install
          # Wait for pnpm to fully release lockfiles before audit
          sleep 3

      - name: PHP Composer Audit
        run: docker compose exec -T php composer audit

      - name: Node pnpm Audit
        run: docker compose exec -T node pnpm audit

      - name: Cleanup
        uses: ./.github/actions/docker-cleanup

  # ============================================================================
  # BATS TESTS (Makefile Validation)
  # ============================================================================
  bats-quick:
    name: BATS Quick Tests (Dry-Run)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build BATS container
        run: make bats-build

      - name: Run BATS dry-run tests
        run: make bats-test

      - name: Cleanup
        uses: ./.github/actions/docker-cleanup

  bats-integration:
    name: BATS Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [bats-quick]
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build goss utility image (dependency)
        run: docker build -t zappzarapp-goss:latest -f docker/goss/Dockerfile .

      - name: Initialize environment
        run: |
          make init
          make secrets
          make ssl-selfsigned

      - name: Build BATS container
        run: make bats-build

      - name: Build application containers
        run: |
          # Create empty lockfiles (Dockerfile COPY needs them)
          [ -f composer.lock ] || echo '{}' > composer.lock
          [ -f pnpm-lock.yaml ] || touch pnpm-lock.yaml
          # IMPORTANT: Use DOCKER_BUILDKIT=0 for all builds to ensure images are
          # available to local Docker daemon (setup-buildx-action creates a builder
          # that stores images in BuildKit cache, not local Docker)
          # Build node-backend first for nginx COPY --from dependency
          DOCKER_BUILDKIT=0 docker compose --profile node-backend build node-backend || true
          docker tag ${COMPOSE_PROJECT_NAME}-node-backend:api zappzarapp-node-backend:latest 2>/dev/null || true
          # Build all remaining images
          DOCKER_BUILDKIT=0 docker compose build php node nginx

      - name: Start containers
        run: make up

      - name: Install dependencies
        run: |
          make composer-install
          make pnpm-install

      - name: Wait for healthy containers
        run: |
          timeout 120 sh -c 'until make check-health 2>/dev/null; do sleep 5; done'

      - name: Run BATS integration tests
        run: make bats-test-integration

      - name: Cleanup
        if: always()
        run: make down || true

      - name: Docker cleanup
        if: always()
        uses: ./.github/actions/docker-cleanup

  # ============================================================================
  # BUILD TEST (Production)
  # ============================================================================
  build-production:
    name: Production Build Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build goss utility image (dependency)
        run: docker build -t zappzarapp-goss:latest -f docker/goss/Dockerfile .

      - name: Initialize environment
        run: |
          make init
          make secrets
          make ssl-selfsigned

      - name: Build production images
        run: |
          # Create empty lockfiles for production build (Dockerfile COPY needs them)
          [ -f composer.lock ] || echo '{}' > composer.lock
          [ -f pnpm-lock.yaml ] || touch pnpm-lock.yaml

          # Build node-backend first, then tag for cross-image COPY compatibility
          # BuildKit in compose build can't see external local images, so we build
          # node-backend separately and tag it, then build php/nginx with DOCKER_BUILDKIT=0
          docker compose -f compose.yaml -f compose.production.yaml --profile node-backend build node-backend
          docker tag zappzarapp-ci-node-backend:api zappzarapp-node-backend:latest
          # Disable BuildKit for php/nginx build so they can see the local tagged image
          DOCKER_BUILDKIT=0 ENV=production docker compose -f compose.yaml -f compose.production.yaml build php nginx

      - name: Test production startup
        run: |
          ENV=production docker compose -f compose.yaml -f compose.production.yaml up -d
          sleep 10
          docker compose ps
          docker compose logs

      - name: Health check
        run: |
          curl -f http://localhost:8080/health || exit 1

      - name: Cleanup
        uses: ./.github/actions/docker-cleanup

  # ============================================================================
  # KUBERNETES DEPLOYMENT (Optional)
  # ============================================================================
