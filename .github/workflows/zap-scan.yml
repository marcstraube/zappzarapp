name: OWASP ZAP Scan

on:
  push:
    branches: [develop]
  schedule:
    # Weekly on Sunday at 3 AM (after security-scan at 2 AM)
    - cron: '0 3 * * 0'
  workflow_dispatch:

env:
  COMPOSE_PROJECT_NAME: zappzarapp-zap
  # Use CI-specific compose file (no lockfile bind mounts)
  COMPOSE_FILE: compose.yaml:compose.ci.yaml

permissions:
  contents: read
  issues: write

jobs:
  # ============================================================================
  # ZAP BASELINE SCAN
  # ============================================================================
  zap-baseline:
    name: ZAP Baseline Scan
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build goss utility image (dependency)
        run: |
          DOCKER_BUILDKIT=0 docker build -t zappzarapp-goss:latest -f docker/goss/Dockerfile .

      - name: Initialize environment
        run: |
          make init
          make secrets
          make ssl-internal

      - name: Build application images
        run: |
          # Create empty lockfiles for Dockerfile COPY
          [ -f composer.lock ] || echo '{}' > composer.lock
          [ -f pnpm-lock.yaml ] || touch pnpm-lock.yaml

          # Build node-backend first for nginx COPY --from dependency
          DOCKER_BUILDKIT=0 docker compose --profile node-backend build node-backend || true
          docker tag ${{ env.COMPOSE_PROJECT_NAME }}-node-backend:api ${{ env.COMPOSE_PROJECT_NAME }}-node-backend:latest 2>/dev/null || true

          # Build remaining images
          DOCKER_BUILDKIT=0 docker compose --profile postgres build php node nginx postgres

      - name: Start application
        run: |
          docker compose --profile postgres up -d php node nginx postgres
          sleep 10

      - name: Install dependencies
        run: |
          docker compose exec -T php composer install --no-progress --no-interaction
          docker compose exec -T node pnpm install

      - name: Wait for application to be healthy
        run: |
          echo "Waiting for application health check..."
          timeout 120 sh -c '
            until curl -sf http://localhost:8080/health > /dev/null 2>&1; do
              echo "Waiting for http://localhost:8080/health..."
              sleep 5
            done
          '
          echo "Application is healthy"

      - name: Create ZAP rules directory
        run: mkdir -p .zap

      - name: Run ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:8080'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j'
          allow_issue_writing: false

      - name: Upload ZAP HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report-html
          path: report_html.html
          retention-days: 30

      - name: Upload ZAP JSON report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report-json
          path: report_json.json
          retention-days: 30

      - name: Generate summary
        if: always()
        run: |
          echo "# OWASP ZAP Baseline Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Target: http://localhost:8080" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See artifacts for detailed HTML and JSON reports." >> $GITHUB_STEP_SUMMARY

      - name: Cleanup
        if: always()
        run: docker compose down -v || true
