name: Security Scan

on:
  # Run on schedule (weekly on Sunday at 2 AM)
  schedule:
    - cron: '0 2 * * 0'
  # Manual trigger
  workflow_dispatch:
    inputs:
      severity:
        description: 'Minimum severity to report'
        required: false
        default: 'HIGH,CRITICAL'
        type: choice
        options:
          - CRITICAL
          - HIGH,CRITICAL
          - MEDIUM,HIGH,CRITICAL
          - LOW,MEDIUM,HIGH,CRITICAL
  # Optional: Run on push to security-related files
  push:
    branches: [master, develop]
    paths:
      - 'docker/**'
      - 'compose*.yaml'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'pnpm-lock.yaml'
      # Env templates (secret scanning) and the scan config / baselines itself,
      # so changing a baseline or the workflow re-runs the scan (otherwise the
      # new config never gets exercised on push).
      - '.env'
      - '.env.*.example'
      - '.trivy/**'
      - '.dockleignore'
      - '.github/workflows/security-scan.yml'

env:
  COMPOSE_PROJECT_NAME: zappzarapp-security
  SEVERITY: ${{ inputs.severity || 'HIGH,CRITICAL' }}
  # Dockle rule-level ignores (CIS-DI-0001, DKL-DI-0004, CIS-DI-0010) live in
  # .dockleignore. Upstream-only container CVEs are filtered by package in
  # .trivy/ignore-policy.rego (see docs/security/KNOWN-VULNERABILITIES.md).

permissions:
  contents: read
  security-events: write

jobs:
  # ============================================================================
  # DOCKER IMAGE VULNERABILITY SCAN
  # ============================================================================
  image-scan:
    name: Docker Image Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        image:
          - name: php
            dockerfile: docker/php/Dockerfile
            target: development
          - name: node
            dockerfile: docker/node/Dockerfile
            target: development
          - name: nginx
            dockerfile: docker/nginx/Dockerfile
            target: development
          - name: postgres
            dockerfile: docker/postgres/Dockerfile
            target: final
          - name: mariadb
            dockerfile: docker/mariadb/Dockerfile
            target: ""
          - name: redis
            dockerfile: docker/redis/Dockerfile
            target: base
          # Optional services
          - name: elasticsearch
            dockerfile: docker/elasticsearch/Dockerfile
            target: ""
          - name: meilisearch
            dockerfile: docker/meilisearch/Dockerfile
            target: ""
          - name: rabbitmq
            dockerfile: docker/rabbitmq/Dockerfile
            target: ""
          - name: mercure
            dockerfile: docker/mercure/Dockerfile
            target: ""
          - name: mailpit
            dockerfile: docker/mailpit/Dockerfile
            target: ""
          - name: seaweedfs
            dockerfile: docker/seaweedfs/Dockerfile
            target: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build goss utility image (dependency)
        run: |
          # Build without BuildKit so image is available to local Docker daemon
          DOCKER_BUILDKIT=0 docker build -t zappzarapp-goss:latest -f docker/goss/Dockerfile .

      - name: Build ${{ matrix.image.name }} image
        run: |
          # Disable BuildKit for images that use COPY --from local images (node, php, nginx)
          # Target specific stage to avoid GOSS validation (which requires runtime dependencies)
          # Security scan focuses on base image vulnerabilities, not runtime config
          TARGET_ARG=""
          if [ -n "${{ matrix.image.target }}" ]; then
            TARGET_ARG="--target ${{ matrix.image.target }}"
          fi
          DOCKER_BUILDKIT=0 docker build -t ${{ env.COMPOSE_PROJECT_NAME }}-${{ matrix.image.name }}:scan \
            $TARGET_ARG \
            -f ${{ matrix.image.dockerfile }} \
            .

      - name: Trivy vulnerability scan (${{ matrix.image.name }})
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.COMPOSE_PROJECT_NAME }}-${{ matrix.image.name }}:scan
          format: sarif
          output: trivy-${{ matrix.image.name }}-results.sarif
          severity: ${{ env.SEVERITY }}
          ignore-unfixed: true
          # Package-level filter for upstream-only components we cannot patch
          # (bundled binaries/JARs/runtime). Stable across DB + rebuild churn,
          # unlike a CVE-ID .trivyignore. See .trivy/ignore-policy.rego.
          ignore-policy: .trivy/ignore-policy.rego

      - name: Upload Trivy results (${{ matrix.image.name }})
        uses: github/codeql-action/upload-sarif@v4
        # Code scanning (SARIF upload) requires a public repo or GitHub Advanced
        # Security; skip on private forks so they do not fail the job.
        if: always() && github.event.repository.visibility == 'public'
        with:
          sarif_file: trivy-${{ matrix.image.name }}-results.sarif
          category: trivy-${{ matrix.image.name }}

      - name: Trivy table output (${{ matrix.image.name }})
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.COMPOSE_PROJECT_NAME }}-${{ matrix.image.name }}:scan
          format: table
          severity: ${{ env.SEVERITY }}
          ignore-unfixed: true

  # ============================================================================
  # DEPENDENCY VULNERABILITY SCAN
  # ============================================================================
  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Use CI-specific compose file (no lockfile bind mounts)
      COMPOSE_FILE: compose.yaml:compose.ci.yaml

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build goss utility image (dependency)
        run: |
          DOCKER_BUILDKIT=0 docker build -t zappzarapp-goss:latest -f docker/goss/Dockerfile .

      - name: Initialize environment
        run: |
          make init
          make secrets

      - name: Build and start containers
        run: |
          # Create empty lockfiles for Dockerfile COPY
          [ -f composer.lock ] || echo '{}' > composer.lock
          [ -f pnpm-lock.yaml ] || touch pnpm-lock.yaml
          # Disable BuildKit for cross-image COPY --from compatibility
          DOCKER_BUILDKIT=0 docker compose build php node
          docker compose up -d php node
          sleep 5

      - name: Install dependencies
        run: |
          docker compose exec -T php composer install --no-progress --no-interaction
          docker compose exec -T node pnpm install

      - name: PHP Composer Audit
        run: |
          echo "## PHP Dependencies" >> $GITHUB_STEP_SUMMARY
          docker compose exec -T php composer audit --format=summary || true
          docker compose exec -T php composer audit --format=json > composer-audit.json || true

      - name: Node pnpm Audit
        run: |
          echo "## Node.js Dependencies" >> $GITHUB_STEP_SUMMARY
          docker compose exec -T node pnpm audit || true
          docker compose exec -T node pnpm audit --json > pnpm-audit.json || true

      - name: Upload audit results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-audit-results
          path: |
            composer-audit.json
            pnpm-audit.json
          retention-days: 30

      - name: Cleanup
        uses: ./.github/actions/docker-cleanup

  # ============================================================================
  # FILESYSTEM & CONFIG SCAN
  # ============================================================================
  filesystem-scan:
    name: Filesystem Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          # vuln only: this SARIF is uploaded to code scanning. Secret scanning is
          # handled by the dedicated secret-scan job + TruffleHog (which do not
          # upload SARIF), so the default vuln,secret scanners would surface the
          # dummy example tokens in the committed .env template as CRITICAL alerts.
          scanners: vuln
          format: sarif
          output: trivy-fs-results.sarif
          severity: ${{ env.SEVERITY }}
          ignore-unfixed: true
          ignore-policy: .trivy/ignore-policy.rego

      - name: Upload filesystem scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && github.event.repository.visibility == 'public'
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-filesystem

      - name: Trivy config scan (IaC)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: ${{ env.SEVERITY }}
          skip-dirs: node_modules,vendor

  # ============================================================================
  # SECRET SCANNING
  # ============================================================================
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history for secret scanning

      - name: Trivy secret scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          severity: ${{ env.SEVERITY }}

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@v3.96.0
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified

  # ============================================================================
  # DOCKLE BEST PRACTICES SCAN
  # ============================================================================
  dockle-scan:
    name: Dockle Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        image:
          - name: php
            dockerfile: docker/php/Dockerfile
            target: development
          - name: node
            dockerfile: docker/node/Dockerfile
            target: development
          - name: nginx
            dockerfile: docker/nginx/Dockerfile
            target: development
          - name: postgres
            dockerfile: docker/postgres/Dockerfile
            target: final
          - name: mariadb
            dockerfile: docker/mariadb/Dockerfile
            target: ""
          - name: redis
            dockerfile: docker/redis/Dockerfile
            target: base
          - name: elasticsearch
            dockerfile: docker/elasticsearch/Dockerfile
            target: ""
          - name: meilisearch
            dockerfile: docker/meilisearch/Dockerfile
            target: ""
          - name: rabbitmq
            dockerfile: docker/rabbitmq/Dockerfile
            target: ""
          - name: mercure
            dockerfile: docker/mercure/Dockerfile
            target: ""
          - name: mailpit
            dockerfile: docker/mailpit/Dockerfile
            target: ""
          - name: seaweedfs
            dockerfile: docker/seaweedfs/Dockerfile
            target: ""
          # Note: bats and goss excluded - build/test utilities only, never deployed

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build goss utility image (dependency)
        if: matrix.image.name != 'goss'
        run: |
          DOCKER_BUILDKIT=0 docker build -t zappzarapp-goss:latest -f docker/goss/Dockerfile .

      - name: Build ${{ matrix.image.name }} image
        run: |
          TARGET_ARG=""
          if [ -n "${{ matrix.image.target }}" ]; then
            TARGET_ARG="--target ${{ matrix.image.target }}"
          fi
          DOCKER_BUILDKIT=0 docker build -t ${{ env.COMPOSE_PROJECT_NAME }}-${{ matrix.image.name }}:scan \
            $TARGET_ARG \
            -f ${{ matrix.image.dockerfile }} \
            .

      - name: Run Dockle scan (${{ matrix.image.name }})
        uses: goodwithtech/dockle-action@v0.4.15
        with:
          image: ${{ env.COMPOSE_PROJECT_NAME }}-${{ matrix.image.name }}:scan
          format: sarif
          output: dockle-${{ matrix.image.name }}-results.sarif
          exit-code: '0'

      - name: Upload Dockle results (${{ matrix.image.name }})
        uses: github/codeql-action/upload-sarif@v4
        if: always() && github.event.repository.visibility == 'public'
        with:
          sarif_file: dockle-${{ matrix.image.name }}-results.sarif
          category: dockle-${{ matrix.image.name }}

  # ============================================================================
  # LICENSE SCAN
  # ============================================================================
  license-scan:
    name: License Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Trivy license scan (PHP)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: license
          format: json
          output: trivy-license-results.json

      - name: Generate license summary
        run: |
          echo "## License Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f trivy-license-results.json ]; then
            echo "License scan completed. See artifact for details." >> $GITHUB_STEP_SUMMARY
          else
            echo "No license issues found." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload license results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: license-scan-results
          path: trivy-license-results.json
          retention-days: 30

  # ============================================================================
  # SUMMARY
  # ============================================================================
  summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [image-scan, dependency-scan, filesystem-scan, secret-scan, dockle-scan, license-scan]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "# Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scan Type | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Images (Trivy) | ${{ needs.image-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Best Practices (Dockle) | ${{ needs.dockle-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependencies | ${{ needs.dependency-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Filesystem | ${{ needs.filesystem-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secrets | ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Licenses | ${{ needs.license-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Severity threshold: ${{ env.SEVERITY }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View detailed results in the Security tab." >> $GITHUB_STEP_SUMMARY
