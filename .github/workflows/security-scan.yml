name: Security Scan

on:
  # Run on schedule (weekly on Sunday at 2 AM)
  schedule:
    - cron: '0 2 * * 0'
  # Manual trigger
  workflow_dispatch:
    inputs:
      severity:
        description: 'Minimum severity to report'
        required: false
        default: 'HIGH,CRITICAL'
        type: choice
        options:
          - CRITICAL
          - HIGH,CRITICAL
          - MEDIUM,HIGH,CRITICAL
          - LOW,MEDIUM,HIGH,CRITICAL
  # Optional: Run on push to security-related files
  push:
    branches: [master, main, develop]
    paths:
      - 'docker/**'
      - 'compose*.yaml'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'pnpm-lock.yaml'
      # Carries the overrides + supply-chain policy (minimumReleaseAge etc.)
      # that the dependency scan resolves against.
      - 'pnpm-workspace.yaml'
      # Env templates (secret scanning) and the scan config / baselines itself,
      # so changing a baseline or the workflow re-runs the scan (otherwise the
      # new config never gets exercised on push).
      - '.env'
      - '.env.*.example'
      - '.trivy/**'
      - '.dockleignore'
      - '.github/workflows/security-scan.yml'

env:
  COMPOSE_PROJECT_NAME: zappzarapp-security
  SEVERITY: ${{ inputs.severity || 'HIGH,CRITICAL' }}
  # Dockle is installed from the GitHub release tarball; the dockle-action
  # container would pull goodwithtech/dockle from Docker Hub at job time,
  # which repeatedly failed with i/o timeouts. Tracked by a Renovate
  # customManager (renovate.json), like TRIVY_VERSION in the GitLab pipeline.
  DOCKLE_VERSION: "0.4.15"
  # sha256 of dockle_<version>_Linux-64bit.tar.gz from the release's
  # dockle_<version>_checksums.txt - bump together with DOCKLE_VERSION
  DOCKLE_SHA256: "8bfc9183d1d3d67800edb45bea4bb63ddf1d28bec5f89944075a07007d79caad"
  # Dockle rule-level ignores (CIS-DI-0001, DKL-DI-0004, CIS-DI-0010) live in
  # .dockleignore. Upstream-only container CVEs are filtered by package in
  # .trivy/ignore-policy.rego (see docs/security/KNOWN-VULNERABILITIES.md).

permissions:
  contents: read
  security-events: write

jobs:
  # ============================================================================
  # DOCKER IMAGE VULNERABILITY SCAN
  # ============================================================================
  image-scan:
    name: Docker Image Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        image:
          - name: php
            dockerfile: docker/php/Dockerfile
            target: development
          - name: node
            dockerfile: docker/node/Dockerfile
            target: development
          - name: nginx
            dockerfile: docker/nginx/Dockerfile
            target: development
          - name: postgres
            dockerfile: docker/postgres/Dockerfile
            target: final
          - name: mariadb
            dockerfile: docker/mariadb/Dockerfile
            target: ""
          - name: redis
            dockerfile: docker/redis/Dockerfile
            target: base
          # Optional services
          - name: elasticsearch
            dockerfile: docker/elasticsearch/Dockerfile
            target: ""
          - name: meilisearch
            dockerfile: docker/meilisearch/Dockerfile
            target: ""
          - name: rabbitmq
            dockerfile: docker/rabbitmq/Dockerfile
            target: ""
          - name: mercure
            dockerfile: docker/mercure/Dockerfile
            target: ""
          - name: mailpit
            dockerfile: docker/mailpit/Dockerfile
            target: ""
          - name: seaweedfs
            dockerfile: docker/seaweedfs/Dockerfile
            target: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build goss utility image (dependency)
        run: |
          # --load exports the image to the local Docker daemon for the scanners.
          docker buildx build --load -t zappzarapp-goss:latest -f docker/goss/Dockerfile .

      - name: Build ${{ matrix.image.name }} image
        run: |
          # Scan only cross-image-COPY-free stages (dev/base/final/single-stage) so
          # no goss/node-backend context is needed; --load makes the :scan image
          # available to Trivy. Target a specific stage to skip GOSS validation
          # (needs runtime deps); the scan focuses on base-image vulnerabilities.
          TARGET_ARG=""
          if [ -n "${{ matrix.image.target }}" ]; then
            TARGET_ARG="--target ${{ matrix.image.target }}"
          fi
          docker buildx build --load -t ${{ env.COMPOSE_PROJECT_NAME }}-${{ matrix.image.name }}:scan \
            $TARGET_ARG \
            -f ${{ matrix.image.dockerfile }} \
            .

      - name: Trivy vulnerability scan (${{ matrix.image.name }})
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.COMPOSE_PROJECT_NAME }}-${{ matrix.image.name }}:scan
          format: sarif
          output: trivy-${{ matrix.image.name }}-results.sarif
          severity: ${{ env.SEVERITY }}
          ignore-unfixed: true
          # Package-level filter for upstream-only components we cannot patch
          # (bundled binaries/JARs/runtime). Stable across DB + rebuild churn,
          # unlike a CVE-ID .trivyignore. See .trivy/ignore-policy.rego.
          ignore-policy: .trivy/ignore-policy.rego

      - name: Upload Trivy results (${{ matrix.image.name }})
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        # Code scanning (SARIF upload) requires a public repo or GitHub Advanced
        # Security; skip on private forks so they do not fail the job.
        if: always() && github.event.repository.visibility == 'public'
        with:
          sarif_file: trivy-${{ matrix.image.name }}-results.sarif
          category: trivy-${{ matrix.image.name }}

      - name: Trivy table output (${{ matrix.image.name }})
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.COMPOSE_PROJECT_NAME }}-${{ matrix.image.name }}:scan
          format: table
          severity: ${{ env.SEVERITY }}
          ignore-unfixed: true

  # ============================================================================
  # DEPENDENCY VULNERABILITY SCAN
  # ============================================================================
  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Use CI-specific compose file (no lockfile bind mounts)
      COMPOSE_FILE: compose.yaml:compose.ci.yaml

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build goss utility image (dependency)
        run: |
          docker buildx build --load -t zappzarapp-goss:latest -f docker/goss/Dockerfile .

      - name: Initialize environment
        run: |
          make init
          make secrets

      - name: Build and start containers
        run: |
          # Create empty lockfiles for Dockerfile COPY
          [ -f composer.lock ] || echo '{}' > composer.lock
          [ -f pnpm-lock.yaml ] || touch pnpm-lock.yaml
          # php/node development stages have no cross-image COPY → plain BuildKit.
          docker compose build php node
          docker compose up -d php node
          sleep 5

      - name: Install dependencies
        run: |
          docker compose exec -T php composer install --no-progress --no-interaction
          docker compose exec -T node pnpm install

      - name: PHP Composer Audit
        run: |
          echo "## PHP Dependencies" >> $GITHUB_STEP_SUMMARY
          docker compose exec -T php composer audit --format=summary || true
          docker compose exec -T php composer audit --format=json > composer-audit.json || true

      - name: Node pnpm Audit
        run: |
          echo "## Node.js Dependencies" >> $GITHUB_STEP_SUMMARY
          docker compose exec -T node pnpm audit || true
          docker compose exec -T node pnpm audit --json > pnpm-audit.json || true

      - name: Upload audit results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dependency-audit-results
          path: |
            composer-audit.json
            pnpm-audit.json
          retention-days: 30

      - name: Cleanup
        uses: ./.github/actions/docker-cleanup

  # ============================================================================
  # FILESYSTEM & CONFIG SCAN
  # ============================================================================
  filesystem-scan:
    name: Filesystem Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          # vuln only: this SARIF is uploaded to code scanning. Secret scanning is
          # handled by the dedicated secret-scan job + TruffleHog (which do not
          # upload SARIF), so the default vuln,secret scanners would surface the
          # dummy example tokens in the committed .env template as CRITICAL alerts.
          scanners: vuln
          format: sarif
          output: trivy-fs-results.sarif
          severity: ${{ env.SEVERITY }}
          ignore-unfixed: true
          ignore-policy: .trivy/ignore-policy.rego

      - name: Upload filesystem scan results
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: always() && github.event.repository.visibility == 'public'
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-filesystem

      - name: Trivy config scan (IaC)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: ${{ env.SEVERITY }}
          skip-dirs: node_modules,vendor

  # ============================================================================
  # SECRET SCANNING
  # ============================================================================
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Full history for secret scanning

      - name: Trivy secret scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          severity: ${{ env.SEVERITY }}

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified

  # ============================================================================
  # DOCKLE BEST PRACTICES SCAN
  # ============================================================================
  dockle-scan:
    name: Dockle Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        image:
          - name: php
            dockerfile: docker/php/Dockerfile
            target: development
          - name: node
            dockerfile: docker/node/Dockerfile
            target: development
          - name: nginx
            dockerfile: docker/nginx/Dockerfile
            target: development
          - name: postgres
            dockerfile: docker/postgres/Dockerfile
            target: final
          - name: mariadb
            dockerfile: docker/mariadb/Dockerfile
            target: ""
          - name: redis
            dockerfile: docker/redis/Dockerfile
            target: base
          - name: elasticsearch
            dockerfile: docker/elasticsearch/Dockerfile
            target: ""
          - name: meilisearch
            dockerfile: docker/meilisearch/Dockerfile
            target: ""
          - name: rabbitmq
            dockerfile: docker/rabbitmq/Dockerfile
            target: ""
          - name: mercure
            dockerfile: docker/mercure/Dockerfile
            target: ""
          - name: mailpit
            dockerfile: docker/mailpit/Dockerfile
            target: ""
          - name: seaweedfs
            dockerfile: docker/seaweedfs/Dockerfile
            target: ""
          # Note: bats and goss excluded - build/test utilities only, never deployed

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build goss utility image (dependency)
        if: matrix.image.name != 'goss'
        run: |
          docker buildx build --load -t zappzarapp-goss:latest -f docker/goss/Dockerfile .

      - name: Build ${{ matrix.image.name }} image
        run: |
          TARGET_ARG=""
          if [ -n "${{ matrix.image.target }}" ]; then
            TARGET_ARG="--target ${{ matrix.image.target }}"
          fi
          docker buildx build --load -t ${{ env.COMPOSE_PROJECT_NAME }}-${{ matrix.image.name }}:scan \
            $TARGET_ARG \
            -f ${{ matrix.image.dockerfile }} \
            .

      - name: Install Dockle
        run: |
          curl -sSfL --retry 3 --retry-delay 10 \
            -o /tmp/dockle.tar.gz \
            "https://github.com/goodwithtech/dockle/releases/download/v${DOCKLE_VERSION}/dockle_${DOCKLE_VERSION}_Linux-64bit.tar.gz"
          # Integrity check: the binary is installed with sudo, so the
          # downloaded artifact must match the pinned release checksum
          echo "${DOCKLE_SHA256}  /tmp/dockle.tar.gz" | sha256sum -c -
          tar -xzf /tmp/dockle.tar.gz -C /tmp dockle
          sudo install /tmp/dockle /usr/local/bin/dockle
          dockle --version

      - name: Run Dockle scan (${{ matrix.image.name }})
        run: |
          dockle --exit-code 0 --timeout 10m -f sarif \
            -o dockle-${{ matrix.image.name }}-results.sarif \
            ${{ env.COMPOSE_PROJECT_NAME }}-${{ matrix.image.name }}:scan

      - name: Upload Dockle results (${{ matrix.image.name }})
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: always() && github.event.repository.visibility == 'public'
        with:
          sarif_file: dockle-${{ matrix.image.name }}-results.sarif
          category: dockle-${{ matrix.image.name }}

  # ============================================================================
  # LICENSE SCAN
  # ============================================================================
  license-scan:
    name: License Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trivy license scan (PHP)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: license
          format: json
          output: trivy-license-results.json

      - name: Generate license summary
        run: |
          echo "## License Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f trivy-license-results.json ]; then
            echo "License scan completed. See artifact for details." >> $GITHUB_STEP_SUMMARY
          else
            echo "No license issues found." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload license results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: license-scan-results
          path: trivy-license-results.json
          retention-days: 30

  # ============================================================================
  # SUMMARY
  # ============================================================================
  summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [image-scan, dependency-scan, filesystem-scan, secret-scan, dockle-scan, license-scan]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "# Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scan Type | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Images (Trivy) | ${{ needs.image-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Best Practices (Dockle) | ${{ needs.dockle-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependencies | ${{ needs.dependency-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Filesystem | ${{ needs.filesystem-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secrets | ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Licenses | ${{ needs.license-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Severity threshold: ${{ env.SEVERITY }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View detailed results in the Security tab." >> $GITHUB_STEP_SUMMARY
