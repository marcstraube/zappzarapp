# Bidirectional sync between GitHub Project board and issue labels
#
# When a card is moved on the Project board, this action updates the
# corresponding issue's labels to reflect the new status.
#
# Column → Label mapping:
#   "To Do" / "Backlog" → removes status labels
#   "In Progress"       → adds status:in-progress
#   "Review"            → adds status:review (removes in-progress)
#   "Done"              → closes the issue
#
# Note: This action only runs when Project board events occur.
# If no Project is configured, this action never triggers.

name: Project Board Sync

on:
  # Trigger when project items are edited (moved between columns)
  projects_v2_item:
    types:
      - edited

# Prevent concurrent runs for the same issue
concurrency:
  group: project-sync-${{ github.event.projects_v2_item.content_node_id }}
  cancel-in-progress: true

jobs:
  sync-labels:
    name: Sync Project Column to Labels
    runs-on: ubuntu-latest

    # Only run if the item is an issue (not a draft or PR)
    if: github.event.projects_v2_item.content_type == 'Issue'

    permissions:
      issues: write
      repository-projects: read

    steps:
      - name: Get Issue and Column Info
        id: get-info
        uses: actions/github-script@v7
        with:
          script: |
            const item = context.payload.projects_v2_item;

            // Get the issue number from the content_node_id
            const issueNodeId = item.content_node_id;

            // Query the issue details
            const query = `
              query($nodeId: ID!) {
                node(id: $nodeId) {
                  ... on Issue {
                    number
                    state
                    labels(first: 20) {
                      nodes {
                        name
                      }
                    }
                  }
                }
              }
            `;

            const result = await github.graphql(query, { nodeId: issueNodeId });

            if (!result.node) {
              core.setFailed('Could not find issue');
              return;
            }

            const issueNumber = result.node.number;
            const currentLabels = result.node.labels.nodes.map(l => l.name);

            core.setOutput('issue_number', issueNumber);
            core.setOutput('current_labels', JSON.stringify(currentLabels));

            console.log(`Issue #${issueNumber}`);
            console.log(`Current labels: ${currentLabels.join(', ')}`);

      - name: Get Project Column
        id: get-column
        uses: actions/github-script@v7
        with:
          script: |
            const item = context.payload.projects_v2_item;
            const projectNodeId = item.project_node_id;
            const itemId = item.node_id;

            // Query the project field values to get the current column
            const query = `
              query($itemId: ID!) {
                node(id: $itemId) {
                  ... on ProjectV2Item {
                    fieldValues(first: 20) {
                      nodes {
                        ... on ProjectV2ItemFieldSingleSelectValue {
                          name
                          field {
                            ... on ProjectV2SingleSelectField {
                              name
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const result = await github.graphql(query, { itemId });

            // Find the Status field value
            let columnName = null;
            for (const fieldValue of result.node?.fieldValues?.nodes || []) {
              if (fieldValue?.field?.name === 'Status') {
                columnName = fieldValue.name;
                break;
              }
            }

            if (!columnName) {
              console.log('No Status field found, skipping');
              core.setOutput('column', '');
              return;
            }

            core.setOutput('column', columnName);
            console.log(`Column: ${columnName}`);

      - name: Update Labels Based on Column
        if: steps.get-column.outputs.column != ''
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ steps.get-info.outputs.issue_number }}');
            const column = '${{ steps.get-column.outputs.column }}';
            const currentLabels = JSON.parse('${{ steps.get-info.outputs.current_labels }}');

            // Status labels to manage
            const statusLabels = ['status:in-progress', 'status:review', 'status:blocked'];

            // Determine which labels to add/remove based on column
            let labelsToAdd = [];
            let labelsToRemove = [];
            let shouldClose = false;

            // Normalize column name for comparison
            const normalizedColumn = column.toLowerCase().replace(/\s+/g, '-');

            switch (normalizedColumn) {
              case 'to-do':
              case 'backlog':
              case 'todo':
                // Remove all status labels
                labelsToRemove = statusLabels.filter(l => currentLabels.includes(l));
                break;

              case 'in-progress':
              case 'in_progress':
                labelsToAdd = ['status:in-progress'];
                labelsToRemove = statusLabels.filter(l => l !== 'status:in-progress' && currentLabels.includes(l));
                break;

              case 'review':
              case 'in-review':
                labelsToAdd = ['status:review'];
                labelsToRemove = statusLabels.filter(l => l !== 'status:review' && currentLabels.includes(l));
                break;

              case 'done':
              case 'completed':
                shouldClose = true;
                labelsToRemove = statusLabels.filter(l => currentLabels.includes(l));
                break;

              default:
                console.log(`Unknown column "${column}", skipping label update`);
                return;
            }

            // Remove labels
            for (const label of labelsToRemove) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: label
                });
                console.log(`Removed label: ${label}`);
              } catch (e) {
                // Label might not exist, ignore
                console.log(`Could not remove label ${label}: ${e.message}`);
              }
            }

            // Add labels
            if (labelsToAdd.length > 0) {
              // Filter out labels that already exist
              const newLabels = labelsToAdd.filter(l => !currentLabels.includes(l));
              if (newLabels.length > 0) {
                try {
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    labels: newLabels
                  });
                  console.log(`Added labels: ${newLabels.join(', ')}`);
                } catch (e) {
                  // Label might not exist in repo
                  console.log(`Could not add labels: ${e.message}`);
                }
              }
            }

            // Close issue if moved to Done
            if (shouldClose) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                state: 'closed',
                state_reason: 'completed'
              });
              console.log(`Closed issue #${issueNumber}`);
            }

            console.log('Sync completed');
