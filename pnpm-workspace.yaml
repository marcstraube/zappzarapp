# pnpm Workspace Configuration
# https://pnpm.io/workspaces
#
# Workspaces share dependencies from root and use a single lock file.
# Each workspace can have framework-specific dependencies while inheriting
# shared tooling (TypeScript, ESLint, Prettier) from root.

packages:
  # Node.js Backend (Express API)
  - 'src/node/backend'
  # Node.js Frontend (User's choice: Nuxt, Next.js, SvelteKit, etc.)
  - 'src/node/frontend'

# Dependency version floors for transitive security fixes.
# pnpm 11 reads `overrides` from here (not from package.json's `pnpm` key).
# Floors must not cross a semver major — one entry per major line with that
# line's backport fix.
overrides:
  'smol-toml@<1.6.1': '>=1.6.1'
  'js-yaml@<3.15.0': '>=3.15.0 <4.0.0'
  'js-yaml@>=4.0.0 <4.3.0': '>=4.3.0 <5.0.0'
  'js-yaml@>=5.0.0 <5.2.2': '>=5.2.2'

# `pnpm audit` exceptions (documented in
# .zappzarapp/docs/security/KNOWN-VULNERABILITIES.md). pnpm 11 reads
# `auditConfig` from here (not from package.json's `pnpm` key).
auditConfig:
  ignoreGhsas:
    - GHSA-mh99-v99m-4gvg

# Build-script approvals. pnpm blocks dependency build scripts by default and
# pnpm 11 hard-fails (ERR_PNPM_IGNORED_BUILDS) on unapproved ones. pnpm 11
# replaced the pnpm-10 `onlyBuiltDependencies` list with this `allowBuilds` map
# (package -> boolean). These two ship prebuilt binaries, so their scripts are
# safe to run.
allowBuilds:
  '@parcel/watcher': true
  esbuild: true

# Don't auto-verify/-install dependencies before every `pnpm run` (a pnpm 11
# default that is not read from .npmrc — it must live here). Dependencies are
# installed explicitly via `make pnpm-install` / `make pnpm-sync`, and
# node_modules lives in a Docker named volume. Without this, pnpm 11 tries to
# purge + reinstall node_modules before each script and aborts on the non-TTY
# container run (ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY).
verifyDepsBeforeRun: false

# Supply-chain hardening: delay installing freshly published versions (guards
# against a compromised release being pulled in immediately). pnpm 11 applies a
# minimum release age by default; declaring it here makes the policy explicit
# and decoupled from any change to the pnpm default. `Strict: true` fails
# resolution when a range can only be satisfied by a too-new version, instead of
# silently falling back to it — so `pnpm add pkg@<fresh-only-range>` fails fast
# rather than writing a pin that a later `pnpm install` rejects. Widen the range
# floor (e.g. `^6` not `^6.31.0`) so pnpm picks the newest AGED version.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
# Exempt exact-pinned platform-binding siblings from the age gate. rolldown@X
# requires @rolldown/binding-*@X (exact, no range), so a binding can never be
# pulled in "fresh" on its own — but the bindings are published minutes AFTER
# their parent, so on release day the parent can be mature while its bindings
# are not, and strict resolution hard-fails
# (ERR_PNPM_NO_MATURE_MATCHING_VERSION). The parent package stays fully gated.
# Extend only with families whose parent pins them exactly.
minimumReleaseAgeExclude:
  - '@rolldown/binding-*'
