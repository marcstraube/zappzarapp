<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zappzarapp Documentation</title>
    <link rel="icon" type="image/svg+xml" href="/docs/assets/favicon.svg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
    <style>
        /**
         * Unified Documentation Theme
         * Color Palette:
         * - Primary: #3f51b5 (Indigo)
         * - Primary Dark: #303f9f
         * - Primary Light: #c5cae9
         * - Primary Lighter: #e8eaf6
         * - Text: #212529
         * - Text Muted: #6c757d
         * - Background: #fff
         * - Background Secondary: #f8f9fa
         * - Border: #e9ecef
         */
        :root {
            --theme-color: #3f51b5;
            --docsify-example-panel-bg: #f8f9fa;
        }

        /* App nav styling - white background */
        .app-nav {
            background: #fff !important;
            border-bottom: 1px solid #e9ecef;
        }

        .app-nav a {
            color: #212529 !important;
        }

        .app-nav a:hover {
            color: #3f51b5 !important;
        }

        /* White background everywhere */
        body, .sidebar, .content {
            background: #fff;
        }

        /* Sidebar */
        .sidebar {
            border-right: 1px solid #e9ecef;
        }

        .sidebar-nav > ul > li > a {
            font-weight: 600;
            color: #303f9f;
        }

        .sidebar-nav a {
            color: #212529;
        }

        .sidebar-nav a:hover,
        .sidebar-nav a.active {
            color: #3f51b5;
        }

        /* App name in sidebar */
        .app-name-link {
            color: #303f9f !important;
            font-weight: 600;
        }

        /* Content */
        .markdown-section {
            max-width: 900px;
            color: #212529;
        }

        .markdown-section a {
            color: #3f51b5;
        }

        .markdown-section a:hover {
            color: #303f9f;
        }

        /* Headings */
        .markdown-section h1,
        .markdown-section h2 {
            color: #303f9f;
            border-bottom: 1px solid #e9ecef;
            padding-bottom: 0.5rem;
        }

        .markdown-section h3,
        .markdown-section h4 {
            color: #212529;
        }

        /* Code blocks */
        .markdown-section pre {
            border-left: 3px solid #3f51b5;
            background: #f8f9fa;
        }

        .markdown-section code {
            background: #e8eaf6;
            color: #303f9f;
            padding: 0.2em 0.4em;
            border-radius: 3px;
        }

        .markdown-section pre code {
            background: transparent;
            color: inherit;
            padding: 0;
        }

        /* Tables */
        .markdown-section table {
            border-collapse: collapse;
        }

        .markdown-section table th {
            background: #e8eaf6;
            color: #303f9f;
            border: 1px solid #c5cae9;
        }

        .markdown-section table td {
            border: 1px solid #e9ecef;
        }

        .markdown-section table tr:nth-child(even) {
            background: #f8f9fa;
        }

        /* Blockquotes */
        .markdown-section blockquote {
            border-left: 4px solid #3f51b5;
            background: #f8f9fa;
            color: #6c757d;
            margin: 1em 0;
            padding: 0.5em 1em;
        }

        /* Copy button */
        .docsify-copy-code-button {
            background: #3f51b5 !important;
            color: #fff !important;
        }

        .docsify-copy-code-button:hover {
            background: #303f9f !important;
        }

        /* Search */
        .search input {
            border-color: #c5cae9 !important;
        }

        .search input:focus {
            border-color: #3f51b5 !important;
            box-shadow: 0 0 0 2px #e8eaf6 !important;
        }

        .matching-post {
            border-bottom: 1px solid #e9ecef;
        }

        .matching-post .search-keyword {
            background: #e8eaf6;
            color: #303f9f;
        }

        /* Pagination */
        .pagination-item-title {
            color: #3f51b5;
        }

        .pagination-item:hover .pagination-item-title {
            color: #303f9f;
        }

        /* Hide sidebar toggle on desktop */
        @media (min-width: 768px) {
            .sidebar-toggle {
                display: none;
            }
        }

        /* API Docs Navigation - starts after sidebar */
        .api-docs-nav {
            position: fixed;
            top: 0;
            right: 0;
            left: 300px;
            z-index: 100;
            background: #fff;
            border-bottom: 1px solid #e9ecef;
            padding: 0.5rem 1rem;
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            font-size: 0.875rem;
        }

        .api-docs-nav a {
            color: #303f9f;
            text-decoration: none;
            padding: 0.25rem 0.75rem;
            border-radius: 0.25rem;
            transition: background-color 0.2s;
        }

        .api-docs-nav a:hover {
            background: #e8eaf6;
        }

        .api-docs-nav .unavailable {
            color: #92400e;
            background: #fef3c7;
            cursor: help;
        }

        .api-docs-nav .unavailable:hover {
            background: #fde68a;
        }

        /* Adjust main content for fixed nav (content area is right of sidebar) */
        .content {
            padding-top: 2.5rem !important;
        }

        /* Missing docs info box */
        .docs-warning {
            background: #fef3c7;
            border: 1px solid #fcd34d;
            border-radius: 0.5rem;
            padding: 1rem 1.5rem;
            margin: 1rem 0;
        }

        .docs-warning-title {
            color: #92400e;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .docs-warning-text {
            color: #78350f;
            font-size: 0.875rem;
        }

        .docs-warning code {
            background: #fde68a !important;
            color: #78350f !important;
            padding: 0.15rem 0.4rem;
        }
    </style>
</head>
<body>
    <!-- API Documentation Navigation -->
    <nav class="api-docs-nav" id="api-docs-nav">
        <span style="color: #6c757d; margin-right: auto;">API Docs:</span>
        <a href="/docs/api/php/" id="link-php-api" class="unavailable" title="Checking...">PHP API</a>
        <a href="/docs/api/node-backend/" id="link-node-backend" class="unavailable" title="Checking...">Node Backend</a>
        <a href="/docs/api/node-frontend/" id="link-node-frontend" class="unavailable" title="Checking...">Node Frontend</a>
    </nav>

    <div id="app">Loading...</div>
    <script>
        window.$docsify = {
            name: 'zappzarapp',
            basePath: '/docs/guides/',
            homepage: 'README.md',
            loadSidebar: true,
            subMaxLevel: 2,
            auto2top: true,
            search: {
                placeholder: 'Search...',
                noData: 'No results found',
                depth: 3
            },
            copyCode: {
                buttonText: 'Copy',
                successText: 'Copied'
            },
            pagination: {
                crossChapter: true,
                crossChapterText: true
            },
            themeColor: '#3f51b5'
        }
    </script>
    <!-- Docsify Core -->
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
    <!-- Plugins -->
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
    <!-- Syntax Highlighting -->
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-php.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-nginx.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-docker.min.js"></script>

    <!-- API Docs Availability Check -->
    <script>
        (function() {
            const apiDocs = [
                { id: 'link-php-api', path: '/docs/api/php/', name: 'PHP API', cmd: 'make docs-php' },
                { id: 'link-node-backend', path: '/docs/api/node-backend/', name: 'Node Backend', cmd: 'make docs-node-backend' },
                { id: 'link-node-frontend', path: '/docs/api/node-frontend/', name: 'Node Frontend', cmd: 'make docs-node-frontend' }
            ];

            const missingDocs = [];

            apiDocs.forEach(function(doc) {
                const link = document.getElementById(doc.id);
                if (!link) return;

                fetch(doc.path, { method: 'HEAD' })
                    .then(function(response) {
                        if (response.ok) {
                            link.classList.remove('unavailable');
                            link.title = 'View ' + doc.name + ' documentation';
                        } else {
                            throw new Error('Not found');
                        }
                    })
                    .catch(function() {
                        link.classList.add('unavailable');
                        link.title = 'Not generated - run: ' + doc.cmd;
                        link.addEventListener('click', function(e) {
                            e.preventDefault();
                            alert(doc.name + ' documentation is not generated.\n\nRun: ' + doc.cmd);
                        });
                        missingDocs.push(doc);
                        updateWarningBanner();
                    });
            });

            function updateWarningBanner() {
                // Add warning to docsify after render
                if (window.$docsify && missingDocs.length > 0) {
                    const originalReady = window.$docsify.plugins || [];
                    window.$docsify.plugins = [].concat(originalReady, [
                        function(hook) {
                            hook.afterEach(function(html, next) {
                                if (missingDocs.length > 0) {
                                    const commands = missingDocs.length === apiDocs.length
                                        ? '<code>make docs</code>'
                                        : missingDocs.map(d => '<code>' + d.cmd + '</code>').join(' or ');

                                    const warning = '<div class="docs-warning">' +
                                        '<div class="docs-warning-title">Some API Documentation Not Generated</div>' +
                                        '<div class="docs-warning-text">' +
                                        'The following API docs are missing: ' +
                                        missingDocs.map(d => d.name).join(', ') + '. ' +
                                        'Generate with: ' + commands +
                                        '</div></div>';

                                    // Only add warning once at the top of the main README
                                    if (!html.includes('docs-warning') && location.hash.match(/^#\/?$/)) {
                                        html = warning + html;
                                    }
                                }
                                next(html);
                            });
                        }
                    ]);
                }
            }
        })();
    </script>
</body>
</html>
