# GitLab Security Scan Pipeline
#
# This is a standalone pipeline for comprehensive security scanning.
# Include in your main .gitlab-ci.yml or run as a separate pipeline.
#
# GitLab jobs do NOT share a Docker daemon (each dind service is job-local),
# so every job builds exactly what it scans — there is no shared build stage.
#
# Usage:
#   Option 1: Include in main pipeline
#     include:
#       - local: '.gitlab/security-scan.gitlab-ci.yml'
#     Heavy jobs (image scans, dependency audit, ZAP) run only for
#     scheduled/manually started pipelines and for merge requests that touch
#     build inputs; the lightweight filesystem/config/secret scans run always.
#
#   Option 2: Run as scheduled pipeline
#     Go to CI/CD > Schedules > New schedule
#     Set cron: 0 2 * * 0 (Weekly Sunday 2 AM)
#     Target branch: master
#
# Variables (optional, set in CI/CD Settings):
#   SEVERITY: Minimum severity (default: HIGH,CRITICAL)

variables:
  COMPOSE_PROJECT_NAME: zappzarapp-security
  SEVERITY: "HIGH,CRITICAL"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  # Upstream-only, not-fixable-by-us findings are filtered by the package-level
  # policy .trivy/ignore-policy.rego (passed via --ignore-policy). Do NOT set
  # TRIVY_IGNOREFILE here: trivy hard-fails when the named file is absent.
  # Single Trivy pin for both consumption forms: the aquasec/trivy job image
  # (filesystem/config/secret scans) and the release binary installed into the
  # dind-based image-scan jobs. Renovate tracks this via a regex customManager
  # on the github-releases datasource.
  TRIVY_VERSION: "0.73.0"

stages:
  - scan
  - report

# Common setup for Docker-based jobs
.docker-setup: &docker-setup
  image: docker:29-cli
  services:
    - docker:29-dind
  before_script:
    - apk add --no-cache docker-compose curl bash
    - docker compose version

# Heavy jobs (image builds, app startup): run for scheduled/manual pipelines,
# and for merge requests that touch the build inputs.
.heavy-scan-rules: &heavy-scan-rules
  - if: $CI_PIPELINE_SOURCE == "schedule"
  - if: $CI_PIPELINE_SOURCE == "web"
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    changes:
      - docker/**
      - compose*.yaml
      - composer.json
      - composer.lock
      - package.json
      - pnpm-lock.yaml

# ==============================================================================
# DOCKER IMAGE VULNERABILITY SCANS
# ==============================================================================
# Mirrors the matrix in .github/workflows/security-scan.yml: build only
# cross-image-COPY-free stages (dev/base/final/single-stage), so no
# goss/node-backend bake context is needed. Single-stage Dockerfiles omit
# SCAN_TARGET. All Dockerfiles are at docker/<image>/Dockerfile and COPY
# repo-root-relative paths, so the build context is the repo root.
scan:image:
  <<: *docker-setup
  stage: scan
  parallel:
    matrix:
      - IMAGE: php
        SCAN_TARGET: development
      - IMAGE: node
        SCAN_TARGET: development
      - IMAGE: nginx
        SCAN_TARGET: development
      - IMAGE: postgres
        SCAN_TARGET: final
      - IMAGE: mariadb
      - IMAGE: redis
        SCAN_TARGET: base
      # Optional services
      - IMAGE: elasticsearch
      - IMAGE: meilisearch
      - IMAGE: rabbitmq
      - IMAGE: mercure
      - IMAGE: mailpit
      - IMAGE: seaweedfs
  rules: *heavy-scan-rules
  script:
    - curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | tar -xz -C /usr/local/bin trivy
    - docker build ${SCAN_TARGET:+--target ${SCAN_TARGET}} -t ${COMPOSE_PROJECT_NAME}-${IMAGE}:scan -f docker/${IMAGE}/Dockerfile .
    # --ignore-policy: package-level filter for upstream-only components we
    # cannot patch (bundled binaries/JARs/runtime); see .trivy/ignore-policy.rego.
    - trivy image --severity ${SEVERITY} --ignore-unfixed --ignore-policy .trivy/ignore-policy.rego --format table ${COMPOSE_PROJECT_NAME}-${IMAGE}:scan
    - trivy image --severity ${SEVERITY} --ignore-unfixed --ignore-policy .trivy/ignore-policy.rego --format json --output trivy-${IMAGE}-report.json ${COMPOSE_PROJECT_NAME}-${IMAGE}:scan || true
  artifacts:
    paths:
      - trivy-${IMAGE}-report.json
    reports:
      container_scanning: trivy-${IMAGE}-report.json
    when: always
    expire_in: 30 days
  allow_failure: true

# ==============================================================================
# DEPENDENCY VULNERABILITY SCAN
# ==============================================================================
scan:dependencies:
  <<: *docker-setup
  stage: scan
  rules: *heavy-scan-rules
  variables:
    # Mirror the main pipeline's dependency-audit job: the CI overlay ships
    # CI-safe entrypoint settings (idle node mode, php dependency-check skip)
    # and mounts NO lockfiles — the lockfiles are not committed, and a
    # single-file bind mount of a missing host file materializes as a
    # directory inside the container. They are generated fresh in-container
    # instead, which is also why pnpm must not run with --frozen-lockfile.
    COMPOSE_FILE: "compose.yaml:compose.ci.yaml"
  before_script:
    # openssl/acl: for `make secrets` / `make ssl-internal` — the CI overlay
    # bind-mounts the generated certs and secrets into php/node.
    - apk add --no-cache docker-compose curl bash make openssl acl
    - make init
    - make secrets
    - make ssl-internal
  script:
    - docker compose up -d --build php node
    - sleep 5
    - docker compose exec -T php composer install --no-progress --no-interaction
    - docker compose exec -T node pnpm install
    - echo "=== PHP Dependencies ===" | tee dependency-audit.txt
    - docker compose exec -T php composer audit --format=summary | tee -a dependency-audit.txt || true
    - docker compose exec -T php composer audit --format=json > composer-audit.json || true
    - echo "" >> dependency-audit.txt
    - echo "=== Node.js Dependencies ===" | tee -a dependency-audit.txt
    - docker compose exec -T node pnpm audit | tee -a dependency-audit.txt || true
    - docker compose exec -T node pnpm audit --json > pnpm-audit.json || true
  after_script:
    - docker compose down -v
  artifacts:
    paths:
      - dependency-audit.txt
      - composer-audit.json
      - pnpm-audit.json
    when: always
    expire_in: 30 days
  allow_failure: true

# ==============================================================================
# FILESYSTEM & CONFIG SCAN
# ==============================================================================
# The trivy/gitleaks images ship the tool as ENTRYPOINT; GitLab passes the job
# script to the entrypoint, so it must be cleared to get a shell.
scan:filesystem:
  image:
    name: aquasec/trivy:${TRIVY_VERSION}
    entrypoint: [""]
  stage: scan
  script:
    # vuln only: secret scanning is handled by scan:secrets + scan:gitleaks, so
    # the default vuln,secret scanners would surface the dummy example tokens in
    # the committed .env template as findings here.
    - trivy fs --scanners vuln --severity ${SEVERITY} --ignore-unfixed --ignore-policy .trivy/ignore-policy.rego --format table .
    - trivy fs --scanners vuln --severity ${SEVERITY} --ignore-unfixed --ignore-policy .trivy/ignore-policy.rego --format json --output trivy-fs-report.json . || true
  artifacts:
    paths:
      - trivy-fs-report.json
    when: always
    expire_in: 30 days
  allow_failure: true

scan:config:
  image:
    name: aquasec/trivy:${TRIVY_VERSION}
    entrypoint: [""]
  stage: scan
  script:
    - trivy config --severity ${SEVERITY} --format table .
    - trivy config --severity ${SEVERITY} --format json --output trivy-config-report.json . || true
  artifacts:
    paths:
      - trivy-config-report.json
    when: always
    expire_in: 30 days
  allow_failure: true

# ==============================================================================
# SECRET SCANNING
# ==============================================================================
scan:secrets:
  image:
    name: aquasec/trivy:${TRIVY_VERSION}
    entrypoint: [""]
  stage: scan
  script:
    - trivy fs --scanners secret --severity ${SEVERITY} --format table .
    - trivy fs --scanners secret --severity ${SEVERITY} --format json --output trivy-secrets-report.json . || true
  artifacts:
    paths:
      - trivy-secrets-report.json
    when: always
    expire_in: 30 days
  allow_failure: true

scan:gitleaks:
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]
  stage: scan
  script:
    - gitleaks detect --source . --verbose --report-format json --report-path gitleaks-report.json || true
  artifacts:
    paths:
      - gitleaks-report.json
    when: always
    expire_in: 30 days
  allow_failure: true

# ==============================================================================
# OWASP ZAP SCAN (DAST)
# ==============================================================================
scan:zap:
  <<: *docker-setup
  stage: scan
  rules: *heavy-scan-rules
  variables:
    # Set to "full" (maintainers) for a comprehensive scan of all services;
    # unset/empty defaults to "normal" (respects .env). No repo auto-detection.
    ZAP_SCAN_MODE: ""
  before_script:
    # openssl: required by `make secrets` / `make ssl-internal`. acl: provides
    # setfacl, which `make ssl-internal` uses to grant the unprivileged
    # production containers (redis, php, rabbitmq) read access to the 600-mode
    # TLS keys — without it they crash on startup and never turn healthy.
    - apk add --no-cache docker-compose curl bash make git openssl acl
    - make init
    - make secrets
    - make ssl-internal
  script:
    # Scan mode: the ZAP_SCAN_MODE CI/CD variable overrides; otherwise "normal".
    - |
      if [[ -n "$ZAP_SCAN_MODE" ]]; then
        SCAN_MODE="$ZAP_SCAN_MODE"
      else
        SCAN_MODE="normal"
      fi

    - 'echo "Repository: $CI_PROJECT_PATH"'
    - 'echo "Scan mode: $SCAN_MODE"'

    # Start application with appropriate configuration
    - |
      if [[ "$SCAN_MODE" == "full" ]]; then
        echo "Starting all services for comprehensive scan..."
        make security-zap-full-start
      else
        echo "Starting services based on .env configuration..."
        make security-zap-start
      fi

    # Run ZAP baseline scan
    - make security-zap-scan
  after_script:
    # Cleanup (runs always, even on failure)
    - make security-zap-stop || true
  artifacts:
    paths:
      - zap-report.html
      - zap-report.json
    when: always
    expire_in: 30 days
  allow_failure: true

# ==============================================================================
# SECURITY REPORT SUMMARY
# ==============================================================================
# No needs: stage ordering already waits for the scan stage, and the default
# artifact download collects every scan report — including from the matrix
# jobs, whose generated names a static needs list cannot reference. Rules-
# filtered jobs (heavy scans on push pipelines) simply contribute nothing.
security-report:
  image: alpine:3.23
  stage: report
  script:
    - apk add --no-cache jq
    - |
      echo "# Security Scan Summary" > security-summary.md
      echo "" >> security-summary.md
      echo "**Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> security-summary.md
      echo "**Severity Threshold:** ${SEVERITY}" >> security-summary.md
      echo "" >> security-summary.md
      echo "## Scan Results" >> security-summary.md
      echo "" >> security-summary.md
      echo "| Scan Type | Status |" >> security-summary.md
      echo "|-----------|--------|" >> security-summary.md

      # Check each scan result (must match the scan:image matrix list).
      # No ${scan^} capitalization: that is a bashism, and this runs in
      # alpine's /bin/sh ("bad substitution").
      for scan in php node nginx postgres mariadb redis elasticsearch meilisearch rabbitmq mercure mailpit seaweedfs; do
        if [ -f "trivy-${scan}-report.json" ]; then
          # jq-only sum: bc is not installed in the alpine job image, and the
          # ||-fallback would silently turn every count into 0 ("Clean")
          count=$(jq '[.Results[]?.Vulnerabilities // [] | length] | add // 0' "trivy-${scan}-report.json" 2>/dev/null || echo "0")
          if [ "$count" -gt 0 ]; then
            echo "| ${scan} image | :warning: ${count} vulnerabilities |" >> security-summary.md
          else
            echo "| ${scan} image | :white_check_mark: Clean |" >> security-summary.md
          fi
        else
          echo "| ${scan} image | :grey_question: Not scanned |" >> security-summary.md
        fi
      done

      echo "| Dependencies | $([ -f composer-audit.json ] && echo ':white_check_mark: Scanned' || echo ':grey_question: Not scanned') |" >> security-summary.md
      echo "| Filesystem | $([ -f trivy-fs-report.json ] && echo ':white_check_mark: Scanned' || echo ':grey_question: Not scanned') |" >> security-summary.md
      echo "| Config | $([ -f trivy-config-report.json ] && echo ':white_check_mark: Scanned' || echo ':grey_question: Not scanned') |" >> security-summary.md
      echo "| Secrets | $([ -f trivy-secrets-report.json ] && echo ':white_check_mark: Scanned' || echo ':grey_question: Not scanned') |" >> security-summary.md
      echo "| OWASP ZAP (DAST) | $([ -f zap-report.json ] && echo ':white_check_mark: Scanned' || echo ':grey_question: Not scanned') |" >> security-summary.md

      echo "" >> security-summary.md
      echo "## Artifacts" >> security-summary.md
      echo "" >> security-summary.md
      echo "Download the job artifacts for detailed reports." >> security-summary.md

      cat security-summary.md
  artifacts:
    paths:
      - security-summary.md
    when: always
    expire_in: 30 days
  when: always
