# GitLab Security Scan Pipeline
#
# This is a standalone pipeline for comprehensive security scanning.
# Include in your main .gitlab-ci.yml or run as a separate pipeline.
#
# Usage:
#   Option 1: Include in main pipeline
#     include:
#       - local: '.gitlab/security-scan.gitlab-ci.yml'
#
#   Option 2: Run as scheduled pipeline
#     Go to CI/CD > Schedules > New schedule
#     Set cron: 0 2 * * 0 (Weekly Sunday 2 AM)
#     Target branch: master
#
# Variables (optional, set in CI/CD Settings):
#   SEVERITY: Minimum severity (default: HIGH,CRITICAL)

variables:
  COMPOSE_PROJECT_NAME: zappzarapp-security
  SEVERITY: "HIGH,CRITICAL"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  # Baseline of upstream-only, not-fixable-by-us CVEs (see .trivyignore.yaml).
  # Trivy honours TRIVY_IGNOREFILE; entries only match vuln IDs, so config/
  # secret scans are unaffected.
  TRIVY_IGNOREFILE: ".trivyignore.yaml"

stages:
  - build
  - scan
  - report

# Common setup for Docker-based jobs
.docker-setup: &docker-setup
  image: docker:29-cli
  services:
    - docker:29-dind
  before_script:
    - apk add --no-cache docker-compose curl bash
    - docker compose version

# ==============================================================================
# BUILD STAGE
# ==============================================================================
build:images:
  <<: *docker-setup
  stage: build
  script:
    - docker compose build php node nginx
    # Build only cross-image-COPY-free stages (mirrors .github/workflows/
    # security-scan.yml): `--target final` skips the CI-only goss test stage,
    # whose tagless `COPY --from=goss` resolves only inside the bake context
    # graph. Both Dockerfiles COPY repo-root-relative paths, so the build
    # context must be the repo root.
    - docker build --target final -t ${COMPOSE_PROJECT_NAME}-postgres:scan -f docker/postgres/Dockerfile .
    - docker build -t ${COMPOSE_PROJECT_NAME}-mariadb:scan -f docker/mariadb/Dockerfile .
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - docker/**
        - compose*.yaml
        - composer.json
        - composer.lock
        - package.json
        - pnpm-lock.yaml

# ==============================================================================
# DOCKER IMAGE VULNERABILITY SCANS
# ==============================================================================
.trivy-image-scan: &trivy-image-scan
  image: aquasec/trivy:0.72.0
  stage: scan
  needs:
    - build:images
  script:
    # --ignore-policy: package-level filter for upstream-only components we
    # cannot patch (bundled binaries/JARs/runtime); see .trivy/ignore-policy.rego.
    - trivy image --severity ${SEVERITY} --ignore-unfixed --ignore-policy .trivy/ignore-policy.rego --format table ${IMAGE_NAME}
    - trivy image --severity ${SEVERITY} --ignore-unfixed --ignore-policy .trivy/ignore-policy.rego --format json --output trivy-${IMAGE_SHORT}-report.json ${IMAGE_NAME} || true
  artifacts:
    paths:
      - trivy-${IMAGE_SHORT}-report.json
    reports:
      container_scanning: trivy-${IMAGE_SHORT}-report.json
    when: always
    expire_in: 30 days
  allow_failure: true

scan:php-image:
  <<: *trivy-image-scan
  variables:
    IMAGE_NAME: ${COMPOSE_PROJECT_NAME}-php:latest
    IMAGE_SHORT: php

scan:node-image:
  <<: *trivy-image-scan
  variables:
    IMAGE_NAME: ${COMPOSE_PROJECT_NAME}-node:latest
    IMAGE_SHORT: node

scan:nginx-image:
  <<: *trivy-image-scan
  variables:
    IMAGE_NAME: ${COMPOSE_PROJECT_NAME}-nginx:latest
    IMAGE_SHORT: nginx

scan:postgres-image:
  <<: *trivy-image-scan
  variables:
    IMAGE_NAME: ${COMPOSE_PROJECT_NAME}-postgres:scan
    IMAGE_SHORT: postgres

scan:mariadb-image:
  <<: *trivy-image-scan
  variables:
    IMAGE_NAME: ${COMPOSE_PROJECT_NAME}-mariadb:scan
    IMAGE_SHORT: mariadb

# ==============================================================================
# DEPENDENCY VULNERABILITY SCAN
# ==============================================================================
scan:dependencies:
  <<: *docker-setup
  stage: scan
  needs:
    - build:images
  script:
    - docker compose up -d php node
    - docker compose exec -T php composer install --no-progress --no-interaction
    - docker compose exec -T node pnpm install --frozen-lockfile
    - echo "=== PHP Dependencies ===" | tee dependency-audit.txt
    - docker compose exec -T php composer audit --format=summary | tee -a dependency-audit.txt || true
    - docker compose exec -T php composer audit --format=json > composer-audit.json || true
    - echo "" >> dependency-audit.txt
    - echo "=== Node.js Dependencies ===" | tee -a dependency-audit.txt
    - docker compose exec -T node pnpm audit | tee -a dependency-audit.txt || true
    - docker compose exec -T node pnpm audit --json > pnpm-audit.json || true
  after_script:
    - docker compose down -v
  artifacts:
    paths:
      - dependency-audit.txt
      - composer-audit.json
      - pnpm-audit.json
    when: always
    expire_in: 30 days
  allow_failure: true

# ==============================================================================
# FILESYSTEM & CONFIG SCAN
# ==============================================================================
scan:filesystem:
  image: aquasec/trivy:0.72.0
  stage: scan
  script:
    # vuln only: secret scanning is handled by scan:secrets + scan:gitleaks, so
    # the default vuln,secret scanners would surface the dummy example tokens in
    # the committed .env template as findings here.
    - trivy fs --scanners vuln --severity ${SEVERITY} --ignore-unfixed --ignore-policy .trivy/ignore-policy.rego --format table .
    - trivy fs --scanners vuln --severity ${SEVERITY} --ignore-unfixed --ignore-policy .trivy/ignore-policy.rego --format json --output trivy-fs-report.json . || true
  artifacts:
    paths:
      - trivy-fs-report.json
    when: always
    expire_in: 30 days
  allow_failure: true

scan:config:
  image: aquasec/trivy:0.72.0
  stage: scan
  script:
    - trivy config --severity ${SEVERITY} --format table .
    - trivy config --severity ${SEVERITY} --format json --output trivy-config-report.json . || true
  artifacts:
    paths:
      - trivy-config-report.json
    when: always
    expire_in: 30 days
  allow_failure: true

# ==============================================================================
# SECRET SCANNING
# ==============================================================================
scan:secrets:
  image: aquasec/trivy:0.72.0
  stage: scan
  script:
    - trivy fs --scanners secret --severity ${SEVERITY} --format table .
    - trivy fs --scanners secret --severity ${SEVERITY} --format json --output trivy-secrets-report.json . || true
  artifacts:
    paths:
      - trivy-secrets-report.json
    when: always
    expire_in: 30 days
  allow_failure: true

scan:gitleaks:
  image: zricethezav/gitleaks:latest
  stage: scan
  script:
    - gitleaks detect --source . --verbose --report-format json --report-path gitleaks-report.json || true
  artifacts:
    paths:
      - gitleaks-report.json
    when: always
    expire_in: 30 days
  allow_failure: true

# ==============================================================================
# OWASP ZAP SCAN (DAST)
# ==============================================================================
scan:zap:
  <<: *docker-setup
  stage: scan
  needs:
    - build:images
  variables:
    # Set to "full" (maintainers) for a comprehensive scan of all services;
    # unset/empty defaults to "normal" (respects .env). No repo auto-detection.
    ZAP_SCAN_MODE: ""
  before_script:
    - apk add --no-cache docker-compose curl bash make git
    - make init
    - make secrets
    - make ssl-internal
  script:
    # Scan mode: the ZAP_SCAN_MODE CI/CD variable overrides; otherwise "normal".
    - |
      if [[ -n "$ZAP_SCAN_MODE" ]]; then
        SCAN_MODE="$ZAP_SCAN_MODE"
      else
        SCAN_MODE="normal"
      fi

    - 'echo "Repository: $CI_PROJECT_PATH"'
    - 'echo "Scan mode: $SCAN_MODE"'

    # Start application with appropriate configuration
    - |
      if [[ "$SCAN_MODE" == "full" ]]; then
        echo "Starting all services for comprehensive scan..."
        make security-zap-full-start
      else
        echo "Starting services based on .env configuration..."
        make security-zap-start
      fi

    # Run ZAP baseline scan
    - make security-zap-scan
  after_script:
    # Cleanup (runs always, even on failure)
    - make security-zap-stop || true
  artifacts:
    paths:
      - zap-report.html
      - zap-report.json
    when: always
    expire_in: 30 days
  allow_failure: true

# ==============================================================================
# SECURITY REPORT SUMMARY
# ==============================================================================
security-report:
  image: alpine:latest
  stage: report
  needs:
    - scan:php-image
    - scan:node-image
    - scan:nginx-image
    - scan:postgres-image
    - scan:mariadb-image
    - scan:dependencies
    - scan:filesystem
    - scan:config
    - scan:secrets
    - scan:gitleaks
    - scan:zap
  script:
    - apk add --no-cache jq
    - |
      echo "# Security Scan Summary" > security-summary.md
      echo "" >> security-summary.md
      echo "**Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> security-summary.md
      echo "**Severity Threshold:** ${SEVERITY}" >> security-summary.md
      echo "" >> security-summary.md
      echo "## Scan Results" >> security-summary.md
      echo "" >> security-summary.md
      echo "| Scan Type | Status |" >> security-summary.md
      echo "|-----------|--------|" >> security-summary.md

      # Check each scan result
      for scan in php node nginx postgres mariadb; do
        if [ -f "trivy-${scan}-report.json" ]; then
          count=$(jq '.Results[]?.Vulnerabilities // [] | length' "trivy-${scan}-report.json" 2>/dev/null | paste -sd+ | bc 2>/dev/null || echo "0")
          if [ "$count" -gt 0 ]; then
            echo "| ${scan^} Image | :warning: ${count} vulnerabilities |" >> security-summary.md
          else
            echo "| ${scan^} Image | :white_check_mark: Clean |" >> security-summary.md
          fi
        else
          echo "| ${scan^} Image | :grey_question: Not scanned |" >> security-summary.md
        fi
      done

      echo "| Dependencies | $([ -f composer-audit.json ] && echo ':white_check_mark: Scanned' || echo ':grey_question: Not scanned') |" >> security-summary.md
      echo "| Filesystem | $([ -f trivy-fs-report.json ] && echo ':white_check_mark: Scanned' || echo ':grey_question: Not scanned') |" >> security-summary.md
      echo "| Config | $([ -f trivy-config-report.json ] && echo ':white_check_mark: Scanned' || echo ':grey_question: Not scanned') |" >> security-summary.md
      echo "| Secrets | $([ -f trivy-secrets-report.json ] && echo ':white_check_mark: Scanned' || echo ':grey_question: Not scanned') |" >> security-summary.md
      echo "| OWASP ZAP (DAST) | $([ -f zap-report.json ] && echo ':white_check_mark: Scanned' || echo ':grey_question: Not scanned') |" >> security-summary.md

      echo "" >> security-summary.md
      echo "## Artifacts" >> security-summary.md
      echo "" >> security-summary.md
      echo "Download the job artifacts for detailed reports." >> security-summary.md

      cat security-summary.md
  artifacts:
    paths:
      - security-summary.md
    when: always
    expire_in: 30 days
  when: always
