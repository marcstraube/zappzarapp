# ./compose.prod.yaml
# Docker Compose Production Environment

services:
  nginx:
    build:
      target: production
    # Optional: Mount production configs and SSL certificates (uncomment if needed)
    # volumes:
    #   - ./docker/nginx/conf.d/csp-production.conf:/etc/nginx/conf.d/csp.conf:ro
    #   - ./docker/nginx/conf.d/ssl-production.conf:/etc/nginx/conf.d/ssl.conf:ro
    #   - ./docker/nginx/certs:/etc/nginx/certs:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:mode=0770,uid=101,gid=101,size=64M
      - /tmp/nginx:mode=0770,uid=101,gid=101,size=32M
      - /var/run:mode=0770,uid=101,gid=101,size=16M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

  php:
    build:
      target: production
    volumes:
      # Persistent Storage for Uploads and generated files
      - ${STORAGE_DIR:-./storage}:/var/www/html/storage:rw
    read_only: true
    tmpfs:
      - /tmp:mode=0770,uid=82,gid=82,size=1G
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - ENV=production
      - NODE_ENV=production
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

  node:
    read_only: true
    tmpfs:
      - /tmp:mode=0770,uid=50000,gid=50000,size=256M
      - /home/node/.cache:mode=0770,uid=50000,gid=50000,size=256M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  redis:
    read_only: true
    tmpfs:
      - /tmp:mode=0770,uid=999,gid=999,size=64M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  postgres:
    read_only: false
    tmpfs:
      - /tmp:mode=0770,uid=70,gid=70,size=256M
      - /run/postgresql:mode=0770,uid=70,gid=70,size=64M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    shm_size: 256mb
    # Optional: Mount SSL certificates for encrypted connections (uncomment if needed)
    # volumes:
    #   - ./docker/nginx/certs/cert.crt:/var/lib/postgresql/server.crt:ro
    #   - ./docker/nginx/certs/cert.key:/var/lib/postgresql/server.key:ro
    command: >
      postgres
      -c shared_buffers=256MB
      -c max_connections=100
      -c effective_cache_size=512MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=2621kB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c log_destination=stderr
      -c logging_collector=off
      -c log_min_duration_statement=1000
      # Uncomment to enable SSL (requires certificates mounted above)
      # -c ssl=on
      # -c ssl_cert_file=/var/lib/postgresql/server.crt
      # -c ssl_key_file=/var/lib/postgresql/server.key
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  mariadb:
    read_only: false
    tmpfs:
      - /tmp:mode=0770,uid=999,gid=999,size=256M
      - /var/run/mysqld:mode=0770,uid=999,gid=999,size=64M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    shm_size: 256mb
    # Optional: Mount SSL certificates for encrypted connections (uncomment if needed)
    # volumes:
    #   - ./docker/nginx/certs/cert.crt:/etc/mysql/certs/server.crt:ro
    #   - ./docker/nginx/certs/cert.key:/etc/mysql/certs/server.key:ro
    command: >
      --innodb-buffer-pool-size=256M
      --max-connections=100
      --innodb-log-file-size=64M
      --innodb-flush-log-at-trx-commit=2
      --innodb-flush-method=O_DIRECT
      --slow-query-log=1
      --slow-query-log-file=/var/log/mysql/slow.log
      --long-query-time=1
      # Uncomment to enable SSL (requires certificates mounted above)
      # --ssl-ca=/etc/mysql/certs/server.crt
      # --ssl-cert=/etc/mysql/certs/server.crt
      # --ssl-key=/etc/mysql/certs/server.key
      # --require-secure-transport=ON
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
