# Trivy vulnerability baseline
#
# Every entry below is a HIGH/CRITICAL, *fixable* CVE (scans run with
# --ignore-unfixed) that we cannot remediate ourselves: the vulnerable
# component is baked into an upstream image or language runtime, and the only
# fix is an upstream release we do not control. Image/tool versions are already
# bumped to the newest patch within their pinned line and the Alpine-based
# images run `apk upgrade`, so what remains here is genuinely upstream-only.
#
# `expired-at` forces periodic review: once the date passes, the CVE reappears
# in scans so we re-check whether an upstream fix has shipped. Set 2026-07-30.
#
# Do NOT add fixable-by-us CVEs here — fix those at the source instead.

vulnerabilities:
  # ---------------------------------------------------------------------------
