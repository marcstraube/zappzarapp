  # ---------------------------------------------------------------------------
  # pnpm (our pinned PNPM_VERSION, currently 10.34.0 = newest 10.x). These six
  # are fixed only in pnpm 11.x. A build test showed pnpm 11 is NOT a drop-in:
  # it no longer reads the `pnpm.overrides` / `pnpm.auditConfig` fields from
  # package.json (this project relies on both for security override floors and
  # the brace-expansion audit exception), so the bump requires migrating that
  # config to pnpm-workspace.yaml first. Tracked as a follow-up; short expiry
  # so it resurfaces once the migration is done.
  # Affects: node.
  # ---------------------------------------------------------------------------
  - id: CVE-2026-55487
    statement: "pnpm; fixed only in pnpm 11.x, which needs a config migration first (overrides/auditConfig no longer read from package.json)."
    expired-at: 2026-09-15
