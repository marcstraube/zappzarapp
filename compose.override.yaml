# ./compose.override.yaml
# Docker Compose Development Environment

services:
  nginx:
    build:
      target: development
      args:
        USER_ID: ${USER_ID:-101}
        GROUP_ID: ${GROUP_ID:-101}
    volumes:
      # Application
      - ./public:/var/www/html/public:ro
      - ./docs:/var/www/html/docs:ro

      # Nginx Configuration (Read-Only)
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro

  php:
    build:
      target: development
      args:
        USER_ID: ${USER_ID:-82}
        GROUP_ID: ${GROUP_ID:-82}
    volumes:
      # Application
      - ./composer.json:/var/www/html/composer.json
      - ./composer.lock:/var/www/html/composer.lock
      - ./config:/var/www/html/config
      - ./docs:/var/www/html/docs
      - ./public:/var/www/html/public
      - ./src/php:/var/www/html/src/php
      - ./templates:/var/www/html/templates
      - ./tests/php:/var/www/html/tests/php
      - ./tools:/var/www/html/tools
      - ./vendor:/var/www/html/vendor

      # Quality Assurance Tools Config
      - ./phpstan.neon:/var/www/html/phpstan.neon:ro
      - ./phpmd.xml.dist:/var/www/html/phpmd.xml.dist:ro
      - ./.php-cs-fixer.dist.php:/var/www/html/.php-cs-fixer.dist.php:ro
      - ./phpunit.xml.dist:/var/www/html/phpunit.xml.dist:ro

      # Documentation Config
      - ./phpdoc.xml:/var/www/html/phpdoc.xml:ro

      # Runtime Data (Read-Write)
      - ${STORAGE_DIR:-./storage}:/var/www/html/storage

      # PHP Configuration (Read-Only)
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini:ro
      - ./docker/php/php-fpm.conf:/usr/local/etc/php-fpm.d/zz-custom.conf:ro
      - ./docker/php/conf.d/development.ini:/usr/local/etc/php/conf.d/zz-env.ini:ro
      - ./docker/php/conf.d/xdebug.ini:/usr/local/etc/php/conf.d/zz-xdebug.ini:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ENV=development
      - XDEBUG_MODE=${XDEBUG_MODE:-off}
      - ENABLE_PHP=${ENABLE_PHP:-true}
      - ENABLE_NODE=${ENABLE_NODE:-true}
      - ENABLE_REDIS=${ENABLE_REDIS:-true}
      - NODE_MODE=${NODE_MODE:-full-stack}
      - DB_TYPE=${DB_TYPE:-postgres}
      - DB_NAME=${DB_NAME:-app}
      - DB_USER=${DB_USER:-app}
      - DB_PASSWORD=${DB_PASSWORD:-secret}

  node:
    build:
      target: development
      args:
        USER_ID: ${USER_ID:-50000}
        GROUP_ID: ${GROUP_ID:-50000}
    ports:
      - "${VITE_PORT:-5173}:5173"
      - "${NODE_PORT:-3000}:3000"
    volumes:
      # Application
      - ./package.json:/app/package.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./src/node:/app/src/node
      - ./tests/node:/app/tests/node
      - ./public:/app/public
      - ./resources:/app/resources
      - ./dist:/app/dist
      - node_modules:/app/node_modules
      - ./docs:/app/docs

      # Build & Config
      - ./vite.config.js:/app/vite.config.js:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./tsconfig.vitest.json:/app/tsconfig.vitest.json:ro
      - ./vitest.config.ts:/app/vitest.config.ts:ro
      - ./postcss.config.js:/app/postcss.config.js:ro
      - ./ecosystem.config.cjs:/app/ecosystem.config.cjs:ro

      # Quality Assurance Tools Config
      - ./eslint.config.js:/app/eslint.config.js:ro
      - ./.prettierrc.json:/app/.prettierrc.json:ro
      - ./.prettierignore:/app/.prettierignore:ro
      - ./commitlint.config.js:/app/commitlint.config.js:ro

      # Documentation Config
      - ./typedoc.json:/app/typedoc.json:ro

      # Git repository (for commitlint)
      - ./.git:/app/.git:ro

      # Build Output
      - ./build:/app/build
    environment:
      - NODE_ENV=development
      - NODE_MODE=${NODE_MODE:-full-stack}
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://${DB_USER:-app}:${DB_PASSWORD:-secret}@postgres:5432/${DB_NAME:-app}
    tty: true

  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --appendonly no
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --loglevel verbose

  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    command: >
      postgres
      -c shared_buffers=128MB
      -c max_connections=50
      -c log_statement=all
      -c log_min_duration_statement=0

  mariadb:
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    command: >
      --general-log=1
      --general-log-file=/var/log/mysql/general.log
      --slow-query-log=1
      --slow-query-log-file=/var/log/mysql/slow.log
      --long-query-time=0

volumes:
  node_modules:
    driver: local
