# ./compose.override.yaml
# Docker Compose Development Environment
#
# SERVICE ORDER: Core → Data → Optional (alphabetically within each category)
#   Core:     nginx, node, node-backend, php, dev-tools
#   Data:     mariadb, postgres, redis
#   Optional: elasticsearch, mailpit, meilisearch, mercure, rabbitmq, seaweedfs

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # CORE SERVICES
  # ═══════════════════════════════════════════════════════════════════════════

  nginx:
    build:
      target: development
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    image: ${COMPOSE_PROJECT_NAME:-zappzarapp}-nginx:development
    volumes:
      # Application
      - ./public:/var/www/html/public:ro
      - ./docs:/var/www/html/docs:ro
      - ./.zappzarapp:/var/www/html/.zappzarapp:ro
      # Build outputs (test coverage, reports)
      - ./build:/var/www/html/build:ro

      # Nginx Configuration (Read-Only)
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/snippets:/etc/nginx/snippets:ro
      # SSL template (processed by entrypoint, includes HTTP->HTTPS redirect)
      - ./docker/nginx/conf.d/ssl-development.conf.template:/etc/nginx/conf.d/ssl-development.conf.template:ro

  node:
    build:
      target: development
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    image: ${COMPOSE_PROJECT_NAME:-zappzarapp}-node:development
    ports:
      # Only Vite HMR exposed for development (hot reload requires direct WebSocket)
      # Backend (3000) and Frontend (3001) accessed via Nginx only (HTTPS on 8443)
      - "${VITE_PORT:-5173}:5173"
    volumes:
      # Entrypoint Script (production stages use direct CMD, no entrypoint needed)
      - ./docker/node/entrypoint.development.sh:/usr/local/bin/entrypoint.development.sh:ro

      # Frontend scaffolding patches (for make frontend-* commands)
      - ./docker/node/frontend-patches:/app/docker/node/frontend-patches:ro

      # Package manager files (bidirectional bind mount for pnpm update/add/remove)
      # Not copied in Dockerfile development stage to avoid frozen-lockfile issues
      - ./package.json:/app/package.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml

      # Dependencies (named volumes for best cross-platform performance)
      - node_modules:/app/node_modules

      # Source and Tests (bidirectional bind mounts for ESLint, Prettier, etc.)
      # Note: src/php and tests/php are mounted for lint-staged git restore operations
      - ./src:/app/src

      # Workspace node_modules (override bind mount - MUST be after ./src mount)
      # These volumes are populated by 'make pnpm-install' and persist workspace deps
      - backend_node_modules:/app/src/node/backend/node_modules
      - frontend_node_modules:/app/src/node/frontend/node_modules
      - ./tests:/app/tests
      - ./resources:/app/resources

      # Build output and public assets (bind mounts for direct access)
      - ./dist:/app/dist
      - ./public:/app/public
      - ./docs:/app/docs
      - ./build:/app/build

      # Build config files (needed for Vite, TypeScript, PM2)
      - ./vite.config.js:/app/vite.config.js:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./tsconfig.resources.json:/app/tsconfig.resources.json:ro
      - ./tsconfig.base.json:/app/tsconfig.base.json:ro
      - ./tsconfig.build.json:/app/tsconfig.build.json:ro
      - ./tsconfig.vitest.json:/app/tsconfig.vitest.json:ro
      - ./tsconfig.typedoc.json:/app/tsconfig.typedoc.json:ro
      - ./vitest.config.ts:/app/vitest.config.ts:ro
      - ./ecosystem.config.cjs:/app/ecosystem.config.cjs:ro
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml:ro

      # Static config files (read-only bind mounts, rarely change)
      - ./postcss.config.js:/app/postcss.config.js:ro
      - ./eslint.config.js:/app/eslint.config.js:ro
      - ./.prettierrc.json:/app/.prettierrc.json:ro
      - ./.prettierignore:/app/.prettierignore:ro
      - ./commitlint.config.js:/app/commitlint.config.js:ro
      - ./typedoc.backend.json:/app/typedoc.backend.json:ro
      - ./typedoc.frontend.json:/app/typedoc.frontend.json:ro
      - ./.markdownlint-cli2.jsonc:/app/.markdownlint-cli2.jsonc:ro
      - ./lint-staged.config.js:/app/lint-staged.config.js:ro
      - ./.depcheckrc.json:/app/.depcheckrc.json:ro
      - ./knip.config.js:/app/knip.config.js:ro

      # Markdown files (read-write for Prettier/markdownlint)
      - ./.zappzarapp:/app/.zappzarapp
      - ./README.md:/app/README.md

      # PHP templates (for lint-staged git restore operations)
      - ./templates:/app/templates

      # Git repository (for commitlint and lint-staged)
      - ./.git:/app/.git
    environment:
      - TZ=${TZ:-UTC}
      - NODE_ENV=development
      - NODE_MODE=${NODE_MODE:-assets-api}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-pretty}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      # Database (12-Factor: DATABASE_URL takes precedence)
      # Priority: DATABASE_URL > DB_PASSWORD_FILE (from compose.yaml) > DB_PASSWORD
      - DATABASE_URL=${DATABASE_URL:-}
      - DB_TYPE=${DB_TYPE:-postgres}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-app}
      - DB_USER=${DB_USER:-app}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_SSL_CA=${DB_SSL_CA:-}
      - DB_SSL_VERIFY=${DB_SSL_VERIFY:-false}
      - REDIS_URL=${REDIS_URL:-rediss://redis:6379}
    tty: true

  node-backend:
    build:
      target: development
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    image: ${COMPOSE_PROJECT_NAME:-zappzarapp}-node-backend:development
    volumes:
      # Entrypoint Script (production stages use direct CMD, no entrypoint needed)
      - ./docker/node/entrypoint.development.sh:/usr/local/bin/entrypoint.development.sh:ro

      # Package manager files (bidirectional bind mount for pnpm update/add/remove)
      - ./package.json:/app/package.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml

      # Dependencies (named volumes for best cross-platform performance)
      - node_modules:/app/node_modules

      # Source and Tests (bidirectional bind mounts for ESLint, Prettier, etc.)
      - ./src:/app/src

      # Workspace node_modules (override bind mount - MUST be after ./src mount)
      - backend_node_modules:/app/src/node/backend/node_modules
      - frontend_node_modules:/app/src/node/frontend/node_modules
      - ./tests:/app/tests

      # Build output and public assets
      - ./dist:/app/dist
      - ./public:/app/public
      - ./build:/app/build

      # Build config files (needed for TypeScript, PM2)
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./tsconfig.resources.json:/app/tsconfig.resources.json:ro
      - ./tsconfig.base.json:/app/tsconfig.base.json:ro
      - ./tsconfig.build.json:/app/tsconfig.build.json:ro
      - ./ecosystem.config.cjs:/app/ecosystem.config.cjs:ro
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml:ro

      # Git repository (for commitlint)
      - ./.git:/app/.git
    environment:
      - TZ=${TZ:-UTC}
      - NODE_ENV=development
      # node-backend always runs the Express API backend
      - NODE_MODE=api
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-pretty}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      # Database (12-Factor: DATABASE_URL takes precedence)
      # Priority: DATABASE_URL > DB_PASSWORD_FILE (from compose.yaml) > DB_PASSWORD
      - DATABASE_URL=${DATABASE_URL:-}
      - DB_TYPE=${DB_TYPE:-postgres}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-app}
      - DB_USER=${DB_USER:-app}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_SSL_CA=${DB_SSL_CA:-}
      - DB_SSL_VERIFY=${DB_SSL_VERIFY:-false}
      - REDIS_URL=${REDIS_URL:-rediss://redis:6379}
    tty: true

  php:
    build:
      target: development
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    image: ${COMPOSE_PROJECT_NAME:-zappzarapp}-php:development
    entrypoint: ["/entrypoint.development.sh"]
    command: ["php-fpm"]
    volumes:
      # Entrypoint Script
      - ./docker/php/entrypoint.development.sh:/entrypoint.development.sh:ro

      # Composer files (bidirectional bind mount for composer update/require/remove)
      # Not copied in Dockerfile development stage to avoid overlay-fs write issues
      - ./composer.json:/var/www/html/composer.json
      - ./composer.lock:/var/www/html/composer.lock

      # Dependencies (named volume for best cross-platform performance)
      - php_vendor:/var/www/html/vendor

      # Source and Tests (bidirectional bind mounts for CS Fixer, PHPStan, etc.)
      - ./src/php:/var/www/html/src/php
      - ./tests/php:/var/www/html/tests/php
      - ./templates:/var/www/html/templates

      # Configuration files
      - ./config:/var/www/html/config:ro

      # Build outputs and docs
      - ./build:/var/www/html/build
      - ./docs:/var/www/html/docs
      - ./public:/var/www/html/public
      - ./tools:/var/www/html/tools

      # Quality Assurance Tools Config (PHP)
      - ./phpstan.neon:/var/www/html/phpstan.neon:ro
      - ./phpmd.xml.dist:/var/www/html/phpmd.xml.dist:ro
      - ./.php-cs-fixer.dist.php:/var/www/html/.php-cs-fixer.dist.php:ro
      - ./phpunit.xml.dist:/var/www/html/phpunit.xml.dist:ro
      - ./rector.php:/var/www/html/rector.php:ro

      # Quality Assurance Tools Config (Node.js - for Dashboard visibility)
      - ./eslint.config.js:/var/www/html/eslint.config.js:ro
      - ./.prettierrc.json:/var/www/html/.prettierrc.json:ro
      - ./tsconfig.json:/var/www/html/tsconfig.json:ro

      # Node.js source for code statistics
      - ./src/node:/var/www/html/src/node:ro
      - ./tests/node:/var/www/html/tests/node:ro

      # Git repository (for git status in Dashboard)
      - ./.git:/var/www/html/.git:ro

      # Documentation and boilerplate config
      - ./phpdoc.xml:/var/www/html/phpdoc.xml:ro
      - ./.zappzarapp:/var/www/html/.zappzarapp:ro

      # SSL Certificates (for Health Check Dashboard)
      - ./docker/certs:/var/www/html/docker/certs:ro

      # Docker Scripts (for DevDashboard backup functionality)
      - ./docker/scripts:/var/www/html/docker/scripts:ro
      - ./backups:/var/www/html/backups

      # Environment file (for backup script configuration)
      - ./.env:/var/www/html/.env:ro

      # Docker socket (for backup script to exec into database containers)
      - /var/run/docker.sock:/var/run/docker.sock

      # Runtime Data (Read-Write)
      - ${STORAGE_DIR:-./storage}:/var/www/html/storage

      # PHP Configuration (Read-Only)
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini:ro
      - ./docker/php/php-fpm.conf:/usr/local/etc/php-fpm.d/www.conf:ro
      - ./docker/php/zz-docker.conf:/usr/local/etc/php-fpm.d/zz-docker.conf:ro

      # PHP Extension Configuration (conf.d/)
      # Each extension has its own INI file for easy enable/disable (comment out extension= line)
      # INIs are loaded alphabetically - zz-* prefix ensures overrides load last
      # Note: curl is statically compiled into PHP and cannot be disabled
      - ./docker/php/conf.d/exif.ini:/usr/local/etc/php/conf.d/exif.ini:ro
      - ./docker/php/conf.d/gd.ini:/usr/local/etc/php/conf.d/gd.ini:ro
      - ./docker/php/conf.d/gmagick.ini:/usr/local/etc/php/conf.d/gmagick.ini:ro
      - ./docker/php/conf.d/intl.ini:/usr/local/etc/php/conf.d/intl.ini:ro
      - ./docker/php/conf.d/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini:ro
      - ./docker/php/conf.d/pdo_mysql.ini:/usr/local/etc/php/conf.d/pdo_mysql.ini:ro
      - ./docker/php/conf.d/pdo_pgsql.ini:/usr/local/etc/php/conf.d/pdo_pgsql.ini:ro
      - ./docker/php/conf.d/redis.ini:/usr/local/etc/php/conf.d/redis.ini:ro
      - ./docker/php/conf.d/sodium.ini:/usr/local/etc/php/conf.d/sodium.ini:ro
      - ./docker/php/conf.d/zip.ini:/usr/local/etc/php/conf.d/zip.ini:ro

      # Development-only overrides (loaded last due to zz-* prefix)
      - ./docker/php/conf.d/development.ini:/usr/local/etc/php/conf.d/zz-development.ini:ro
      - ./docker/php/conf.d/xdebug.ini:/usr/local/etc/php/conf.d/zz-xdebug.ini:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=${TZ:-UTC}
      - ZAPPZARAPP_ENV=development
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-zappzarapp}
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-pretty}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - XDEBUG_MODE=${XDEBUG_MODE:-off}
      - ENABLE_PHP=${ENABLE_PHP:-true}
      - ENABLE_NODE=${ENABLE_NODE:-true}
      # Skip vendor check in entrypoint (set to 1 for manual container startup without deps)
      - PHP_SKIP_DEPENDENCY_CHECK=${PHP_SKIP_DEPENDENCY_CHECK:-0}
      - ENABLE_DATABASE=${ENABLE_DATABASE:-true}
      - ENABLE_REDIS=${ENABLE_REDIS:-true}
      - ENABLE_MERCURE=${ENABLE_MERCURE:-false}
      - ENABLE_MEILISEARCH=${ENABLE_MEILISEARCH:-false}
      - ENABLE_ELASTICSEARCH=${ENABLE_ELASTICSEARCH:-false}
      - ENABLE_MAILPIT=${ENABLE_MAILPIT:-false}
      - ENABLE_SEAWEEDFS=${ENABLE_SEAWEEDFS:-false}
      - ENABLE_RABBITMQ=${ENABLE_RABBITMQ:-false}
      - NODE_MODE=${NODE_MODE:-assets-api}
      # Database (12-Factor: DATABASE_URL takes precedence)
      # Priority: DATABASE_URL > DB_PASSWORD_FILE (from compose.yaml) > DB_PASSWORD
      - DATABASE_URL=${DATABASE_URL:-}
      - DB_TYPE=${DB_TYPE:-postgres}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-app}
      - DB_USER=${DB_USER:-app}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_SSL_CA=${DB_SSL_CA:-}
      - DB_SSL_VERIFY=${DB_SSL_VERIFY:-false}
      - REDIS_URL=${REDIS_URL:-rediss://redis:6379}

  # ═══════════════════════════════════════════════════════════════════════════
  # DEV-TOOLS - Dedicated container for Git hooks and linting
  # ═══════════════════════════════════════════════════════════════════════════
  # Usage: docker compose run --rm dev-tools pnpm exec <command>
  #
  # This container is independent of NODE_MODE and always has devDependencies.
  # Used by captainhook for pre-commit, commit-msg, and pre-push hooks.
  # ═══════════════════════════════════════════════════════════════════════════
  dev-tools:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
      target: development
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    profiles:
      - tools
    working_dir: /app
    user: node
    volumes:
      # Package manager files
      - ./package.json:/app/package.json:ro
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml:ro
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml:ro

      # Dependencies (shared with node/node-backend for consistency)
      - node_modules:/app/node_modules

      # Source and Tests (read-write for lint-staged auto-fix)
      - ./src:/app/src
      - ./tests:/app/tests
      - ./templates:/app/templates
      - ./docker:/app/docker
      # Frontend asset sources — knip analyzes resources/js via its entry
      # pattern; without this mount every resources/** pattern is dead
      - ./resources:/app/resources

      # Workspace node_modules (MUST be after ./src mount)
      - backend_node_modules:/app/src/node/backend/node_modules
      - frontend_node_modules:/app/src/node/frontend/node_modules

      # Documentation and boilerplate config (read-write for Prettier/markdownlint)
      - ./.zappzarapp:/app/.zappzarapp
      - ./.claude:/app/.claude
      - ./.github:/app/.github
      - ./AGENTS.md:/app/AGENTS.md
      - ./README.md:/app/README.md
      - ./CHANGELOG.md:/app/CHANGELOG.md
      - ./CONTRIBUTING.md:/app/CONTRIBUTING.md
      - ./CODE_OF_CONDUCT.md:/app/CODE_OF_CONDUCT.md
      - ./SECURITY.md:/app/SECURITY.md

      # Linting/Formatting config files
      - ./eslint.config.js:/app/eslint.config.js:ro
      - ./.prettierrc.json:/app/.prettierrc.json:ro
      - ./.prettierignore:/app/.prettierignore:ro
      - ./commitlint.config.js:/app/commitlint.config.js:ro
      - ./.markdownlint-cli2.jsonc:/app/.markdownlint-cli2.jsonc:ro
      - ./lint-staged.config.js:/app/lint-staged.config.js:ro
      - ./.depcheckrc.json:/app/.depcheckrc.json:ro
      - ./knip.config.js:/app/knip.config.js:ro

      # TypeScript config (for type-check)
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./tsconfig.resources.json:/app/tsconfig.resources.json:ro
      - ./tsconfig.base.json:/app/tsconfig.base.json:ro
      - ./tsconfig.build.json:/app/tsconfig.build.json:ro
      - ./tsconfig.vitest.json:/app/tsconfig.vitest.json:ro
      - ./vitest.config.ts:/app/vitest.config.ts:ro

      # Git repository (required for commitlint, lint-staged)
      - ./.git:/app/.git
    environment:
      - TZ=${TZ:-UTC}
      - NODE_ENV=development
    # No entrypoint - run commands directly
    entrypoint: []
    command: ["echo", "dev-tools container ready"]

  # ═══════════════════════════════════════════════════════════════════════════
  # DATA SERVICES
  # ═══════════════════════════════════════════════════════════════════════════

  mariadb:
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    entrypoint: ["/entrypoint-wrapper.sh"]
    volumes:
      # Custom entrypoint for SSL certificate setup
      - ./docker/mariadb/entrypoint.sh:/entrypoint-wrapper.sh:ro
      # SSL/TLS Certificates for encrypted database connections (mounted to /tmp first)
      - ./docker/certs/internal/cert.crt:/tmp/certs/server.crt:ro
      - ./docker/certs/internal/cert.key:/tmp/certs/server.key:ro
    command: >
      --general-log=1
      --general-log-file=/var/log/mysql/general.log
      --slow-query-log=1
      --slow-query-log-file=/var/log/mysql/slow.log
      --long-query-time=0
      --ssl-ca=/etc/mysql/certs/server.crt
      --ssl-cert=/etc/mysql/certs/server.crt
      --ssl-key=/etc/mysql/certs/server.key
      --require-secure-transport=ON

  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    entrypoint: ["/entrypoint-wrapper.sh"]
    volumes:
      # Custom entrypoint for SSL certificate setup
      - ./docker/postgres/entrypoint.sh:/entrypoint-wrapper.sh:ro
      # SSL/TLS Certificates for encrypted database connections (mounted to /tmp first)
      - ./docker/certs/internal/cert.crt:/tmp/certs/server.crt:ro
      - ./docker/certs/internal/cert.key:/tmp/certs/server.key:ro
    command: >
      postgres
      -c shared_buffers=128MB
      -c max_connections=50
      -c log_statement=all
      -c log_min_duration_statement=0
      -c ssl=on
      -c ssl_cert_file=/run/postgresql/certs/server.crt
      -c ssl_key_file=/run/postgresql/certs/server.key
      -c shared_preload_libraries=pg_cron
      -c cron.database_name=${DB_NAME:-app}

  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      # SSL/TLS Certificates for encrypted connections (same as production for parity)
      - ./docker/certs/internal/cert.crt:/etc/ssl/certs/redis.crt:ro
      - ./docker/certs/internal/cert.key:/etc/ssl/private/redis.key:ro
      - ./docker/certs/internal/ca.crt:/etc/ssl/certs/internal-ca.crt:ro
    command: >
      redis-server
      --appendonly no
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --loglevel verbose
      --tls-port 6379
      --port 0
      --tls-cert-file /etc/ssl/certs/redis.crt
      --tls-key-file /etc/ssl/private/redis.key
      --tls-auth-clients no

  # ═══════════════════════════════════════════════════════════════════════════
  # OPTIONAL SERVICES - Development Overrides (alphabetically sorted)
  # ═══════════════════════════════════════════════════════════════════════════

  elasticsearch:
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
      - "${ELASTICSEARCH_TRANSPORT_PORT:-9300}:9300"
    environment:
      # Development: Keep security enabled for internal TLS (dev/prod parity)
      # Security settings are inherited from compose.yaml
      # Enable verbose logging
      logger.level: INFO

  mailpit:
    ports:
      # SMTP port for sending emails
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      # Web UI for viewing emails
      - "${MAILPIT_UI_PORT:-8025}:8025"

  meilisearch:
    ports:
      - "${MEILISEARCH_PORT:-7700}:7700"
    environment:
      # Development environment
      MEILI_ENV: development
      # Log level for debugging
      MEILI_LOG_LEVEL: INFO

  mercure:
    ports:
      - "${MERCURE_PORT:-8081}:80"
    environment:
      # Development: Allow all CORS origins
      MERCURE_EXTRA_DIRECTIVES: |
        anonymous
        cors_origins *
        debug

  rabbitmq:
    ports:
      # AMQP port for messaging (TLS)
      - "${RABBITMQ_PORT:-5672}:5672"
      # Management UI port
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      # SSL/TLS Certificates for encrypted connections
      - ./docker/certs/internal/cert.crt:/etc/rabbitmq/certs/server.crt:ro
      - ./docker/certs/internal/cert.key:/etc/rabbitmq/certs/server.key:ro
      # RabbitMQ TLS configuration
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro

  seaweedfs:
    ports:
      # S3 API port (TLS)
      - "${SEAWEEDFS_S3_PORT:-8333}:8333"

volumes:
  node_modules:
    driver: local
  # Workspace node_modules (pnpm workspaces install here)
  backend_node_modules:
    driver: local
  frontend_node_modules:
    driver: local
  php_vendor:
    driver: local
