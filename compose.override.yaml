# ./compose.override.yaml
# Docker Compose Development Environment

services:
  nginx:
    build:
      target: development
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    volumes:
      # Application
      - ./public:/var/www/html/public:ro
      - ./docs:/var/www/html/docs:ro

      # Nginx Configuration (Read-Only)
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Mount only base configs (not SSL configs - those are opt-in via compose.yaml)
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/conf.d/csp-production.conf:/etc/nginx/conf.d/csp-production.conf:ro
      # SSL template (will be processed by entrypoint)
      - ./docker/nginx/conf.d/ssl-development.conf.template:/etc/nginx/conf.d/ssl-development.conf.template:ro

  php:
    build:
      target: development
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    entrypoint: ["/entrypoint.dev.sh"]
    command: ["php-fpm"]
    develop:
      watch:
        # Composer files (sync+restart to pick up dependency changes)
        - action: sync+restart
          path: ./composer.json
          target: /var/www/html/composer.json
        - action: sync+restart
          path: ./composer.lock
          target: /var/www/html/composer.lock
        # Sync source code changes (no rebuild needed)
        - action: sync
          path: ./src/php
          target: /var/www/html/src/php
        - action: sync
          path: ./tests/php
          target: /var/www/html/tests/php
        - action: sync
          path: ./templates
          target: /var/www/html/templates
    volumes:
      # Entrypoint Script
      - ./docker/php/entrypoint.dev.sh:/entrypoint.dev.sh:ro

      # Dependencies (named volume for best cross-platform performance)
      - php_vendor:/var/www/html/vendor

      # Configuration files
      - ./config:/var/www/html/config:ro

      # Build outputs and docs
      - ./build:/var/www/html/build
      - ./docs:/var/www/html/docs
      - ./public:/var/www/html/public
      - ./tools:/var/www/html/tools

      # Quality Assurance Tools Config (PHP)
      - ./phpstan.neon:/var/www/html/phpstan.neon:ro
      - ./phpmd.xml.dist:/var/www/html/phpmd.xml.dist:ro
      - ./.php-cs-fixer.dist.php:/var/www/html/.php-cs-fixer.dist.php:ro
      - ./phpunit.xml.dist:/var/www/html/phpunit.xml.dist:ro
      - ./rector.php:/var/www/html/rector.php:ro

      # Quality Assurance Tools Config (Node.js - for Dashboard visibility)
      - ./eslint.config.js:/var/www/html/eslint.config.js:ro
      - ./.prettierrc.json:/var/www/html/.prettierrc.json:ro
      - ./tsconfig.json:/var/www/html/tsconfig.json:ro

      # Node.js source for code statistics
      - ./src/node:/var/www/html/src/node:ro
      - ./tests/node:/var/www/html/tests/node:ro

      # Git repository (for git status in Dashboard)
      - ./.git:/var/www/html/.git:ro

      # Documentation Config
      - ./phpdoc.xml:/var/www/html/phpdoc.xml:ro

      # Runtime Data (Read-Write)
      - ${STORAGE_DIR:-./storage}:/var/www/html/storage

      # PHP Configuration (Read-Only)
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini:ro
      - ./docker/php/php-fpm.conf:/usr/local/etc/php-fpm.d/www.conf:ro
      - ./docker/php/zz-docker.conf:/usr/local/etc/php-fpm.d/zz-docker.conf:ro
      - ./docker/php/conf.d/development.ini:/usr/local/etc/php/conf.d/zz-env.ini:ro
      - ./docker/php/conf.d/xdebug.ini:/usr/local/etc/php/conf.d/zz-xdebug.ini:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ENV=development
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-pretty}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - XDEBUG_MODE=${XDEBUG_MODE:-off}
      - ENABLE_PHP=${ENABLE_PHP:-true}
      - ENABLE_NODE=${ENABLE_NODE:-true}
      - ENABLE_REDIS=${ENABLE_REDIS:-true}
      - NODE_MODE=${NODE_MODE:-full-stack}
      - DB_TYPE=${DB_TYPE:-postgres}
      - DB_NAME=${DB_NAME:-app}
      - DB_USER=${DB_USER:-app}
      - DB_PASSWORD=${DB_PASSWORD:-secret}

  node:
    build:
      target: development
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    ports:
      - "${VITE_PORT:-5173}:5173"
      - "${NODE_PORT:-3000}:3000"
    develop:
      watch:
        # Rebuild when dependencies change
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml
        # Sync config files (restart container to pick up changes)
        - action: sync+restart
          path: ./tsconfig.json
          target: /app/tsconfig.json
        - action: sync+restart
          path: ./tsconfig.build.json
          target: /app/tsconfig.build.json
        - action: sync+restart
          path: ./tsconfig.vitest.json
          target: /app/tsconfig.vitest.json
        - action: sync+restart
          path: ./vitest.config.ts
          target: /app/vitest.config.ts
        - action: sync+restart
          path: ./vite.config.js
          target: /app/vite.config.js
        - action: sync+restart
          path: ./ecosystem.config.cjs
          target: /app/ecosystem.config.cjs
        # Sync source code changes (no rebuild needed)
        - action: sync
          path: ./src/node
          target: /app/src/node
        - action: sync
          path: ./tests/node
          target: /app/tests/node
        - action: sync
          path: ./resources
          target: /app/resources
    volumes:
      # Dependencies (named volumes for best cross-platform performance)
      - node_modules:/app/node_modules

      # Build output and public assets (bind mounts for direct access)
      - ./dist:/app/dist
      - ./public:/app/public
      - ./docs:/app/docs
      - ./build:/app/build

      # Static config files (read-only bind mounts, rarely change)
      - ./postcss.config.js:/app/postcss.config.js:ro
      - ./eslint.config.js:/app/eslint.config.js:ro
      - ./.prettierrc.json:/app/.prettierrc.json:ro
      - ./.prettierignore:/app/.prettierignore:ro
      - ./commitlint.config.js:/app/commitlint.config.js:ro
      - ./typedoc.json:/app/typedoc.json:ro

      # Git repository (for commitlint)
      - ./.git:/app/.git:ro
    environment:
      - NODE_ENV=development
      - NODE_MODE=${NODE_MODE:-full-stack}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-pretty}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - REDIS_URL=redis://redis:6379
      # Database connection (app derives host/port from DB_TYPE)
      - DB_TYPE=${DB_TYPE:-postgres}
      - DB_NAME=${DB_NAME:-app}
      - DB_USER=${DB_USER:-app}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
    tty: true

  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --appendonly no
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --loglevel verbose

  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    entrypoint: ["/entrypoint-wrapper.sh"]
    volumes:
      # Custom entrypoint for SSL certificate setup
      - ./docker/postgres/entrypoint.sh:/entrypoint-wrapper.sh:ro
      # SSL/TLS Certificates for encrypted database connections (mounted to /tmp first)
      - ./docker/certs/cert.crt:/tmp/certs/server.crt:ro
      - ./docker/certs/cert.key:/tmp/certs/server.key:ro
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    command: >
      postgres
      -c shared_buffers=128MB
      -c max_connections=50
      -c log_statement=all
      -c log_min_duration_statement=0
      -c ssl=on
      -c ssl_cert_file=/var/lib/postgresql/server.crt
      -c ssl_key_file=/var/lib/postgresql/server.key

  mariadb:
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    entrypoint: ["/entrypoint-wrapper.sh"]
    volumes:
      # Custom entrypoint for SSL certificate setup
      - ./docker/mariadb/entrypoint.sh:/entrypoint-wrapper.sh:ro
      # SSL/TLS Certificates for encrypted database connections (mounted to /tmp first)
      - ./docker/certs/cert.crt:/tmp/certs/server.crt:ro
      - ./docker/certs/cert.key:/tmp/certs/server.key:ro
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    command: >
      --general-log=1
      --general-log-file=/var/log/mysql/general.log
      --slow-query-log=1
      --slow-query-log-file=/var/log/mysql/slow.log
      --long-query-time=0
      --ssl-ca=/etc/mysql/certs/server.crt
      --ssl-cert=/etc/mysql/certs/server.crt
      --ssl-key=/etc/mysql/certs/server.key
      --require-secure-transport=ON

volumes:
  node_modules:
    driver: local
  php_vendor:
    driver: local
